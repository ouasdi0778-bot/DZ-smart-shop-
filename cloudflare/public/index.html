<script>/*
 * Communes d'Ecotrack (v1.13) : recherche en français ou en arabe, commune reconnue, communes proches.
 * Partagé par le moteur Cloudflare (server.js) et l'application (client-cloud.js) : mêmes règles des deux côtés.
 *
 * Une commune : { w: n° de wilaya, n: nom chez Ecotrack, p: code postal, s: 1 si bureau stop desk, a: nom arabe }.
 *
 *   find(index, wilaya, texte)      la commune écrite (même orthographe, ou même nom arabe), sinon null
 *   suggest(index, wilaya, texte, adresse)   jusqu'à 3 communes proches (orthographe, nom dans l'adresse)
 *   search(index, wilaya, recherche)          communes de la wilaya qui correspondent (début du nom d'abord)
 */
var DZC = (function () {
  'use strict';
  // Wilayas créées en 2019 : leurs communes étaient avant dans ces wilayas (table des noms arabes).
  var PARENT = { 49: 1, 50: 1, 51: 7, 52: 8, 53: 11, 54: 11, 55: 30, 56: 33, 57: 39, 58: 47 };

  function str(s) { return String(s == null ? '' : s); }
  function isArabic(s) { return /[؀-ۿ]/.test(str(s)); }
  /** « Aïn El-Turck » → « aineltruck » : minuscules, sans accents, lettres seulement. */
  function latin(s) { return str(s).normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z]/g, ''); }
  function arabicWords(s) {
    return str(s).replace(/[ً-ٰٟـ]/g, '')
      .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
      .replace(/[^ء-ي]+/g, ' ').split(' ').filter(function (w) { return w && w !== 'بلديه' && w !== 'البلديه'; });
  }
  /** Nom arabe sans voyelles ni espaces, lettres proches unifiées (أ إ آ → ا, ة → ه, ى → ي). */
  function arabic(s) { return arabicWords(s).join(''); }
  /**
   * Plus souple : sans l'article « ال » (« عين البنيان » = « عين بنيان »), « وادي » = « واد »,
   * fin de mot ة / ا / ي indifférente (« السانية » = « السانيا »).
   */
  function arabicLoose(s) {
    return arabicWords(s).map(function (w) {
      if (w === 'وادي' || w === 'الوادي') return 'واد';
      if (w.length > 3) w = w.replace(/^ال/, '');
      return w.length > 3 ? w.replace(/[اهي]$/, '') : w;
    }).join('');
  }
  /** Squelette : « Azazgua » = « Azazga », « Bab zouar » = « Bab Ezzouar » (consonnes, sans lettres doublées). */
  function skel(s) {
    var l = latin(s).replace(/dj/g, 'j').replace(/ch/g, 'sh').replace(/ou/g, 'u').replace(/gh/g, 'r');
    if (!l) return '';
    return (l[0] + l.slice(1).replace(/[aeiouy]/g, '')).replace(/(.)\1+/g, '$1');
  }
  function lev(a, b) {
    if (a === b) return 0;
    if (!a.length || !b.length) return Math.max(a.length, b.length);
    var prev = [];
    for (var j = 0; j <= b.length; j++) prev[j] = j;
    for (var i = 1; i <= a.length; i++) {
      var cur = [i];
      for (var k = 1; k <= b.length; k++) cur[k] = Math.min(prev[k] + 1, cur[k - 1] + 1, prev[k - 1] + (a[i - 1] === b[k - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[b.length];
  }
  /** Ressemblance de 0 à 1 entre deux textes déjà normalisés. */
  function sim(a, b) { return a && b ? 1 - lev(a, b) / Math.max(a.length, b.length) : 0; }

  /**
   * Communes groupées par wilaya. Tri et clés de recherche préparés seulement pour la wilaya demandée
   * (peu de calcul : le moteur Cloudflare gratuit compte chaque milliseconde).
   */
  function index(list) {
    var byW = {};
    (list || []).forEach(function (c) { (byW[c.w] = byW[c.w] || []).push(c); });
    return { byW: byW, sorted: {}, keys: {}, n: (list || []).length };
  }
  function listOf(idx, w) {
    var l = idx && idx.byW[w];
    if (!l) return null;
    if (!idx.sorted[w]) { l.sort(function (x, y) { return x.n < y.n ? -1 : x.n > y.n ? 1 : 0; }); idx.sorted[w] = true; }
    return l;
  }
  function keysOf(idx, w) {
    if (!idx || !idx.byW[w]) return null;
    if (idx.keys[w]) return idx.keys[w];
    var k = {};
    var add = function (key, c) { if (key.length > 3) (k[key] = k[key] || []).push(c); };
    idx.byW[w].forEach(function (c) {
      add('l:' + latin(c.n), c);
      if (c.a) { add('a:' + arabic(c.a), c); add('A:' + arabicLoose(c.a), c); }
    });
    idx.keys[w] = k;
    return k;
  }

  function find(idx, w, text) {
    var k = keysOf(idx, w);
    var t = str(text).trim();
    if (!k || !t) return null;
    var tries = isArabic(t) ? ['a:' + arabic(t), 'A:' + arabicLoose(t)] : ['l:' + latin(t)];
    for (var i = 0; i < tries.length; i++) {
      var hit = k[tries[i]];
      if (hit && hit.length === 1) return hit[0];
    }
    return null;
  }

  function suggest(idx, w, text, extra) {
    var list = listOf(idx, w);
    if (!list) return [];
    var t = str(text).trim();
    var ar = isArabic(t);
    var tl = latin(t);
    var ta = arabic(t);
    var ts = skel(t);
    var hayL = latin(t + ' ' + str(extra));
    var hayA = arabic(t + ' ' + str(extra));
    var scored = [];
    list.forEach(function (c) {
      var cl = latin(c.n);
      var ca = c.a ? arabic(c.a) : '';
      var s = ar ? (ca ? sim(ta, ca) : 0) : Math.max(sim(tl, cl), ts && ts.length > 2 && ts === skel(c.n) ? 0.9 : 0);
      // Nom de la commune écrit dans la commune ou l'adresse (« Bab Ezzouar, cité 500 logements »).
      if (cl.length >= 4 && hayL.indexOf(cl) >= 0) s = Math.max(s, 0.85 + cl.length / 1000);
      if (ca.length >= 4 && hayA.indexOf(ca) >= 0) s = Math.max(s, 0.85 + ca.length / 1000);
      if (s >= 0.6) scored.push([s, c]);
    });
    scored.sort(function (x, y) { return y[0] - x[0] || x[1].n.localeCompare(y[1].n, 'fr'); });
    return scored.slice(0, 3).map(function (x) { return x[1]; });
  }

  function search(idx, w, q) {
    var list = listOf(idx, w) || [];
    var t = str(q).trim();
    var ar = isArabic(t);
    var key = ar ? arabic(t) : latin(t);
    if (!key) return list.slice();
    var starts = [];
    var inside = [];
    list.forEach(function (c) {
      var v = ar ? (c.a ? arabic(c.a) : '') : latin(c.n);
      var i = v.indexOf(key);
      if (i === 0) starts.push(c); else if (i > 0) inside.push(c);
    });
    return starts.concat(inside);
  }

  /**
   * Ajoute le nom arabe. Table { « wilaya d'avant 2019:nom » : nom arabe, « 0:nom » pour un nom unique en
   * Algérie } préparée une fois pour toutes (cloudflare/tools/communes-ar.js) : ici, une simple lecture.
   */
  function enrich(list, table) {
    var t = table || {};

var c = window.DZ_CLOUD;
var el = $('#install-banner');
var phone = window.matchMedia && window.matchMedia('(max-width: 860px)').matches;
var show = c && c.install && !c.standalone() && phone && !dismissed('install', 7) && (c.canInstall() || c.isIos());
if (!show) { if (el) el.remove(); return; }
el = bannerSlot('install-banner', 'auth-banner app-banner');
el.innerHTML = '<span class="ab-ic">📲</span><span><strong>Installer l’application</strong> : icône sur l’écran d’accueil, plein écran, notifications.' +
(c.canInstall() ? '' : ' Sur iPhone : bouton <strong>Partager</strong> ⬆ puis <strong>Sur l’écran d’accueil</strong>.') + '</span>' +
(c.canInstall() ? '<button type="button" class="btn primary" data-act="app-install">Installer</button>' : '') +
'<button type="button" class="icon-btn" data-act="banner-close" data-key="install" aria-label="Plus tard">×</button>';
}
document.addEventListener('dz-installable', showInstallBanner);
document.addEventListener('dz-installed', function () { var el = $('#install-banner'); if (el) el.remove(); toast('Application installée : ouvrez-la depuis l’écran d’accueil.'); });
function showPushBanner() {
var c = window.DZ_CLOUD;
var el = $('#push-banner');
if (!c || !c.push || !c.push.supported() || !S.boot.cloud || S.boot.cloud.step < 3 || c.push.permission() === 'denied' || dismissed('push', 14)) { if (el) el.remove(); return; }
c.push.subscription().then(function (sub) {
if (sub) {
call('api_pushSubscribe', sub.toJSON(), null, deviceName()).catch(function () {});
if (el) el.remove();
return;
}
el = bannerSlot('push-banner', 'auth-banner app-banner');
el.innerHTML = '<span class="ab-ic">🔔</span><span><strong>Nouvelles commandes sur ce téléphone</strong>, même application fermée.</span>' +
'<button type="button" class="btn primary" data-act="push-on">Activer</button>' +
'<button type="button" class="icon-btn" data-act="banner-close" data-key="push" aria-label="Plus tard">×</button>';
});
}
function deviceName() {
var ua = navigator.userAgent || '';
return (/android/i.test(ua) ? 'Android' : /iphone|ipad/i.test(ua) ? 'iPhone' : /windows/i.test(ua) ? 'Windows' : /mac os/i.test(ua) ? 'Mac' : 'Appareil') +
(/samsungbrowser/i.test(ua) ? ' · Samsung Internet' : /edg\//i.test(ua) ? ' · Edge' : /firefox/i.test(ua) ? ' · Firefox' : /chrome|crios/i.test(ua) ? ' · Chrome' : /safari/i.test(ua) ? ' · Safari' : '');
}
function pushSettings() {
var c = window.DZ_CLOUD;
if (!c || !c.push || !c.push.supported()) { toast('Notifications impossibles sur ce navigateur. Sur iPhone : installez d’abord l’application (Partager › Sur l’écran d’accueil).', true); return; }
showModal(modalHead('Notifications') + '<p class="loading">Chargement…</p>');
c.push.subscription().then(function (sub) {
return call('api_pushInfo', sub ? sub.endpoint : '').then(function (info) { S.pushSub = sub; S.pushInfo = info; renderPushSettings(); });
}).catch(function (e) { toast(errText(e), true); closeModal(); });
}
function renderPushSettings() {
var info = S.pushInfo || {};
var on = !!(S.pushSub && info.subscribed);
var p = info.prefs || {};
var denied = window.DZ_CLOUD.push.permission() === 'denied';
var sw = function (key, label, sub) {
return '<label class="push-row"><span><strong>' + h(label) + '</strong><span class="small">' + h(sub) + '</span></span>' +
'<input type="checkbox" class="switch" data-push-pref="' + key + '"' + (p[key] ? ' checked' : '') + (on ? '' : ' disabled') + '></label>';
};
showModal(modalHead('Notifications') +
(on ? '<p class="small" style="color:#146C2E;font-weight:600">' + icon('ok') + 'Activées sur ce téléphone' + (info.device ? ' (' + h(info.device) + ')' : '') + '</p>'
: denied ? '<p class="small" style="color:#A12626">Notifications bloquées par le navigateur : touchez le cadenas à côté de l’adresse › Notifications › Autoriser, puis rouvrez cette fenêtre.</p>'
: '<p class="small">Pas encore activées sur ce téléphone.</p>') +
'<div class="push-list">' +
sw('orders', 'Nouvelles commandes', 'Dès qu’une commande arrive (Releasit, Shopify)') +
sw('callbacks', 'Rappels à l’heure', 'Une commande « à rappeler » arrive à son heure') +
(info.admin ? sw('tracking', 'Colis à traiter', 'Refus, retour, colis bloqué') + sw('problems', 'Problèmes de l’outil', 'Relais RELEASIT muet, Ecotrack en panne…') : '') +
sw('quiet', 'Silence la nuit', 'Pas de notification de 22 h à 8 h') + '</div>' +
'<div class="modal-actions">' + (on ? '<button type="button" class="btn" data-act="push-test">Envoyer un essai</button><button type="button" class="btn" data-act="push-off">Désactiver</button>'
: '<button type="button" class="btn primary" data-act="push-on"' + (denied ? ' disabled' : '') + '>Activer sur ce téléphone</button>') + '</div>');
}
document.addEventListener('change', function (e) {
var key = e.target && e.target.getAttribute && e.target.getAttribute('data-push-pref');
if (!key || !S.pushSub || !S.pushInfo) return;
S.pushInfo.prefs[key] = e.target.checked;
call('api_pushPrefs', S.pushSub.endpoint, S.pushInfo.prefs).then(function (r) { S.pushInfo.prefs = r.prefs; toast(r.message); })
.catch(function (err) { toast(errText(err), true); });
});
function pushOn(el) {
var c = window.DZ_CLOUD;
if (el) el.disabled = true;
return call('api_pushInfo').then(function (info) {
return c.push.subscribe(info.publicKey).then(function (sub) { return call('api_pushSubscribe', sub.toJSON(), null, deviceName()); });
}).then(function (r) {
if (el) el.disabled = false;
var b = $('#push-banner');
if (b) b.remove();
toast(r.message);
return r;
}).catch(function (e) { if (el) el.disabled = false; toast(errText(e), true); throw e; });
}
function bootFailed(e) {
view.innerHTML = errorBox(e) +
'<p class="sub" style="margin-top:12px">Vérifiez que le classeur est partagé avec votre adresse Google (en Éditeur), puis rechargez la page.</p>';
}
if (window.DZ_DEVICE && DZ_DEVICE.page && ROUTES.indexOf(DZ_DEVICE.page) >= 0 && !location.hash) location.hash = '#/' + DZ_DEVICE.page;
var mem = memRead();
if (mem) {
S.boot = mem.boot;
S.fromMemory = true;
if (mem.dash) S.dash[mem.dash.key] = mem.dash.data;
if (mem.list) { S.list = mem.list.data; S.listKey = mem.list.key; }
if (mem.queue) setQueue(mem.queue);
if (mem.ship) S.ship.data = mem.ship;
if (mem.track) S.track.data = mem.track;
applyBoot(S.boot);
window.addEventListener('hashchange', go);
go();
syncStart();
call('api_bootstrap', null).then(function (b) {
syncEnd();
var old = S.boot.user;
S.boot = b;
S.fromMemory = false;
applyBoot(b);
if (old.admin !== b.user.admin || old.stock !== b.user.stock || old.name !== b.user.name) go();
memSave();
started();
}).catch(function (e) {
syncEnd();
memClear();
bootFailed(e);
});
} else {
var firstSpec = preloadSpec(currentRoute());
call('api_bootstrap', firstSpec).then(function (b) {
S.boot = b;
if (b.preload && firstSpec && b.preload.key === firstSpec.key) S.preloaded[firstSpec.key] = b.preload.data;
applyBoot(b);
window.addEventListener('hashchange', go);
go();
if (!b.counts) refreshCount();
memSave();
started();
}).catch(bootFailed);
}
})();
</script>
</body>
</html>
