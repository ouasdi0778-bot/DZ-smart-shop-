<script>
(function () {
  'use strict';

  /* ================================================================ */
  /* État et outils                                                   */
  /* ================================================================ */

  var S = {
    boot: null,
    route: '',
    period: '7',
    filter: { status: 'all', q: '', wilaya: '', period: '30', limit: 100 },
    queue: null,
    currentId: null,
    current: null,
    busy: false,
    token: 0,
    detailToken: 0,
    ship: { data: null, tab: 'toship', selected: {}, busy: false, results: null },
    track: { data: null, days: 30, filter: 'all' }
  };
  var TZ = 'Africa/Algiers';
  var ALERT = {
    bad: { bg: '#FBE7E7', fg: '#A12626' },
    warn: { bg: '#FCEBDD', fg: '#9A4200' },
    ok: { bg: '#DDF0E4', fg: '#146C2E' },
    'new': { bg: '#E6EEFB', fg: '#1E4FA8' }
  };
  var view = document.getElementById('view');

  /** Appelle une fonction du serveur (Api.gs) et renvoie une promesse. */
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[fn].apply(runner, args);
    });
  }

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function h(value) {
    return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function errText(e) { return (e && e.message) ? e.message : String(e || 'Erreur inconnue'); }
  function errorBox(e) { return '<div class="error-box" role="alert">' + h(errText(e)) + '</div>'; }

  function money(n) {
    var v = Math.round(Number(n) || 0);
    return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' DA';
  }
  function pct(a, b) { return b ? Math.round(a / b * 100) + ' %' : '—'; }
  function plural(n, one, many) { return n + ' ' + (n > 1 ? many : one); }

  function fmtDate(iso, withDay) {
    if (!iso) return '—';
    var d = new Date(iso);
    var o = { timeZone: TZ, hour: '2-digit', minute: '2-digit' };
    if (withDay !== false) { o.day = '2-digit'; o.month = '2-digit'; }
    try { return d.toLocaleString('fr-FR', o); } catch (e) { return d.toLocaleString('fr-FR'); }
  }
  function ago(iso) {
    if (!iso) return '';
    var diff = Date.now() - new Date(iso).getTime();
    var future = diff < 0;
    var m = Math.round(Math.abs(diff) / 60000);
    var txt = m < 1 ? 'à l’instant' : m < 60 ? m + ' min' : m < 1440 ? Math.round(m / 60) + ' h' : Math.round(m / 1440) + ' j';
    if (m < 1) return txt;
    return future ? 'dans ' + txt : 'il y a ' + txt;
  }
  function fmtPhone(p) {
    var s = String(p || '');
    if (/^0\d{9}$/.test(s)) return s.replace(/^(\d{4})(\d{2})(\d{2})(\d{2})$/, '$1 $2 $3 $4');
    return s;
  }
  function wilayaName(w) { return String(w || '').replace(/^\d+\s*-\s*/, ''); }

  function pill(status) {
    var st = (S.boot && S.boot.styles[status]) || { bg: '#EEF0F3', fg: '#3D4350' };
    return '<span class="pill" style="background:' + st.bg + ';color:' + st.fg + '">' + h(status || '—') + '</span>';
  }
  function alertPill(text, level) {
    if (!text) return '';
    var st = ALERT[level] || ALERT['new'];
    return '<span class="pill" style="background:' + st.bg + ';color:' + st.fg + '">' + h(text) + '</span>';
  }

  /** Liste d'options ; garde une valeur inconnue pour ne pas la perdre. */
  function options(list, selected, emptyLabel) {
    var out = emptyLabel !== undefined ? '<option value="">' + h(emptyLabel) + '</option>' : '';
    if (selected && list.indexOf(selected) < 0) out += '<option selected>' + h(selected) + '</option>';
    return out + list.map(function (v) {
      return '<option' + (v === selected ? ' selected' : '') + '>' + h(v) + '</option>';
    }).join('');
  }
  function field(label, control, cls) {
    return '<label class="field' + (cls ? ' ' + cls : '') + '">' + h(label) + control + '</label>';
  }
  function input(name, value, attrs) {
    return '<input name="' + name + '" value="' + h(value) + '"' + (attrs || '') + '>';
  }
  function readForm(root) {
    var out = {};
    $all('[name]', root).forEach(function (el) {
      out[el.name] = el.type === 'checkbox' ? el.checked : el.value;
    });
    return out;
  }

  var toastTimer = null;
  function toast(msg, isError) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = ''; }, isError ? 6000 : 3200);
  }

  /** Frais de livraison d'après l'onglet Tarifs, ou null. */
  function feeFor(wilaya, carrier, mode) {
    var code = parseInt(String(wilaya || ''), 10);
    var r = S.boot.rates[code];
    var c = carrier || S.boot.defaultCarrier;
    if (r && r[c] && r[c][mode] !== undefined) return r[c][mode];
    return null;
  }

  /* ================================================================ */
  /* Navigation                                                       */
  /* ================================================================ */

  var ROUTES = ['tableau', 'commandes', 'confirmation', 'expeditions', 'suivi'];

  function go() {
    var r = (location.hash || '').replace(/^#\/?/, '');
    if (ROUTES.indexOf(r) < 0) r = 'tableau';
    S.route = r;
    $all('[data-route]').forEach(function (a) {
      var on = a.getAttribute('data-route') === r;
      a.classList.toggle('active', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    closeModal();
    if (r === 'tableau') pageDashboard();
    else if (r === 'commandes') pageOrders();
    else if (r === 'expeditions') pageShipping();
    else if (r === 'suivi') pageTracking();
    else pageConfirm();
    view.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  function navigate(route, status) {
    if (status) { S.filter.status = status; S.filter.limit = 100; }
    if (location.hash === '#/' + route) go(); else location.hash = '#/' + route;
  }

  function setQueueCount(n) {
    $all('[data-queue-count]').forEach(function (el) { el.textContent = n; el.hidden = !n; });
  }
  function setAlertCount(n) {
    $all('[data-alert-count]').forEach(function (el) { el.textContent = n; el.hidden = !n; });
  }
  function refreshCount() {
    call('api_counts').then(function (c) { setQueueCount(c.queue); setAlertCount(c.alerts); }).catch(function () {});
  }

  /* ================================================================ */
  /* Tableau de bord                                                  */
  /* ================================================================ */

  function pageDashboard() {
    var t = ++S.token;
    var periods = [['today', 'Aujourd’hui'], ['7', '7 jours'], ['30', '30 jours'], ['all', 'Tout']];
    view.innerHTML =
      '<div class="page-head"><div><h1>Tableau de bord</h1><p class="sub">Vue d’ensemble de vos commandes COD</p></div>' +
      '<div class="seg" role="group" aria-label="Période">' + periods.map(function (p) {
        return '<button type="button" data-act="period" data-period="' + p[0] + '" aria-pressed="' + (S.period === p[0]) + '">' + p[1] + '</button>';
      }).join('') + '</div></div>' +
      '<div id="dash"><p class="loading">Chargement…</p></div>';
    call('api_dashboard', S.period).then(function (d) {
      if (t === S.token) renderDashboard(d);
    }).catch(function (e) {
      if (t === S.token) $('#dash').innerHTML = errorBox(e);
    });
  }

  function renderDashboard(d) {
    var st = S.boot.styles;
    var kpis = [
      ['Commandes reçues', d.received, plural(d.waiting, 'commande en attente', 'commandes en attente')],
      ['Taux de confirmation', pct(d.confirmed, d.decided), d.confirmed + ' confirmées sur ' + d.decided + ' traitées'],
      ['Taux de livraison', pct(d.delivered, d.delivered + d.returned), d.delivered + ' livrées · ' + d.returned + ' retours'],
      ['Montant livré', money(d.revenueDelivered), 'Commandes livrées sur la période'],
      ['Argent en route', money(d.inTransitAmount), plural(d.inTransitCount, 'colis pas encore livré', 'colis pas encore livrés')]
    ];
    var funnel = [
      ['Reçues', d.received, '#EEF0F3', '#3D4350'],
      ['Confirmées', d.confirmed, st['Confirmée'].bg, st['Confirmée'].fg],
      ['Expédiées', d.shipped, st['Expédiée'].bg, st['Expédiée'].fg],
      ['Livrées', d.delivered, st['Livrée'].bg, st['Livrée'].fg],
      ['Retours', d.returned, st['Retour'].bg, st['Retour'].fg],
      ['Annulées', d.cancelled, st['Annulée'].bg, st['Annulée'].fg]
    ];
    var todo = [
      [d.todo.toConfirm, 'à appeler maintenant', 'confirmation', '', 'Confirmer', st['À confirmer']],
      [d.todo.callbacksToday, 'rappels prévus plus tard aujourd’hui', 'confirmation', '', 'Voir', st['Rappeler']],
      [d.todo.toShip, 'commandes confirmées à expédier', 'expeditions', '', 'Expédier', st['Confirmée']],
      [d.todo.unreachable, 'clients injoignables', 'commandes', 'Injoignable', 'Voir', st['Injoignable']],
      [d.todo.parcelAlerts, 'colis à traiter (suspendus, retours, sans mouvement…)', 'suivi', '', 'Suivi', st['Retour']]
    ];

    var html = '<div class="stack">';
    html += '<section class="grid-kpi" aria-label="Chiffres clés">' + kpis.map(function (k) {
      return '<div class="card kpi"><span class="label">' + h(k[0]) + '</span><span class="value">' + h(k[1]) + '</span><span class="note">' + h(k[2]) + '</span></div>';
    }).join('') + '</section>';

    html += '<section class="card"><h2>Parcours des commandes</h2><div class="funnel">' + funnel.map(function (f) {
      return '<div style="background:' + f[2] + ';color:' + f[3] + '"><span class="strong">' + f[0] + '</span><span class="n">' + f[1] + '</span><span class="small" style="color:' + f[3] + '">' + (d.received ? pct(f[1], d.received) + ' des reçues' : 'aucune commande') + '</span></div>';
    }).join('') + '</div></section>';

    html += '<div class="row">';
    html += '<section class="card"><h2>À faire</h2>' + todo.map(function (t) {
      return '<div class="todo"><span class="n" style="background:' + t[5].bg + ';color:' + t[5].fg + '">' + t[0] + '</span>' +
        '<span class="t">' + h(t[1]) + '</span>' +
        '<button type="button" class="btn" data-act="goto" data-route="' + t[2] + '" data-status="' + h(t[3]) + '">' + t[4] + '</button></div>';
    }).join('') + '</section>';

    html += '<section class="card"><h2>Taux de livraison par wilaya</h2>';
    if (!d.byWilaya.length) {
      html += '<p class="empty">Pas encore de colis expédiés sur la période.</p>';
    } else {
      html += '<div class="bars">' + d.byWilaya.map(function (w) {
        var done = w.delivered + w.returned;
        var rate = done ? Math.round(w.delivered / done * 100) : null;
        return '<div class="bar-row"><span>' + h(w.name) + '<br><span class="small">' + plural(w.orders, 'colis', 'colis') + '</span></span>' +
          '<span class="bar" aria-hidden="true"><span class="' + (rate !== null && rate < 70 ? 'low' : '') + '" style="width:' + (rate || 0) + '%"></span></span>' +
          '<span class="strong" style="text-align:right">' + (rate === null ? '—' : rate + ' %') + '</span></div>';
      }).join('') + '</div><p class="small" style="margin-top:12px">Orange : moins de 70 % livrés. « — » : aucun colis terminé.</p>';
    }
    html += '</section></div>';

    html += '<div class="row">';
    html += '<section class="card"><h2>Par confirmatrice</h2>' + (d.byAgent.length ? table(
      ['Confirmatrice', 'Traitées', 'Confirmées', 'Taux'],
      d.byAgent.map(function (a) { return [h(a.name), a.orders, a.confirmed, pct(a.confirmed, a.orders)]; }), [1, 2, 3]
    ) : '<p class="empty">Aucune commande traitée sur la période.</p>') + '</section>';
    html += '<section class="card"><h2>Par produit</h2>' + (d.byProduct.length ? table(
      ['Produit', 'Commandes', 'Confirmées', 'Livrées', 'Retours'],
      d.byProduct.map(function (p) { return [h(p.name), p.orders, p.confirmed, p.delivered, p.returned]; }), [1, 2, 3, 4]
    ) : '<p class="empty">Aucune commande sur la période.</p>') + '</section>';
    html += '</div></div>';
    $('#dash').innerHTML = html;
  }

  function table(head, rows, numCols) {
    numCols = numCols || [];
    return '<div class="table-wrap" style="border:0"><table class="data cards"><thead><tr>' + head.map(function (t) {
      return '<th scope="col">' + h(t) + '</th>';
    }).join('') + '</tr></thead><tbody>' + rows.map(function (r) {
      return '<tr>' + r.map(function (c, i) {
        return '<td data-label="' + h(head[i]) + '"' + (numCols.indexOf(i) >= 0 ? ' class="num"' : '') + '>' + c + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
  }

  /* ================================================================ */
  /* Commandes                                                        */
  /* ================================================================ */

  function pageOrders() {
    var f = S.filter;
    var periods = [['today', 'Aujourd’hui'], ['7', '7 derniers jours'], ['30', '30 derniers jours'], ['all', 'Tout']];
    view.innerHTML =
      '<div class="page-head"><div><h1>Commandes</h1><p class="sub">Toutes les commandes du classeur. Cliquez sur une commande pour la modifier.</p></div>' +
      '<button type="button" class="btn primary" data-act="new-order">+ Nouvelle commande</button></div>' +
      '<div id="shop-status"></div>' +
      '<div class="chips" id="chips" role="group" aria-label="Filtrer par statut"></div>' +
      '<div class="filters">' +
        field('Rechercher', '<input type="search" id="f-q" value="' + h(f.q) + '" placeholder="Nom, téléphone, n° de commande ou de suivi">', 'wide') +
        field('Wilaya', '<select id="f-wilaya">' + options(S.boot.wilayas, f.wilaya, 'Toutes les wilayas') + '</select>') +
        field('Période', '<select id="f-period">' + periods.map(function (p) {
          return '<option value="' + p[0] + '"' + (f.period === p[0] ? ' selected' : '') + '>' + p[1] + '</option>';
        }).join('') + '</select>') +
      '</div>' +
      '<div id="orders-list"><p class="loading">Chargement…</p></div>';
    loadOrders();
    loadShopStatus();
    syncReleasit(function () { if (S.route === 'commandes') { loadOrders(); loadShopStatus(); } });
  }

  /* Arrivée automatique des commandes (Releasit, Shopify) : état, et transfert à la demande. */
  function statusCard(inner) {
    return '<div class="card" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px;padding:12px 16px">' + inner + '</div>';
  }

  function loadShopStatus() {
    call('api_importStatus').then(function (st) {
      var box = $('#shop-status');
      if (!box || S.route !== 'commandes') return;
      var r = st.releasit;
      var s = st.shopify;
      var html = '';
      if (r.found) {
        html += statusCard('<span><strong>Releasit</strong> · ' + (r.lastRun ? 'dernière lecture ' + h(ago(r.lastRun)) : 'pas encore lu') +
          ' · transfert automatique chaque minute</span>' +
          '<button type="button" class="btn" style="min-height:40px" data-act="releasit-transfer">Transférer maintenant</button>');
        if (r.missing.length) {
          html += '<div class="error-box" role="alert" style="margin-bottom:14px;background:#FFF3DC;color:#8A5200">Onglet RELEASIT : colonne(s) absente(s) : ' +
            h(r.missing.join(', ')) + '. Ajoutez-les dans les réglages Google Sheets de Releasit.</div>';
        }
        if (r.lastError) html += '<div style="margin-bottom:14px">' + errorBox(r.lastError) + '</div>';
      }
      if (s.configured) {
        html += statusCard('<span><strong>Shopify</strong> · ' + h(s.shop) + ' · ' + (s.lastRun ? 'dernière importation ' + h(ago(s.lastRun)) : 'pas encore importé') +
          ' · importation automatique toutes les 5 minutes</span>' +
          '<button type="button" class="btn" style="min-height:40px" data-act="shop-import">Importer maintenant</button>') +
          (s.lastError ? '<div style="margin-bottom:14px">' + errorBox(s.lastError) + '</div>' : '');
      }
      if (!r.found && !s.configured) {
        html += statusCard('<span class="muted">Les commandes n’arrivent pas encore automatiquement. Connectez Releasit COD à un onglet <strong>RELEASIT</strong> du classeur, ' +
          'ou connectez Shopify (dans le classeur, sur ordinateur : menu <strong>DZ Smart Shop</strong>).</span>');
      }
      box.innerHTML = html;
    }).catch(function () {});
  }

  /* Vérifie l'onglet RELEASIT sans bloquer la page ; recharge si des commandes sont arrivées. */
  function syncReleasit(onAdded) {
    call('api_releasitSync').then(function (r) {
      if (!r || !r.added) return;
      toast(r.added > 1 ? r.added + ' nouvelles commandes reçues' : '1 nouvelle commande reçue');
      refreshCount();
      if (onAdded) onAdded();
    }).catch(function () {});
  }

  function loadOrders() {
    var t = ++S.token;
    call('api_listOrders', S.filter).then(function (res) {
      if (t !== S.token || S.route !== 'commandes') return;
      renderChips(res.counts);
      renderOrderList(res);
    }).catch(function (e) {
      if (t === S.token) $('#orders-list').innerHTML = errorBox(e);
    });
  }

  function renderChips(counts) {
    var list = [['all', 'Toutes'], ['queue', 'À traiter']].concat(S.boot.statuses.map(function (s) { return [s, s]; }));
    $('#chips').innerHTML = list.filter(function (c) {
      return c[0] === 'all' || c[0] === S.filter.status || counts[c[0]];
    }).map(function (c) {
      return '<button type="button" class="chip" data-act="chip" data-status="' + h(c[0]) + '" aria-pressed="' + (S.filter.status === c[0]) + '">' +
        h(c[1]) + ' · ' + (counts[c[0]] || 0) + '</button>';
    }).join('');
  }

  function renderOrderList(res) {
    var box = $('#orders-list');
    if (!res.rows.length) {
      box.innerHTML = '<div class="card"><p class="empty">Aucune commande ne correspond à ces filtres.</p></div>';
      return;
    }
    var head = ['N°', 'Client', 'Wilaya', 'Produit', 'Total', 'Statut', 'Alerte', 'Livraison'];
    var html = '<div class="table-wrap"><table class="data cards"><thead><tr>' + head.map(function (t) {
      return '<th scope="col">' + t + '</th>';
    }).join('') + '</tr></thead><tbody>';
    res.rows.forEach(function (o) {
      html += '<tr class="clickable" data-act="open-order" data-id="' + h(o.id) + '">' +
        '<td data-label="N°" class="multi"><button type="button" class="link-btn" data-act="open-order" data-id="' + h(o.id) + '">' + h(o.id) + '</button><div class="small">' + fmtDate(o.date) + '</div></td>' +
        '<td data-label="Client" class="multi">' + h(o.client) + '<div class="small">' + h(fmtPhone(o.phone)) + '</div></td>' +
        '<td data-label="Wilaya" class="multi">' + h(o.wilaya) + '<div class="small">' + h(o.commune) + '</div></td>' +
        '<td data-label="Produit">' + h(o.product) + (o.qty > 1 ? ' ×' + o.qty : '') + '</td>' +
        '<td data-label="Total" class="num strong">' + money(o.total) + '</td>' +
        '<td data-label="Statut">' + pill(o.status) + '</td>' +
        '<td data-label="Alerte">' + alertPill(o.alert, o.alertLevel) + '</td>' +
        '<td data-label="Livraison" class="multi">' + h(o.mode) + '<div class="small">' + h([o.carrier, o.tracking].filter(Boolean).join(' · ')) + '</div></td>' +
      '</tr>';
    });
    html += '</tbody></table></div>';
    html += '<p class="small" style="margin-top:10px">' + res.rows.length + ' sur ' + res.total + ' commande(s)</p>';
    if (res.total > res.rows.length) html += '<p style="margin-top:10px"><button type="button" class="btn" data-act="more">Afficher plus</button></p>';
    box.innerHTML = html;
  }

  /* ---------------- Fenêtre de commande ---------------- */

  function showModal(html) {
    $('#modal-root').innerHTML = '<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">' + html + '</div></div>';
    var first = $('#modal-root input, #modal-root select, #modal-root button');
    if (first) first.focus();
  }
  function closeModal() { $('#modal-root').innerHTML = ''; }
  function modalOpen() { return !!$('#modal-root .modal'); }
  function modalHead(title, extra) {
    return '<div class="modal-head"><div><h2 id="modal-title" style="font:700 20px var(--font-title)">' + title + '</h2>' + (extra || '') + '</div>' +
      '<button type="button" class="icon-btn" data-act="close-modal" aria-label="Fermer">×</button></div>';
  }

  function orderFields(o) {
    var b = S.boot;
    return '<div class="form-grid">' +
      field('Client', input('client', o.client)) +
      field('Téléphone', input('phone', o.phone, ' inputmode="tel"')) +
      field('Wilaya', '<select name="wilaya">' + options(b.wilayas, o.wilaya, 'Choisir…') + '</select>') +
      field('Commune', input('commune', o.commune)) +
      field('Adresse', input('address', o.address), 'full') +
      field('Produit', input('product', o.product, ' list="product-list"')) +
      field('Quantité', input('qty', o.qty || 1, ' type="number" min="1" step="1"')) +
      field('Prix des produits (DA)', input('price', o.price || '', ' type="number" min="0" step="10"')) +
      field('Livraison', '<select name="mode">' + options(b.modes, o.mode || b.modes[0]) + '</select>') +
      field('Société', '<select name="carrier">' + options(b.carriers, o.carrier, 'Par défaut (' + b.defaultCarrier + ')') + '</select>') +
      field('Frais de livraison (DA)', input('shipping', o.shipping === null || o.shipping === undefined ? '' : o.shipping, ' type="number" min="0" step="10" placeholder="Calcul automatique"')) +
      (o.id ? field('N° de suivi', input('tracking', o.tracking)) : '') +
      field('Notes', '<textarea name="notes">' + h(o.notes) + '</textarea>', 'full') +
      '</div>' +
      '<datalist id="product-list">' + b.products.map(function (p) { return '<option value="' + h(p.name) + '">'; }).join('') + '</datalist>';
  }

  function openOrder(id) {
    showModal(modalHead('Commande ' + h(id)) + '<p class="loading">Chargement…</p>');
    call('api_getOrder', id).then(renderOrderModal).catch(function (e) {
      showModal(modalHead('Commande ' + h(id)) + errorBox(e));
    });
  }

  function renderOrderModal(data) {
    var o = data.order;
    var hist = data.history;
    var b = S.boot;
    var meta = '<p class="small" style="margin-top:4px">Reçue le ' + fmtDate(o.date) + ' · source : ' + h(o.source || '—') +
      (o.agent ? ' · traitée par ' + h(o.agent) : '') + (o.attempts ? ' · ' + plural(o.attempts, 'appel', 'appels') : '') + '</p>' +
      '<p style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">' + pill(o.status) + alertPill(o.alert, o.alertLevel) + '</p>';
    var histText = hist.orders
      ? 'Autres commandes de ce numéro : ' + hist.orders + ' (' + hist.delivered + ' livrées, ' + hist.returned + ' retours, ' + hist.cancelled + ' annulées)'
      : 'Première commande avec ce numéro.';
    showModal(
      modalHead('Commande ' + h(o.id), meta) +
      '<p class="small">' + h(histText) + '</p>' +
      (o.tracking ?
        '<div class="history" style="background:#F4F5F7;margin-bottom:0"><span class="strong">Colis Ecotrack</span><span class="mono">' + h(o.tracking) + '</span>' +
        '<span>' + (o.carrierLabel ? h(o.carrierLabel) : 'statut pas encore lu') + (o.carrierMoved ? ' · mouvement ' + h(ago(o.carrierMoved)) : '') + '</span>' +
        '<button type="button" class="btn" style="min-height:36px;margin-left:auto" data-act="track-history" data-id="' + h(o.id) + '">Voir la chronologie</button></div>' +
        '<div id="parcel-history"></div>' : '') +
      '<div id="order-form" data-id="' + h(o.id) + '">' +
        '<div class="form-grid">' +
          field('Statut', '<select name="status" data-role="status">' + options(b.statuses, o.status) + '</select>') +
          field('Motif d’annulation', '<select name="cancelReason">' + options(b.cancelReasons, o.cancelReason, 'Choisir…') + '</select>') +
        '</div>' +
        '<div style="height:12px"></div>' +
        orderFields(o) +
      '</div>' +
      '<div class="modal-actions">' +
        (data.phoneValid ? '<button type="button" class="btn ' + (data.blacklisted ? '' : 'danger') + '" data-act="toggle-blacklist" data-phone="' + h(o.phone) + '" data-on="' + (!data.blacklisted) + '">' +
          (data.blacklisted ? 'Retirer de la liste noire' : 'Mettre en liste noire') + '</button>' : '') +
        '<button type="button" class="btn" data-act="close-modal">Fermer</button>' +
        '<button type="button" class="btn primary" data-act="save-order" data-id="' + h(o.id) + '">Enregistrer</button>' +
      '</div>'
    );
    toggleCancelField();
  }

  function toggleCancelField() {
    var st = $('#order-form [data-role="status"]');
    var reason = $('#order-form [name="cancelReason"]');
    if (!st || !reason) return;
    reason.closest('.field').hidden = st.value !== 'Annulée';
  }

  function openNewOrder() {
    showModal(
      modalHead('Nouvelle commande', '<p class="small" style="margin-top:4px">Elle sera ajoutée au classeur et à la file de confirmation.</p>') +
      '<div id="order-form">' + orderFields({ qty: 1, mode: S.boot.modes[0] }) + '</div>' +
      '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Annuler</button>' +
      '<button type="button" class="btn primary" data-act="create-order">Ajouter la commande</button></div>'
    );
  }

  function afterOrderChange() {
    if (S.route === 'commandes') loadOrders();
    else if (S.route === 'tableau') pageDashboard();
    else if (S.route === 'expeditions') loadShipping();
    else if (S.route === 'suivi') loadTracking();
    refreshCount();
  }

  function saveOrder(btn) {
    var id = btn.getAttribute('data-id');
    var data = readForm($('#order-form'));
    btn.disabled = true;
    call('api_updateOrder', id, data).then(function (o) {
      closeModal();
      toast('Commande ' + o.id + ' enregistrée');
      afterOrderChange();
    }).catch(function (e) { btn.disabled = false; toast(errText(e), true); });
  }

  function createOrder(btn) {
    var data = readForm($('#order-form'));
    btn.disabled = true;
    call('api_createOrder', data).then(function (o) {
      closeModal();
      toast('Commande ' + o.id + ' ajoutée');
      afterOrderChange();
    }).catch(function (e) { btn.disabled = false; toast(errText(e), true); });
  }

  function toggleBlacklist(btn) {
    var on = btn.getAttribute('data-on') === 'true';
    btn.disabled = true;
    call('api_setBlacklist', btn.getAttribute('data-phone'), on).then(function (r) {
      toast(r.blacklisted ? 'Numéro ajouté à la liste noire' : 'Numéro retiré de la liste noire');
      btn.setAttribute('data-on', String(!r.blacklisted));
      btn.textContent = r.blacklisted ? 'Retirer de la liste noire' : 'Mettre en liste noire';
      btn.classList.toggle('danger', !r.blacklisted);
      btn.disabled = false;
    }).catch(function (e) { btn.disabled = false; toast(errText(e), true); });
  }

  /* ================================================================ */
  /* Centre de confirmation                                           */
  /* ================================================================ */

  function pageConfirm() {
    view.innerHTML =
      '<div class="page-head"><div><h1>Centre de confirmation</h1><p class="sub">Connecté(e) : ' + h(S.boot.user.name) + '</p></div>' +
      '<div class="stats" id="cstats"></div></div>' +
      '<div class="confirm">' +
        '<section class="queue" id="queue" aria-label="File d’appels"><p class="loading">Chargement…</p></section>' +
        '<section class="detail" id="detail"></section>' +
      '</div>';
    S.currentId = null;
    loadQueue(true);
    syncReleasit(function () { if (S.route === 'confirmation') loadQueue(false); });
  }

  function loadQueue(selectFirst) {
    return call('api_queue').then(function (q) {
      if (S.route !== 'confirmation') return;
      S.queue = q;
      setQueueCount(q.stats.due);
      renderQueue();
      var ids = q.due.concat(q.later).map(function (x) { return x.id; });
      if (selectFirst || !S.currentId || ids.indexOf(S.currentId) < 0) {
        if (!selectFirst && S.currentId && !S.busy) toast('La commande ' + S.currentId + ' a été traitée par une autre personne.');
        if (q.due.length) openInDetail(q.due[0].id);
        else renderEmptyDetail();
      }
    }).catch(function (e) {
      if (S.route === 'confirmation') $('#queue').innerHTML = errorBox(e);
    });
  }

  function renderQueue() {
    var q = S.queue;
    $('#cstats').innerHTML =
      '<span>À appeler : <strong>' + q.stats.due + '</strong></span>' +
      '<span>Rappels plus tard : <strong>' + q.stats.later + '</strong></span>' +
      '<span style="background:#E3F2EC;color:#0B6B4C;border-color:#BFE0D2">Mes confirmations aujourd’hui : <strong>' + q.stats.confirmedToday + '</strong></span>';
    var item = function (x) {
      var when = x.status === 'À confirmer' ? 'reçue ' + ago(x.date) : (x.callback ? 'rappel ' + fmtDate(x.callback) : ago(x.date));
      return '<button type="button" class="q-item" data-act="q-open" data-id="' + h(x.id) + '" aria-current="' + (x.id === S.currentId) + '">' +
        '<span class="q-top"><strong>' + h(x.client || 'Sans nom') + '</strong><span class="small">' + h(when) + '</span></span>' +
        '<span class="small" style="color:var(--ink-2)">' + h(x.id) + ' · ' + h(wilayaName(x.wilaya)) + ' · ' + money(x.total) + '</span>' +
        '<span class="q-tags">' + alertPill(x.alert, x.alertLevel) + (x.status !== 'À confirmer' ? pill(x.status) : '') +
          (x.attempts ? '<span class="pill" style="background:#EEF0F3;color:#3D4350">' + plural(x.attempts, 'appel', 'appels') + '</span>' : '') +
        '</span></button>';
    };
    var html = '<div class="q-top"><span class="queue-title">À appeler · ' + q.due.length + '</span>' +
      '<button type="button" class="btn" style="min-height:36px;padding:0 10px" data-act="refresh-queue">Actualiser</button></div>';
    html += q.due.length ? q.due.map(item).join('') : '<p class="small">Personne à appeler pour le moment.</p>';
    if (q.later.length) html += '<span class="queue-title">Rappels programmés · ' + q.later.length + '</span>' + q.later.map(item).join('');
    $('#queue').innerHTML = html;
  }

  function markCurrent() {
    $all('#queue .q-item').forEach(function (b) {
      b.setAttribute('aria-current', String(b.getAttribute('data-id') === S.currentId));
    });
  }

  function renderEmptyDetail() {
    S.currentId = null;
    S.current = null;
    var next = S.queue && S.queue.later[0];
    $('#detail').innerHTML = '<div class="card"><h2>La file est vide</h2><p class="sub">Les nouvelles commandes arrivent automatiquement (toutes les 5 minutes).' +
      (next ? ' Prochain rappel : ' + h(next.client) + ', ' + fmtDate(next.callback) + '.' : '') + '</p></div>';
  }

  function openInDetail(id) {
    S.currentId = id;
    markCurrent();
    $('#queue').classList.remove('open');
    $('#detail').innerHTML = '<div class="card"><p class="loading">Chargement…</p></div>';
    var t = ++S.detailToken;
    call('api_getOrder', id).then(function (data) {
      if (t !== S.detailToken || S.route !== 'confirmation') return;
      S.current = data;
      renderDetail();
    }).catch(function (e) {
      if (t === S.detailToken) $('#detail').innerHTML = '<div class="card">' + errorBox(e) + '</div>';
    });
  }

  function renderDetail() {
    var d = S.current;
    var o = d.order;
    var b = S.boot;
    var hist = d.history;
    var a = ALERT[o.alertLevel] || ALERT['new'];
    var histText = hist.orders
      ? plural(hist.orders, 'autre commande', 'autres commandes') + ' : ' + hist.delivered + ' livrée(s), ' + hist.returned + ' retour(s), ' + hist.cancelled + ' annulée(s)'
      : 'Première commande avec ce numéro';
    var dueCount = S.queue ? S.queue.due.length : 0;
    var callBtn = d.phoneValid
      ? '<a class="btn primary" href="tel:' + h(o.phone) + '" target="_top">Appeler</a>'
      : '<span class="btn" aria-disabled="true">Numéro invalide</span>';
    var waBtn = d.intlPhone
      ? '<a class="btn" id="d-wa" href="#" target="_blank" rel="noopener">WhatsApp</a>'
      : '';

    $('#detail').innerHTML =
      '<div class="card">' +
        '<div class="detail-head"><div><h2>' + h(o.client || 'Client sans nom') + ' · ' + h(o.id) + '</h2>' +
          '<p class="muted">' + h(fmtPhone(o.phone)) + ' · reçue ' + h(ago(o.date)) + (o.attempts ? ' · ' + plural(o.attempts, 'appel', 'appels') : '') + '</p></div>' +
          '<div class="quick"><button type="button" class="btn queue-toggle" data-act="toggle-queue">File (' + dueCount + ')</button>' + callBtn + waBtn + '</div>' +
        '</div>' +
        '<div class="history" style="background:' + a.bg + '"><span class="strong" style="color:' + a.fg + '">' + h(o.alert || 'Nouveau client') + '</span><span>' + h(histText) + '</span></div>' +
        '<div class="form-grid" id="d-form">' +
          field('Client', input('client', o.client)) +
          field('Téléphone', input('phone', o.phone, ' inputmode="tel"')) +
          field('Wilaya', '<select name="wilaya">' + options(b.wilayas, o.wilaya, 'Choisir…') + '</select>') +
          field('Commune', input('commune', o.commune)) +
          field('Livraison', '<select name="mode">' + options(b.modes, o.mode || b.modes[0]) + '</select>') +
          field('Quantité', input('qty', o.qty, ' type="number" min="1" step="1"')) +
          field('Adresse', input('address', o.address), 'full') +
          field('Notes', '<textarea name="notes">' + h(o.notes) + '</textarea>', 'full') +
        '</div>' +
        '<div class="sum" id="d-sum"></div>' +
      '</div>' +
      '<div class="card"><h3>Résultat de l’appel</h3>' +
        '<div class="outcomes">' +
          '<button type="button" class="btn primary big" data-act="confirm">Confirmer</button>' +
          '<button type="button" class="btn big" data-act="no_answer">Pas de réponse</button>' +
          '<button type="button" class="btn warn big" data-act="show-callback">Rappeler plus tard</button>' +
          '<button type="button" class="btn danger big" data-act="show-cancel">Annuler</button>' +
        '</div><div id="d-panel"></div>' +
      '</div>' +
      '<div class="card"><h3>Message WhatsApp</h3><p class="message" id="d-msg"></p>' +
        '<p class="small" style="margin-top:8px">Modèle modifiable dans l’onglet Paramètres (MESSAGE_WHATSAPP).</p></div>';
    updateSummary();
  }

  /** Recalcule prix, frais, total et message quand la confirmatrice modifie la commande. */
  function updateSummary() {
    if (!S.current || !$('#d-form')) return;
    var o = S.current.order;
    var f = readForm($('#d-form'));
    var qty = Math.max(1, parseInt(f.qty, 10) || 1);
    var unit = o.qty ? o.price / o.qty : o.price;
    var price = qty === o.qty ? o.price : Math.round(unit * qty);
    var changed = f.wilaya !== o.wilaya || f.mode !== o.mode;
    var fee = feeFor(f.wilaya, o.carrier, f.mode);
    var shipping = (changed || o.shipping === null) && fee !== null ? fee : (o.shipping || 0);
    var total = (price !== o.price || shipping !== (o.shipping || 0)) ? price + shipping : o.total;
    var carrier = o.carrier || S.boot.defaultCarrier;
    $('#d-sum').innerHTML =
      '<div><span>' + h(f.product || o.product || 'Produits') + ' ×' + qty + '</span><span>' + money(price) + '</span></div>' +
      '<div class="muted"><span>Livraison ' + h(f.mode) + ' · ' + h(carrier) + (fee === null ? ' (tarif non renseigné)' : '') + '</span><span>' + money(shipping) + '</span></div>' +
      '<div class="total"><span>Total à encaisser</span><span>' + money(total) + '</span></div>';
    var msg = fillTemplate(S.boot.waTemplate, {
      client: f.client, id: o.id, product: o.product, qty: qty, total: total, commune: f.commune, wilaya: f.wilaya
    });
    $('#d-msg').textContent = msg;
    var wa = $('#d-wa');
    if (wa) wa.href = 'https://wa.me/' + S.current.intlPhone + '?text=' + encodeURIComponent(msg);
  }

  function fillTemplate(tpl, x) {
    var first = String(x.client || '').trim().split(/\s+/)[0] || '';
    var map = {
      prenom: first,
      client: x.client || '',
      numero: x.id,
      produit: (x.product || '') + (x.qty > 1 ? ' ×' + x.qty : ''),
      total: money(x.total),
      commune: x.commune || '',
      wilaya: wilayaName(x.wilaya),
      boutique: S.boot.shop
    };
    return String(tpl || '').replace(/\{(\w+)\}/g, function (m, k) { return map[k] !== undefined ? map[k] : m; });
  }

  function showPanel(kind) {
    var p = $('#d-panel');
    if (kind === 'callback') {
      p.innerHTML = '<div class="panel"><span class="strong">Quand rappeler ?</span><div class="quick">' +
        '<button type="button" class="btn" data-act="cb-quick" data-min="60">Dans 1 h</button>' +
        '<button type="button" class="btn" data-act="cb-quick" data-min="180">Dans 3 h</button>' +
        '<button type="button" class="btn" data-act="cb-quick" data-tomorrow="10">Demain 10 h</button>' +
        '<button type="button" class="btn" data-act="cb-quick" data-tomorrow="17">Demain 17 h</button></div>' +
        '<div class="form-grid">' + field('Autre date et heure', '<input type="datetime-local" id="cb-when">') + '</div>' +
        '<div><button type="button" class="btn warn" data-act="callback">Programmer le rappel</button></div></div>';
    } else {
      p.innerHTML = '<div class="panel"><div class="form-grid">' +
        field('Motif d’annulation', '<select id="cancel-reason">' + options(S.boot.cancelReasons, '') + '</select>') + '</div>' +
        '<label style="display:flex;gap:10px;align-items:center;min-height:44px"><input type="checkbox" id="cancel-black" style="width:20px;height:20px"> Ajouter ce numéro à la liste noire</label>' +
        '<div><button type="button" class="btn danger" data-act="cancel">Confirmer l’annulation</button></div></div>';
    }
    var first = p.querySelector('button, select, input');
    if (first) first.focus();
  }

  function submit(outcome, extra) {
    if (S.busy || !S.currentId) return;
    S.busy = true;
    $all('#detail button').forEach(function (b) { b.disabled = true; });
    var id = S.currentId;
    var payload = { fields: readForm($('#d-form')) };
    Object.keys(extra || {}).forEach(function (k) { payload[k] = extra[k]; });
    var blacklist = outcome === 'cancel' && $('#cancel-black') && $('#cancel-black').checked;
    var phone = S.current.order.phone;

    call('api_recordCall', id, outcome, payload).then(function (o) {
      var msgs = {
        confirm: 'Commande ' + o.id + ' confirmée',
        no_answer: o.status === 'Injoignable' ? 'Commande ' + o.id + ' : client injoignable' : 'Pas de réponse noté, rappel ' + fmtDate(o.callback),
        callback: 'Rappel programmé ' + fmtDate(o.callback),
        cancel: 'Commande ' + o.id + ' annulée'
      };
      toast(msgs[outcome]);
      if (blacklist) call('api_setBlacklist', phone, true).catch(function (e) { toast(errText(e), true); });
      var due = S.queue.due;
      var idx = -1;
      for (var i = 0; i < due.length; i++) if (due[i].id === id) idx = i;
      if (idx >= 0) due.splice(idx, 1);
      S.queue.stats.due = due.length;
      if (outcome === 'confirm') S.queue.stats.confirmedToday++;
      setQueueCount(due.length);
      S.busy = false;
      var next = due[Math.max(idx, 0)] || due[0];
      renderQueue();
      if (next) openInDetail(next.id); else renderEmptyDetail();
      loadQueue(false);
    }).catch(function (e) {
      S.busy = false;
      $all('#detail button').forEach(function (b) { b.disabled = false; });
      toast(errText(e), true);
      if (/déjà été traitée/.test(errText(e))) loadQueue(true);
    });
  }

  /* ================================================================ */
  /* Expéditions (Ecotrack)                                           */
  /* ================================================================ */

  function pageShipping() {
    view.innerHTML =
      '<div class="page-head"><div><h1>Expéditions</h1><p class="sub">Envoi des commandes confirmées à Ecotrack et suivi des colis</p></div>' +
      '<button type="button" class="btn" data-act="ship-reload">Actualiser</button></div>' +
      '<div id="ship"><p class="loading">Chargement…</p></div>';
    loadShipping();
  }

  function loadShipping() {
    var t = ++S.token;
    return call('api_shippingList').then(function (d) {
      if (t !== S.token || S.route !== 'expeditions') return;
      S.ship.data = d;
      var ready = {};
      d.toShip.forEach(function (o) { if (!o.problems.length) ready[o.id] = true; });
      Object.keys(S.ship.selected).forEach(function (id) { if (!ready[id]) delete S.ship.selected[id]; });
      renderShipping();
    }).catch(function (e) {
      if (t === S.token && S.route === 'expeditions') $('#ship').innerHTML = errorBox(e);
    });
  }

  function renderShipping() {
    var box = $('#ship');
    var sh = S.ship;
    var d = sh.data;
    if (!box || !d) return;
    var ready = d.toShip.filter(function (o) { return !o.problems.length; });
    var picked = Object.keys(sh.selected).length;
    var html = '<div class="stack">';

    // Connexion
    html += '<section class="card"><div class="detail-head"><div><h2>Ecotrack</h2><p class="muted">' +
      (d.configured ? 'Connecté à ' + h(d.host) : 'Pas encore configuré') + '</p></div>';
    if (d.configured) {
      html += '<div class="quick">' +
        '<button type="button" class="btn" data-act="eco-test">Tester la connexion</button>' +
        '<button type="button" class="btn" data-act="eco-fees-ask">Récupérer les tarifs</button>' +
        '<button type="button" class="btn" data-act="eco-status">Mettre à jour les statuts</button></div>';
    }
    html += '</div>';
    if (!d.configured) {
      html += '<p>Pour envoyer vos colis, enregistrez l’adresse de votre plateforme Ecotrack et votre jeton API. ' +
        'Dans le classeur, sur ordinateur : menu <strong>DZ Smart Shop › Ecotrack › Enregistrer l’adresse et le jeton</strong>. ' +
        'Le jeton reste dans les propriétés protégées du script, jamais dans le classeur.</p>';
    }
    if (d.catalogError) html += '<div style="margin-top:12px">' + errorBox(d.catalogError) + '</div>';
    html += '</section>';

    // Résultat du dernier envoi
    if (sh.results) {
      var okCount = sh.results.filter(function (r) { return r.ok; }).length;
      html += '<section class="card"><div class="detail-head"><div><h2>Résultat de l’envoi</h2><p class="muted">' +
        plural(okCount, 'colis créé', 'colis créés') + (sh.results.length - okCount ? ' · ' + plural(sh.results.length - okCount, 'refusé', 'refusés') : '') +
        '</p></div><button type="button" class="btn" data-act="ship-dismiss">Fermer</button></div>';
      if (okCount) {
        html += '<p style="margin-bottom:8px">Ces colis sont <strong>créés</strong> chez Ecotrack mais <strong>pas encore expédiés</strong> : validez-les dans l’interface d’Ecotrack. ' +
          'L’outil détecte la validation tout seul (au plus tard 30 minutes plus tard).</p>';
      }
      html += sh.results.map(function (r) {
        return '<div class="result-row"><span class="pill" style="background:' + (r.ok ? '#DDF0E4;color:#146C2E' : '#FBE7E7;color:#A12626') + '">' + (r.ok ? 'Créé' : 'Refusé') + '</span>' +
          '<span class="grow"><strong>' + h(r.id) + '</strong>' + (r.client ? ' · ' + h(r.client) : '') +
          (r.message ? '<br><span class="small" style="color:' + (r.ok ? 'var(--muted)' : '#A12626') + '">' + h(r.message) + '</span>' : '') + '</span>' +
          (r.ok ? '<span class="mono strong">' + h(r.tracking) + '</span>' : '') + '</div>';
      }).join('');
      html += '</section>';
    }

    // Onglets
    html += '<div class="chips" role="group" aria-label="Vue">' +
      '<button type="button" class="chip" data-act="ship-tab" data-tab="toship" aria-pressed="' + (sh.tab === 'toship') + '">À expédier · ' + d.toShip.length + '</button>' +
      '<button type="button" class="chip" data-act="ship-tab" data-tab="created" aria-pressed="' + (sh.tab === 'created') + '">Créés, à valider chez Ecotrack · ' + d.created.length + '</button></div>';

    if (sh.tab === 'toship') html += renderToShip(d, ready, picked);
    else html += renderCreated(d);
    html += '</div>';
    box.innerHTML = html;
  }

  function renderToShip(d, ready, picked) {
    var sh = S.ship;
    if (!d.toShip.length) return '<div class="card"><p class="empty">Aucune commande confirmée à expédier.</p></div>';
    var allPicked = ready.length > 0 && picked === ready.length;
    var html = '<div class="quick" style="align-items:center;justify-content:space-between">' +
      '<label style="display:flex;align-items:center;gap:10px;min-height:44px"><input type="checkbox" class="check" data-ship-all' + (allPicked ? ' checked' : '') + (ready.length ? '' : ' disabled') + '> ' +
      'Tout sélectionner (' + ready.length + ' prêtes)</label>' +
      '<button type="button" class="btn primary" data-act="ship-ask"' + ((!picked || !d.configured || sh.busy) ? ' disabled' : '') + '>' +
      (sh.busy ? 'Création en cours…' : 'Envoyer ' + plural(picked, 'colis', 'colis') + ' à Ecotrack') + '</button></div>';
    html += '<div class="table-wrap"><table class="data cards"><thead><tr>' +
      ['', 'Commande', 'Destination', 'Livraison', 'Total', 'État', ''].map(function (t) { return '<th scope="col">' + t + '</th>'; }).join('') + '</tr></thead><tbody>';
    d.toShip.forEach(function (o) {
      var ok = !o.problems.length;
      html += '<tr>' +
        '<td data-label="Choisir">' + (ok ? '<input type="checkbox" class="check" data-ship-check="' + h(o.id) + '"' + (sh.selected[o.id] ? ' checked' : '') + ' aria-label="Sélectionner la commande ' + h(o.id) + '">' : '') + '</td>' +
        '<td data-label="Commande" class="multi"><strong>' + h(o.id) + '</strong> · ' + h(o.client) + '<div class="small">' + h(o.product) + '</div></td>' +
        '<td data-label="Destination" class="multi">' + h(o.wilaya) + '<div class="small">' + h(o.commune) + '</div></td>' +
        '<td data-label="Livraison">' + h(o.mode) + '</td>' +
        '<td data-label="Total" class="num strong">' + money(o.total) + '</td>' +
        '<td data-label="État">' + (ok ? '<span class="pill" style="background:#DDF0E4;color:#146C2E">Prête</span>' :
          '<span class="problems">' + o.problems.map(function (p) { return '<span>' + h(p) + '</span>'; }).join('') + '</span>') + '</td>' +
        '<td data-label=""><button type="button" class="btn" style="min-height:36px" data-act="open-order" data-id="' + h(o.id) + '">Modifier</button></td></tr>';
    });
    return html + '</tbody></table></div>' +
      '<p class="small">Les colis partent chez Ecotrack avec le total affiché (livraison comprise). La commune doit être écrite comme chez Ecotrack : sinon le colis est refusé et vous en êtes prévenu ici.</p>';
  }

  function renderCreated(d) {
    if (!d.created.length) return '<div class="card"><p class="empty">Aucun colis en attente de validation chez Ecotrack.</p></div>';
    var html = '<p class="small">Ces colis existent chez Ecotrack mais ne partent pas tant que vous ne les avez pas validés dans l’interface d’Ecotrack. ' +
      'Une fois validés, la commande passe « Expédiée » toute seule. Un colis non validé depuis plus de ' + d.alertHours + ' h est signalé.</p>';
    html += '<div class="table-wrap"><table class="data cards"><thead><tr>' +
      ['Commande', 'Destination', 'N° de suivi', 'Statut Ecotrack', 'Créé depuis', 'Total'].map(function (t) { return '<th scope="col">' + t + '</th>'; }).join('') + '</tr></thead><tbody>';
    d.created.forEach(function (o) {
      html += '<tr>' +
        '<td data-label="Commande" class="multi"><button type="button" class="link-btn" data-act="open-order" data-id="' + h(o.id) + '">' + h(o.id) + '</button> · ' + h(o.client) + '</td>' +
        '<td data-label="Destination" class="multi">' + h(o.wilaya) + '<div class="small">' + h(o.commune) + '</div></td>' +
        '<td data-label="N° de suivi" class="mono">' + h(o.tracking) + '</td>' +
        '<td data-label="Statut Ecotrack">' + h(o.carrierLabel) + '</td>' +
        '<td data-label="Créé depuis">' + h(hoursText(o.ageHours)) + (o.late ? ' <span class="pill" style="background:#FFF3DC;color:#8A5200">à valider</span>' : '') + '</td>' +
        '<td data-label="Total" class="num strong">' + money(o.total) + '</td></tr>';
    });
    return html + '</tbody></table></div>';
  }

  /** « 5 h », « 2 j » à partir d'un nombre d'heures. */
  function hoursText(hours) {
    var n = Math.max(Number(hours) || 0, 0);
    if (n < 1) return 'moins d’1 h';
    return n < 48 ? n + ' h' : Math.floor(n / 24) + ' j';
  }

  function confirmModal(title, text, okAct, okLabel) {
    showModal(modalHead(h(title)) + '<p>' + h(text) + '</p>' +
      '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Annuler</button>' +
      '<button type="button" class="btn primary" data-act="' + okAct + '">' + h(okLabel) + '</button></div>');
  }

  function askShip() {
    var n = Object.keys(S.ship.selected).length;
    if (!n || S.ship.busy) return;
    confirmModal('Créer les colis chez Ecotrack ?', plural(n, 'colis va être créé', 'colis vont être créés') +
      ' chez Ecotrack, avec le total affiché comme montant à encaisser. Ils ne seront pas expédiés : vous les validez ensuite dans l’interface d’Ecotrack.',
      'ship-confirm', 'Créer les colis');
  }

  function doShip() {
    var ids = Object.keys(S.ship.selected);
    closeModal();
    if (!ids.length || S.ship.busy) return;
    S.ship.busy = true;
    renderShipping();
    toast('Envoi à Ecotrack en cours…');
    call('api_shipEcotrack', ids).then(function (res) {
      S.ship.busy = false;
      S.ship.selected = {};
      S.ship.results = res;
      var ok = res.filter(function (r) { return r.ok; }).length;
      toast(plural(ok, 'colis créé', 'colis créés') + (res.length - ok ? ', ' + (res.length - ok) + ' refusé(s)' : '') + (ok ? '. À valider dans Ecotrack.' : ''), ok === 0);
      loadShipping();
      refreshCount();
    }).catch(function (e) {
      S.ship.busy = false;
      toast(errText(e), true);
      renderShipping();
    });
  }

  function ecoAction(fn, busyText) {
    toast(busyText);
    call(fn).then(function (r) {
      toast(r.message);
      if (fn === 'api_ecotrackSyncStatuses') loadShipping();
    }).catch(function (e) { toast(errText(e), true); });
  }

  /* ================================================================ */
  /* Suivi des colis                                                  */
  /* ================================================================ */

  var LEVELS = {
    urgent: { label: 'Urgent', bg: '#FBE7E7', fg: '#A12626' },
    warn: { label: 'À surveiller', bg: '#FFF3DC', fg: '#8A5200' },
    info: { label: 'Info', bg: '#E6EEFB', fg: '#1E4FA8' }
  };
  var GROUPS = [
    ['all', 'Tous'], ['draft', 'À valider'], ['transit', 'En route'], ['delivery', 'En livraison'],
    ['suspended', 'Suspendus'], ['returning', 'Retours']
  ];

  function waLink(phone) {
    var p = String(phone || '').replace(/\D/g, '');
    return /^0[567]\d{8}$/.test(p) ? 'https://wa.me/213' + p.slice(1) : '';
  }

  function pageTracking() {
    view.innerHTML = '<div id="track"><p class="loading">Chargement…</p></div>';
    loadTracking();
  }

  function loadTracking() {
    var t = ++S.token;
    return call('api_trackingOverview', S.track.days).then(function (d) {
      if (t !== S.token || S.route !== 'suivi') return;
      S.track.data = d;
      setAlertCount(d.alerts.filter(function (a) { return a.level !== 'info'; }).length);
      renderTracking();
    }).catch(function (e) {
      if (t === S.token && S.route === 'suivi') $('#track').innerHTML = errorBox(e);
    });
  }

  function renderTracking() {
    var d = S.track.data;
    var box = $('#track');
    if (!d || !box) return;
    var m = d.money;
    var toReceive = m.delivered.amount + m.cashed.amount + m.ready.amount;
    var html = '<div class="page-head"><div><h1>Suivi des colis</h1><p class="sub">' +
      (d.lastSync ? 'Statuts relus ' + h(ago(d.lastSync)) + ' · automatiquement toutes les 30 minutes' : 'Statuts pas encore relus') + '</p></div>' +
      '<button type="button" class="btn primary" data-act="track-sync">Actualiser les statuts</button></div>';
    html += '<div class="stack">';
    if (!d.configured) {
      html += '<div class="card"><h2>Ecotrack n’est pas encore configuré</h2><p class="sub">Enregistrez l’adresse et le jeton dans le classeur (menu DZ Smart Shop › Ecotrack), puis créez vos premiers colis dans la page Expéditions.</p></div>';
    }
    if (d.lastError) html += errorBox(d.lastError);

    // Argent
    var periods = [[7, '7 jours'], [30, '30 jours'], [90, '90 jours']];
    html += '<section class="card"><div class="detail-head"><div><h2>Où est l’argent</h2><p class="muted">Montants à encaisser, avant déduction des frais d’Ecotrack. À recevoir : <strong>' + money(toReceive) + '</strong></p></div>' +
      '<div class="seg" role="group" aria-label="Période des paiements reçus">' + periods.map(function (p) {
        return '<button type="button" data-act="track-days" data-days="' + p[0] + '" aria-pressed="' + (d.days === p[0]) + '">' + p[1] + '</button>';
      }).join('') + '</div></div>' +
      '<div class="grid-kpi">' + [
        ['Chez le livreur', m.enRoute, 'Colis pas encore livrés'],
        ['Livrés, pas encaissés', m.delivered, 'Le livreur n’a pas encore remis l’argent'],
        ['Encaissés, pas payés', m.cashed, 'Ecotrack a l’argent, pas encore versé'],
        ['Prêts à être versés', m.ready, 'Paiement prêt chez Ecotrack'],
        ['Payés (' + d.days + ' jours)', m.paid, 'Argent reçu']
      ].map(function (k) {
        return '<div class="kpi" style="padding:4px 0"><span class="label">' + h(k[0]) + '</span><span class="value">' + money(k[1].amount) + '</span><span class="note">' + plural(k[1].count, 'colis', 'colis') + ' · ' + h(k[2]) + '</span></div>';
      }).join('') + '</div></section>';

    // Alertes
    html += '<section class="card"><h2>À traiter · ' + d.alerts.length + '</h2>';
    if (!d.alerts.length) {
      html += '<p class="empty" style="padding:18px 0">Rien à traiter : vos colis avancent normalement (alerte après ' + d.alertHours + ' h sans mouvement).</p>';
    } else {
      html += d.alerts.map(function (a) {
        var lv = LEVELS[a.level] || LEVELS.info;
        var wa = waLink(a.phone);
        return '<div class="result-row"><span class="pill" style="min-width:96px;text-align:center;background:' + lv.bg + ';color:' + lv.fg + '">' + lv.label + '</span>' +
          '<span class="grow"><strong>' + h(a.title) + '</strong> · <button type="button" class="link-btn" data-act="open-order" data-id="' + h(a.id) + '">' + h(a.id) + '</button> · ' + h(a.client) + ' · ' + h(wilayaName(a.wilaya)) +
          '<br><span class="small" style="color:var(--ink-2)">' + h(a.detail) + '</span>' +
          '<br><span class="small mono">' + h(a.tracking) + ' · ' + h(a.carrierLabel || 'statut pas encore lu') + ' · depuis ' + h(ago(a.since).replace(/^il y a /, '')) + '</span></span>' +
          '<span class="quick">' +
            (/^0\d{8,9}$/.test(String(a.phone).replace(/\D/g, '')) ? '<a class="btn" style="min-height:40px" href="tel:' + h(a.phone) + '" target="_top">Appeler</a>' : '') +
            (wa ? '<a class="btn" style="min-height:40px" href="' + h(wa) + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
            '<button type="button" class="btn" style="min-height:40px" data-act="track-history" data-id="' + h(a.id) + '">Chronologie</button>' +
            '<button type="button" class="btn" style="min-height:40px" data-act="track-done" data-id="' + h(a.id) + '">Marquer comme traité</button></span></div>';
      }).join('');
    }
    html += '</section>';

    // Colis en cours
    var f = S.track.filter;
    var shown = d.parcels.filter(function (p) { return f === 'all' || p.group === f; });
    html += '<section class="card"><h2>Colis en cours · ' + d.parcels.length + '</h2><div class="chips" role="group" aria-label="Filtrer les colis" style="margin-bottom:12px">' +
      GROUPS.map(function (g) {
        var n = g[0] === 'all' ? d.parcels.length : d.parcels.filter(function (p) { return p.group === g[0]; }).length;
        return '<button type="button" class="chip" data-act="track-filter" data-group="' + g[0] + '" aria-pressed="' + (f === g[0]) + '">' + g[1] + ' · ' + n + '</button>';
      }).join('') + '</div>';
    if (!shown.length) {
      html += '<p class="empty" style="padding:18px 0">Aucun colis dans cette catégorie.</p>';
    } else {
      html += '<div class="table-wrap" style="border:0"><table class="data cards"><thead><tr>' +
        ['Commande', 'Wilaya', 'N° de suivi', 'Statut Ecotrack', 'Depuis', 'Total', ''].map(function (t) { return '<th scope="col">' + t + '</th>'; }).join('') + '</tr></thead><tbody>' +
        shown.map(function (p) {
          return '<tr><td data-label="Commande" class="multi"><button type="button" class="link-btn" data-act="open-order" data-id="' + h(p.id) + '">' + h(p.id) + '</button><div class="small">' + h(p.client) + '</div></td>' +
            '<td data-label="Wilaya">' + h(wilayaName(p.wilaya)) + '</td>' +
            '<td data-label="N° de suivi" class="mono">' + h(p.tracking) + '</td>' +
            '<td data-label="Statut Ecotrack">' + h(p.carrierLabel || '—') + (p.stale ? ' <span class="pill" style="background:#FFF3DC;color:#8A5200">' + (p.group === 'draft' ? 'à valider' : 'sans mouvement') + '</span>' : '') + '</td>' +
            '<td data-label="Depuis">' + h(hoursText(p.ageHours)) + '</td>' +
            '<td data-label="Total" class="num strong">' + money(p.total) + '</td>' +
            '<td data-label=""><button type="button" class="btn" style="min-height:36px" data-act="track-history" data-id="' + h(p.id) + '">Chronologie</button></td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    html += '</section>';

    // Versements
    html += '<section class="card"><h2>Versements d’Ecotrack (' + d.days + ' jours)</h2>';
    if (!d.payments.length) {
      html += '<p class="empty" style="padding:18px 0">Aucun versement sur la période. Le n° de versement s’affiche dès qu’Ecotrack le fournit.</p>';
    } else {
      html += '<div class="table-wrap" style="border:0"><table class="data cards"><thead><tr>' +
        ['Versement', 'Colis', 'Montant', 'État', 'Dernier mouvement'].map(function (t) { return '<th scope="col">' + t + '</th>'; }).join('') + '</tr></thead><tbody>' +
        d.payments.map(function (p) {
          return '<tr><td data-label="Versement" class="mono">n° ' + h(p.id) + '</td><td data-label="Colis">' + p.count + '</td>' +
            '<td data-label="Montant" class="num strong">' + money(p.amount) + '</td>' +
            '<td data-label="État"><span class="pill" style="background:' + (p.paid ? '#DDF0E4;color:#146C2E' : '#FFF3DC;color:#8A5200') + '">' + (p.paid ? 'Payé' : 'En cours') + '</span></td>' +
            '<td data-label="Dernier mouvement" class="small">' + fmtDate(p.last) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    html += '</section></div>';
    box.innerHTML = html;
  }

  /* Chronologie d'un colis : dans la fiche de la commande si elle est ouverte, sinon dans une fenêtre. */
  function historyHtml(d) {
    var html = '<div style="margin-top:12px"><p class="small">Colis <span class="mono">' + h(d.tracking) + '</span>' + (d.carrierLabel ? ' · ' + h(d.carrierLabel) : '') + '</p>';
    if (!d.events.length) {
      html += '<p>Ecotrack n’a renvoyé aucune étape que l’outil sache lire.</p>' +
        (d.raw ? '<details><summary class="small">Réponse brute d’Ecotrack (à m’envoyer si besoin)</summary><pre class="mono" style="white-space:pre-wrap;font-size:12px;overflow:auto">' + h(d.raw) + '</pre></details>' : '');
    } else {
      html += '<ol class="timeline">' + d.events.map(function (e) {
        return '<li><span class="t-date">' + (e.date ? fmtDate(e.date) : h(e.dateText || '—')) + '</span><span class="t-body"><strong>' + h(e.label) + '</strong>' +
          (e.note ? '<br><span class="small">' + h(e.note) + '</span>' : '') + '</span></li>';
      }).join('') + '</ol>';
    }
    return html + '</div>';
  }

  function openHistory(id) {
    var inOrder = !!$('#parcel-history') && !!$('#order-form');
    if (inOrder) {
      $('#parcel-history').innerHTML = '<p class="loading" style="padding:12px 0">Chargement…</p>';
    } else {
      showModal(modalHead('Chronologie · ' + h(id)) + '<div id="history-body"><p class="loading">Chargement…</p></div>' +
        '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Fermer</button></div>');
    }
    call('api_parcelHistory', id).then(function (d) {
      var el = inOrder ? $('#parcel-history') : $('#history-body');
      if (el) el.innerHTML = historyHtml(d);
    }).catch(function (e) {
      var el = inOrder ? $('#parcel-history') : $('#history-body');
      if (el) el.innerHTML = '<div style="margin-top:12px">' + errorBox(e) + '</div>';
    });
  }

  /* ================================================================ */
  /* Événements                                                       */
  /* ================================================================ */

  var ACTIONS = {
    'goto': function (el) { navigate(el.getAttribute('data-route'), el.getAttribute('data-status')); },
    'period': function (el) { S.period = el.getAttribute('data-period'); pageDashboard(); },
    'chip': function (el) { S.filter.status = el.getAttribute('data-status'); S.filter.limit = 100; loadOrders(); },
    'more': function () { S.filter.limit += 100; loadOrders(); },
    'open-order': function (el) { openOrder(el.getAttribute('data-id')); },
    'new-order': openNewOrder,
    'releasit-transfer': function () {
      toast('Lecture de l’onglet RELEASIT…');
      call('api_releasitTransfer').then(function (r) {
        toast(r.message);
        loadShopStatus();
        loadOrders();
        refreshCount();
      }).catch(function (e) { toast(errText(e), true); loadShopStatus(); });
    },
    'shop-import': function () {
      toast('Importation depuis Shopify…');
      call('api_shopifyImport').then(function (r) {
        toast(r.message);
        loadShopStatus();
        loadOrders();
        refreshCount();
      }).catch(function (e) { toast(errText(e), true); loadShopStatus(); });
    },
    'close-modal': closeModal,
    'save-order': saveOrder,
    'create-order': createOrder,
    'toggle-blacklist': toggleBlacklist,
    'refresh-queue': function () {
      loadQueue(false);
      syncReleasit(function () { if (S.route === 'confirmation') loadQueue(false); });
    },
    'q-open': function (el) { if (!S.busy) openInDetail(el.getAttribute('data-id')); },
    'toggle-queue': function () { $('#queue').classList.toggle('open'); },
    'confirm': function () { submit('confirm'); },
    'no_answer': function () { submit('no_answer'); },
    'show-callback': function () { showPanel('callback'); },
    'show-cancel': function () { showPanel('cancel'); },
    'cb-quick': function (el) {
      var d = new Date();
      if (el.hasAttribute('data-min')) d = new Date(Date.now() + Number(el.getAttribute('data-min')) * 60000);
      else { d.setDate(d.getDate() + 1); d.setHours(Number(el.getAttribute('data-tomorrow')), 0, 0, 0); }
      submit('callback', { callback: d.toISOString() });
    },
    'callback': function () {
      var v = $('#cb-when').value;
      if (!v) { toast('Choisissez une date et une heure.', true); return; }
      submit('callback', { callback: new Date(v).toISOString() });
    },
    'cancel': function () { submit('cancel', { reason: $('#cancel-reason').value }); },
    'ship-reload': function () { loadShipping(); },
    'ship-tab': function (el) { S.ship.tab = el.getAttribute('data-tab'); renderShipping(); },
    'ship-dismiss': function () { S.ship.results = null; renderShipping(); },
    'ship-ask': askShip,
    'ship-confirm': doShip,
    'eco-test': function () { ecoAction('api_ecotrackTest', 'Test de la connexion…'); },
    'eco-status': function () { ecoAction('api_ecotrackSyncStatuses', 'Lecture des statuts chez Ecotrack…'); },
    'eco-fees-ask': function () {
      confirmModal('Récupérer les tarifs Ecotrack ?',
        'Les colonnes « Ecotrack domicile » et « Ecotrack stop desk » de l’onglet Tarifs seront remplacées par les prix d’Ecotrack. Les prix Yalidine ne changent pas.',
        'eco-fees', 'Récupérer');
    },
    'eco-fees': function () { closeModal(); ecoAction('api_ecotrackSyncFees', 'Récupération des tarifs…'); },
    'track-sync': function () {
      toast('Lecture des statuts chez Ecotrack…');
      call('api_ecotrackSyncStatuses').then(function (r) { toast(r.message); loadTracking(); refreshCount(); })
        .catch(function (e) { toast(errText(e), true); });
    },
    'track-days': function (el) { S.track.days = Number(el.getAttribute('data-days')); loadTracking(); },
    'track-filter': function (el) { S.track.filter = el.getAttribute('data-group'); renderTracking(); },
    'track-history': function (el) { openHistory(el.getAttribute('data-id')); },
    'track-done': function (el) {
      el.disabled = true;
      call('api_markFollowUp', el.getAttribute('data-id')).then(function () {
        toast('Alerte marquée comme traitée');
        loadTracking();
        refreshCount();
      }).catch(function (e) { el.disabled = false; toast(errText(e), true); });
    }
  };

  document.addEventListener('click', function (e) {
    if (e.target.classList && e.target.classList.contains('modal-backdrop')) { closeModal(); return; }
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.getAttribute('data-act')];
    if (!fn) return;
    e.preventDefault();
    e.stopPropagation();
    fn(el, e);
  });

  var searchTimer = null;
  document.addEventListener('input', function (e) {
    if (e.target.id === 'f-q') {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { S.filter.q = e.target.value; S.filter.limit = 100; loadOrders(); }, 350);
    } else if (e.target.closest('#d-form')) {
      updateSummary();
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.hasAttribute('data-ship-check')) {
      var sid = e.target.getAttribute('data-ship-check');
      if (e.target.checked) S.ship.selected[sid] = true; else delete S.ship.selected[sid];
      renderShipping();
      return;
    }
    if (e.target.hasAttribute('data-ship-all')) {
      S.ship.selected = {};
      if (e.target.checked && S.ship.data) {
        S.ship.data.toShip.forEach(function (o) { if (!o.problems.length) S.ship.selected[o.id] = true; });
      }
      renderShipping();
      return;
    }
    if (e.target.id === 'f-wilaya') { S.filter.wilaya = e.target.value; S.filter.limit = 100; loadOrders(); }
    else if (e.target.id === 'f-period') { S.filter.period = e.target.value; S.filter.limit = 100; loadOrders(); }
    else if (e.target.getAttribute('data-role') === 'status') toggleCancelField();
    else if (e.target.closest('#d-form')) updateSummary();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modalOpen()) closeModal();
  });

  function tick() {
    if (document.visibilityState !== 'visible' || S.busy || modalOpen()) return;
    if (S.route === 'confirmation') loadQueue(false);
    else if (S.route === 'suivi') loadTracking();
    else refreshCount();
  }

  /* ================================================================ */
  /* Démarrage                                                        */
  /* ================================================================ */

  call('api_bootstrap').then(function (b) {
    S.boot = b;
    $all('[data-shop]').forEach(function (el) { el.textContent = b.shop; });
    $all('[data-user-name]').forEach(function (el) { el.textContent = b.user.name; });
    $all('[data-user-mail]').forEach(function (el) { el.textContent = b.user.email; });
    window.addEventListener('hashchange', go);
    go();
    if (S.route !== 'confirmation') refreshCount();
    setInterval(tick, 60000);
  }).catch(function (e) {
    view.innerHTML = errorBox(e) +
      '<p class="sub" style="margin-top:12px">Vérifiez que le classeur est partagé avec votre adresse Google (en Éditeur), puis rechargez la page.</p>';
  });
})();
</script>
