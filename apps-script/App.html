      if (t === S.token && S.route === 'suivi') $('#track').innerHTML = errorBox(e);
    });
  }

  function renderTracking() {
    var d = S.track.data;
    var box = $('#track');
    if (!d || !box) return;
    var m = d.money;
    var toReceive = m.delivered.amount + m.cashed.amount + m.ready.amount;
    var html = '<div class="page-head"><div><h1>Suivi des colis</h1><p class="sub">' +
      (d.lastSync ? 'Statuts relus ' + h(ago(d.lastSync)) + ' · automatiquement toutes les 30 minutes' : 'Statuts pas encore relus') + '</p></div>' +
      '<button type="button" class="btn primary" data-act="track-sync">Actualiser les statuts</button></div>';
    html += '<div class="stack">';
    if (!d.configured) {
      html += '<div class="card"><h2>Ecotrack n’est pas encore configuré</h2><p class="sub">Enregistrez l’adresse et le jeton dans le classeur (menu DZ Smart Shop › Ecotrack), puis créez vos premiers colis dans la page Expéditions.</p></div>';
    }
    if (d.lastError) html += errorBox(d.lastError);

    // Argent
    var periods = [[7, '7 jours'], [30, '30 jours'], [90, '90 jours']];
    html += '<section class="card"><div class="detail-head"><div><h2>Où est l’argent</h2><p class="muted">Montants à encaisser, avant déduction des frais d’Ecotrack. À recevoir : <strong>' + money(toReceive) + '</strong></p></div>' +
      '<div class="seg" role="group" aria-label="Période des paiements reçus">' + periods.map(function (p) {
        return '<button type="button" data-act="track-days" data-days="' + p[0] + '" aria-pressed="' + (d.days === p[0]) + '">' + p[1] + '</button>';
      }).join('') + '</div></div>' +
      '<div class="grid-kpi">' + [
        ['Chez le livreur', m.enRoute, 'Colis pas encore livrés'],
        ['Livrés, pas encaissés', m.delivered, 'Le livreur n’a pas encore remis l’argent'],
        ['Encaissés, pas payés', m.cashed, 'Ecotrack a l’argent, pas encore versé'],
        ['Prêts à être versés', m.ready, 'Paiement prêt chez Ecotrack'],
        ['Payés (' + d.days + ' jours)', m.paid, 'Argent reçu']
      ].map(function (k) {
        return '<div class="kpi" style="padding:4px 0"><span class="label">' + h(k[0]) + '</span><span class="value">' + money(k[1].amount) + '</span><span class="note">' + plural(k[1].count, 'colis', 'colis') + ' · ' + h(k[2]) + '</span></div>';
      }).join('') + '</div></section>';

    // Alertes
    html += '<section class="card"><h2>À traiter · ' + d.alerts.length + '</h2>';
    if (!d.alerts.length) {
      html += '<p class="empty" style="padding:18px 0">Rien à traiter : vos colis avancent normalement (alerte après ' + d.alertHours + ' h sans mouvement).</p>';
    } else {
      html += d.alerts.map(function (a) {
        var lv = LEVELS[a.level] || LEVELS.info;
        var wa = waLink(a.phone);
        return '<div class="result-row"><span class="pill" style="min-width:96px;text-align:center;background:' + lv.bg + ';color:' + lv.fg + '">' + lv.label + '</span>' +
          '<span class="grow"><strong>' + h(a.title) + '</strong> · <button type="button" class="link-btn" data-act="open-order" data-id="' + h(a.id) + '">' + h(a.id) + '</button> · ' + h(a.client) + ' · ' + h(wilayaName(a.wilaya)) +
          '<br><span class="small" style="color:var(--ink-2)">' + h(a.detail) + '</span>' +
          '<br><span class="small mono">' + h(a.tracking) + ' · ' + h(a.carrierLabel || 'statut pas encore lu') + ' · depuis ' + h(ago(a.since).replace(/^il y a /, '')) + '</span></span>' +
          '<span class="quick">' +
            (/^0\d{8,9}$/.test(String(a.phone).replace(/\D/g, '')) ? '<a class="btn" style="min-height:40px" href="tel:' + h(a.phone) + '" target="_top">Appeler</a>' : '') +
            (wa ? '<a class="btn" style="min-height:40px" href="' + h(wa) + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
            '<button type="button" class="btn" style="min-height:40px" data-act="track-history" data-id="' + h(a.id) + '">Chronologie</button>' +
            '<button type="button" class="btn" style="min-height:40px" data-act="track-done" data-id="' + h(a.id) + '">Marquer comme traité</button></span></div>';
      }).join('');
    }
    html += '</section>';

    // Colis en cours
    var f = S.track.filter;
    var shown = d.parcels.filter(function (p) { return f === 'all' || p.group === f; });
    html += '<section class="card"><h2>Colis en cours · ' + d.parcels.length + '</h2><div class="chips" role="group" aria-label="Filtrer les colis" style="margin-bottom:12px">' +
      GROUPS.map(function (g) {
        var n = g[0] === 'all' ? d.parcels.length : d.parcels.filter(function (p) { return p.group === g[0]; }).length;
        return '<button type="button" class="chip" data-act="track-filter" data-group="' + g[0] + '" aria-pressed="' + (f === g[0]) + '">' + g[1] + ' · ' + n + '</button>';
      }).join('') + '</div>';
    if (!shown.length) {
      html += '<p class="empty" style="padding:18px 0">Aucun colis dans cette catégorie.</p>';
    } else {
      html += '<div class="table-wrap" style="border:0"><table class="data cards"><thead><tr>' +
        ['Commande', 'Wilaya', 'N° de suivi', 'Statut Ecotrack', 'Depuis', 'Total', ''].map(function (t) { return '<th scope="col">' + t + '</th>'; }).join('') + '</tr></thead><tbody>' +
        shown.map(function (p) {
          return '<tr><td data-label="Commande" class="multi"><button type="button" class="link-btn" data-act="open-order" data-id="' + h(p.id) + '">' + h(p.id) + '</button><div class="small">' + h(p.client) + '</div></td>' +
            '<td data-label="Wilaya">' + h(wilayaName(p.wilaya)) + '</td>' +
            '<td data-label="N° de suivi" class="mono">' + h(p.tracking) + '</td>' +
            '<td data-label="Statut Ecotrack">' + h(p.carrierLabel || '—') + (p.stale ? ' <span class="pill" style="background:#FFF3DC;color:#8A5200">' + (p.group === 'draft' ? 'à valider' : 'sans mouvement') + '</span>' : '') + '</td>' +
            '<td data-label="Depuis">' + h(hoursText(p.ageHours)) + '</td>' +
            '<td data-label="Total" class="num strong">' + money(p.total) + '</td>' +
            '<td data-label=""><button type="button" class="btn" style="min-height:36px" data-act="track-history" data-id="' + h(p.id) + '">Chronologie</button></td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    html += '</section>';

    // Versements
    html += '<section class="card"><h2>Versements d’Ecotrack (' + d.days + ' jours)</h2>';
    if (!d.payments.length) {
      html += '<p class="empty" style="padding:18px 0">Aucun versement sur la période. Le n° de versement s’affiche dès qu’Ecotrack le fournit.</p>';
    } else {
      html += '<div class="table-wrap" style="border:0"><table class="data cards"><thead><tr>' +
        ['Versement', 'Colis', 'Montant', 'État', 'Dernier mouvement'].map(function (t) { return '<th scope="col">' + t + '</th>'; }).join('') + '</tr></thead><tbody>' +
        d.payments.map(function (p) {
          return '<tr><td data-label="Versement" class="mono">n° ' + h(p.id) + '</td><td data-label="Colis">' + p.count + '</td>' +
            '<td data-label="Montant" class="num strong">' + money(p.amount) + '</td>' +
            '<td data-label="État"><span class="pill" style="background:' + (p.paid ? '#DDF0E4;color:#146C2E' : '#FFF3DC;color:#8A5200') + '">' + (p.paid ? 'Payé' : 'En cours') + '</span></td>' +
            '<td data-label="Dernier mouvement" class="small">' + fmtDate(p.last) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    html += '</section></div>';
    box.innerHTML = html;
  }

  /* Chronologie d'un colis : dans la fiche de la commande si elle est ouverte, sinon dans une fenêtre. */
  function historyHtml(d) {
    var html = '<div style="margin-top:12px"><p class="small">Colis <span class="mono">' + h(d.tracking) + '</span>' + (d.carrierLabel ? ' · ' + h(d.carrierLabel) : '') + '</p>';
    if (!d.events.length) {
      html += '<p>Ecotrack n’a renvoyé aucune étape que l’outil sache lire.</p>' +
        (d.raw ? '<details><summary class="small">Réponse brute d’Ecotrack (à m’envoyer si besoin)</summary><pre class="mono" style="white-space:pre-wrap;font-size:12px;overflow:auto">' + h(d.raw) + '</pre></details>' : '');
    } else {
      html += '<ol class="timeline">' + d.events.map(function (e) {
        return '<li><span class="t-date">' + (e.date ? fmtDate(e.date) : h(e.dateText || '—')) + '</span><span class="t-body"><strong>' + h(e.label) + '</strong>' +
          (e.note ? '<br><span class="small">' + h(e.note) + '</span>' : '') + '</span></li>';
      }).join('') + '</ol>';
    }
    return html + '</div>';
  }

  function openHistory(id) {
    var inOrder = !!$('#parcel-history') && !!$('#order-form');
    if (inOrder) {
      $('#parcel-history').innerHTML = '<p class="loading" style="padding:12px 0">Chargement…</p>';
    } else {
      showModal(modalHead('Chronologie · ' + h(id)) + '<div id="history-body"><p class="loading">Chargement…</p></div>' +
        '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Fermer</button></div>');
    }
    call('api_parcelHistory', id).then(function (d) {
      var el = inOrder ? $('#parcel-history') : $('#history-body');
      if (el) el.innerHTML = historyHtml(d);
    }).catch(function (e) {
      var el = inOrder ? $('#parcel-history') : $('#history-body');
      if (el) el.innerHTML = '<div style="margin-top:12px">' + errorBox(e) + '</div>';
    });
  }

  /* ================================================================ */
  /* Bénéfices et stock (administrateur)                              */
  /* ================================================================ */

  function pageProfit() {
    view.innerHTML = '<div id="profit"><p class="loading">Chargement…</p></div>';
    S.profit.stock = null;
    loadProfit();
  }

  function loadProfit() {
    var t = ++S.token;
    var p = S.profit;
    var box = $('#profit-body');
    if (box) box.innerHTML = '<p class="loading">Chargement…</p>';
    return call('api_profit', p.period).then(function (d) {
      if (t !== S.token || S.route !== 'benefices') return;
      p.data = d;
      renderProfit();
    }).catch(function (e) {
      if (t === S.token && S.route === 'benefices') $('#profit').innerHTML = errorBox(e);
    });
  }

  function loadStock() {
    return call('api_stock').then(function (d) {
      S.profit.stock = d;
      if (S.route === 'benefices' && S.profit.tab === 'stock') renderProfit();
    }).catch(function (e) {
      if (S.route === 'benefices') $('#profit-body').innerHTML = errorBox(e);
    });
  }

  function signed(n) {
    return '<span class="' + (n < 0 ? 'neg' : 'pos') + '">' + money(n) + '</span>';
  }

  function renderProfit() {
    var p = S.profit;
    var d = p.data;
    var box = $('#profit');
    if (!box || !d) return;
    var periods = [['today', 'Aujourd’hui'], ['7', '7 jours'], ['30', '30 jours'], ['all', 'Tout']];
    var tabs = [['resume', 'Résumé'], ['produits', 'Produits'], ['campagnes', 'Publicité'], ['depenses', 'Dépenses'], ['stock', 'Stock']];
    var html = '<div class="page-head"><div><h1>Bénéfices et stock</h1><p class="sub">Commandes comptées à leur date de commande · visible seulement par l’administrateur</p></div>' +
      '<div class="seg" role="group" aria-label="Période">' + periods.map(function (x) {
        return '<button type="button" data-act="profit-period" data-period="' + x[0] + '" aria-pressed="' + (p.period === x[0]) + '">' + x[1] + '</button>';
      }).join('') + '</div></div>' +
      '<div class="tabs" role="group" aria-label="Rubrique">' + tabs.map(function (x) {
        return '<button type="button" class="chip" data-act="profit-tab" data-tab="' + x[0] + '" aria-pressed="' + (p.tab === x[0]) + '">' + x[1] + '</button>';
      }).join('') + '</div><div id="profit-body"></div>';
    box.innerHTML = html;
    var body = $('#profit-body');
    if (p.tab === 'produits') body.innerHTML = profitProducts(d);
    else if (p.tab === 'campagnes') body.innerHTML = profitCampaigns(d);
    else if (p.tab === 'depenses') body.innerHTML = profitExpenses(d);
    else if (p.tab === 'stock') {
      if (p.stock) body.innerHTML = stockView(p.stock);
      else { body.innerHTML = '<p class="loading">Chargement…</p>'; loadStock(); }
    } else body.innerHTML = profitSummary(d);
  }

  function profitSummary(d) {
    var t = d.totals;
    var kpis = [
      ['Chiffre livré', money(t.revenue), plural(t.delivered, 'commande livrée', 'commandes livrées')],
      ['Bénéfice des commandes', signed(t.ordersProfit), 'Après livraison, achat et retours'],
      ['Dépenses', money(t.expenses), 'Dont publicité : ' + money(t.adSpend)],
      ['Bénéfice net', signed(t.net), 'Ce qui vous reste sur la période'],
      ['Publicité par commande livrée', t.costPerDelivered === null ? '—' : money(t.costPerDelivered), t.deliveryRate === null ? 'Aucune commande terminée' : 'Taux de livraison : ' + Math.round(t.deliveryRate * 100) + ' %']
    ];
    var html = '<div class="stack"><section class="grid-kpi" aria-label="Chiffres clés">' + kpis.map(function (k) {
      return '<div class="card kpi"><span class="label">' + h(k[0]) + '</span><span class="value">' + k[1] + '</span><span class="note">' + h(k[2]) + '</span></div>';
    }).join('') + '</section>';
    var warn = [];
    if (d.warnings.missingCost) warn.push(plural(d.warnings.missingCost, 'commande livrée sans coût d’achat', 'commandes livrées sans coût d’achat') + ' (' + h(d.warnings.missingCostLabels.join(', ')) + ') : complétez l’onglet Produits.');
    if (d.warnings.missingFee) warn.push(plural(d.warnings.missingFee, 'commande sans tarif de livraison', 'commandes sans tarif de livraison') + ' dans l’onglet Tarifs : les frais payés par le client sont utilisés.');
    if (warn.length) html += '<div class="stock-warn" style="flex-direction:column;align-items:flex-start">' + warn.map(function (w) { return '<span>⚠ ' + w + '</span>'; }).join('') + '</div>';
    html += '<section class="card"><h2>Détail</h2><div class="money-lines">' +
      '<div><span>Chiffre livré (encaissé par le livreur)</span><span>' + money(t.revenue) + '</span></div>' +
      '<div><span>− Frais de livraison</span><span>' + money(t.deliveryFees) + '</span></div>' +
      '<div><span>− Coût d’achat des produits livrés</span><span>' + money(t.productCost) + '</span></div>' +
      '<div><span>− Frais de retour (' + t.returned + ' × ' + money(d.returnFee) + ')</span><span>' + money(t.returnFees) + '</span></div>' +
      (t.packaging ? '<div><span>− Emballage</span><span>' + money(t.packaging) + '</span></div>' : '') +
      '<div class="total"><span>Bénéfice des commandes</span>' + signed(t.ordersProfit) + '</div>' +
      d.expensesByCategory.map(function (e) { return '<div><span>− ' + h(e.category) + '</span><span>' + money(e.amount) + '</span></div>'; }).join('') +
      '<div class="total"><span>Bénéfice net</span>' + signed(t.net) + '</div>' +
      '</div><p class="small" style="margin-top:10px">' + t.inTransit + ' commande(s) encore en route ne sont pas comptées : leur bénéfice arrivera à la livraison.</p></section></div>';
    return html;
  }

  function groupRows(list, first) {
    return list.map(function (g) {
      return [first(g), g.orders, g.delivered, g.returned, g.deliveryRate === null ? '—' : Math.round(g.deliveryRate * 100) + ' %',
        money(g.revenue), signed(g.profit)];
    });
  }

  function profitProducts(d) {
    if (!d.products.length) return '<div class="card"><p class="empty">Aucune commande sur la période.</p></div>';
    return '<section class="card"><h2>Par produit</h2>' +
      table(['Produit', 'Commandes', 'Livrées', 'Retours', 'Livraison', 'Chiffre livré', 'Bénéfice'], groupRows(d.products, function (g) { return h(g.name); }), [1, 2, 3, 4, 5, 6]) +
      '<p class="small" style="margin-top:10px">Une commande à plusieurs produits est partagée selon les quantités. Bénéfice avant dépenses (publicité…).</p></section>';
  }

  function adRows(list) {
    return list.map(function (g) {
      return [h(g.name), g.orders, g.delivered, g.deliveryRate === null ? '—' : Math.round(g.deliveryRate * 100) + ' %', signed(g.profit),
        money(g.spend), signed(g.net), g.costPerDelivered === null ? '—' : money(g.costPerDelivered)];
    });
  }

  function profitCampaigns(d) {
    var head = ['', 'Commandes', 'Livrées', 'Livraison', 'Bénéfice', 'Publicité', 'Net', 'Pub / livrée'];
    var html = '<div class="stack"><section class="card"><h2>Par plateforme</h2>' +
      table(['Plateforme'].concat(head.slice(1)), adRows(d.platforms), [1, 2, 3, 4, 5, 6, 7]) + '</section>' +
      '<section class="card"><h2>Par campagne</h2>' +
      table(['Campagne'].concat(head.slice(1)), adRows(d.campaigns), [1, 2, 3, 4, 5, 6, 7]) +
      (d.adUnassigned ? '<p class="small" style="margin-top:10px">' + money(d.adUnassigned) + ' de publicité sans campagne : comptés pour la plateforme, pas pour une campagne.</p>' : '') +
      '<p class="small" style="margin-top:10px">Pour relier vos commandes à vos publicités : ajoutez « UTM source » et « UTM campaign » à la fin de l’onglet RELEASIT, et dans le lien de vos annonces : ' +
      '<span class="mono">utm_source=facebook&amp;utm_campaign={{campaign.name}}</span> (Facebook) ou <span class="mono">utm_source=tiktok&amp;utm_campaign=__CAMPAIGN_NAME__</span> (TikTok). ' +
      'Dans vos dépenses, écrivez le même nom de campagne.</p></section></div>';
    return html;
  }

  function profitExpenses(d) {
    var today = new Date();
    var iso = today.getFullYear() + '-' + ('0' + (today.getMonth() + 1)).slice(-2) + '-' + ('0' + today.getDate()).slice(-2);
    var html = '<div class="stack"><section class="card"><h2>Ajouter une dépense</h2><div class="form-grid" id="expense-form">' +
      field('Date', '<input name="date" type="date" value="' + iso + '">') +
      field('Catégorie', '<select name="category">' + options(d.categories, d.categories[0]) + '</select>') +
      field('Campagne (facultatif)', input('campaign', '', ' list="campaign-list" placeholder="Nom de la campagne"')) +
      field('Montant', input('amount', '', ' type="number" min="0" step="0.01" inputmode="decimal"')) +
      field('Devise', '<select name="currency"><option>USD</option><option>DA</option></select>') +
      field('Note', input('note', ''), 'full') +
      '</div><datalist id="campaign-list">' + d.knownCampaigns.map(function (c) { return '<option value="' + h(c) + '">'; }).join('') + '</datalist>' +
      '<p class="small" style="margin:10px 0">Dollar : ' + money(d.rate) + ' (réglage TAUX_DOLLAR dans Paramètres). Une dépense garde le taux du jour où elle est saisie.</p>' +
      '<button type="button" class="btn primary" data-act="expense-add">Ajouter la dépense</button></section>';
    html += '<section class="card"><h2>Dépenses de la période</h2>' + (d.expenses.length ? table(
      ['Date', 'Catégorie', 'Campagne', 'Montant', 'En dinars'],
      d.expenses.map(function (e) {
        return [h(fmtDay(e.date)), h(e.category), h(e.campaign || '—'),
          e.currency === 'USD' ? h(e.amount + ' $ × ' + e.rate) : money(e.amount), money(e.amountDA)];
      }), [3, 4]
    ) : '<p class="empty">Aucune dépense sur la période.</p>') +
      '<p class="small" style="margin-top:10px">Pour corriger ou supprimer une dépense : onglet Dépenses du classeur.</p></section></div>';
    return html;
  }

  function fmtDay(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
  }

  function addExpense(btn) {
    var data = readForm($('#expense-form'));
    btn.disabled = true;
    call('api_addExpense', data).then(function (r) {
      toast(r.message);
      btn.disabled = false;
      loadProfit();
    }).catch(function (e) { btn.disabled = false; toast(errText(e), true); });
  }

  function stockView(s) {
    var html = '<div class="stack">';
    if (!s.products.length) {
      html += '<div class="card"><p class="empty">L’onglet Produits est vide. Ajoutez les modèles de vos commandes ci-dessous, puis indiquez leur coût d’achat et leur stock dans le classeur.</p></div>';
    }
    s.products.forEach(function (g) {
      html += '<section class="card"><h2>' + h(g.product) + '</h2>' +
        '<p class="sub" style="margin:-4px 0 10px">' + (g.tracked ? 'Stock ' + g.stock + ' · réservé ' + g.reserved + ' · <strong>disponible ' + g.available + '</strong>' : 'Stock non suivi (colonne Stock vide)') + '</p>' +
        '<div class="table-wrap" style="border:0"><table class="data cards"><thead><tr>' +
        ['Modèle', 'Stock', 'Réservé', 'Disponible', 'Coût d’achat', 'Prix de vente'].map(function (t) { return '<th scope="col">' + t + '</th>'; }).join('') +
        '</tr></thead><tbody>' + g.models.map(function (m) {
          return '<tr class="model-row' + (m.low ? ' low' : '') + '">' +
            '<td data-label="Modèle">' + h(m.model || '—') + (m.low ? ' <span class="pill" style="background:#FFF3DC;color:#8A5200">stock bas</span>' : '') + '</td>' +
            '<td data-label="Stock" class="num">' + (m.tracked ? m.stock : '—') + '</td>' +
            '<td data-label="Réservé" class="num">' + m.reserved + '</td>' +
            '<td data-label="Disponible" class="num strong">' + (m.tracked ? m.available : '—') + '</td>' +
            '<td data-label="Coût d’achat" class="num">' + (m.cost === null ? '<span class="neg">à remplir</span>' : money(m.cost)) + '</td>' +
            '<td data-label="Prix de vente" class="num">' + (m.price === null ? '—' : money(m.price)) + '</td></tr>';
        }).join('') + '</tbody></table></div></section>';
    });
    if (s.unknown.length) {
      html += '<section class="card"><h2>Modèles vus dans les commandes, absents de l’onglet Produits</h2>' +
        table(['Produit', 'Modèle', 'Commandes', ''], s.unknown.map(function (u) {
          return [h(u.product), h(u.model || '—'), u.orders, '<button type="button" class="btn" style="min-height:36px" data-act="catalog-add" data-label="' + h(u.label) + '">Ajouter</button>'];
        }), [2]) +
        '<p style="margin-top:12px"><button type="button" class="btn primary" data-act="catalog-add">Tout ajouter à l’onglet Produits</button></p>' +
        '<p class="small" style="margin-top:8px">Ensuite, dans le classeur, indiquez pour chaque modèle son coût d’achat et son stock.</p></section>';
    }
    html += '<p class="small">Une commande confirmée réserve ses produits ; le stock baisse quand le colis part et remonte quand le retour est reçu. Le stock se corrige à la main dans l’onglet Produits.</p></div>';
    return html;
  }

  function addToCatalog(labels, btn) {
    var list = labels || (S.profit.stock ? S.profit.stock.unknown.map(function (u) { return u.label; }) : []);
    if (!list.length) return;
    btn.disabled = true;
    call('api_addCatalogItems', list).then(function (r) {
      toast(r.message);
      S.profit.stock = null;
      renderProfit();
    }).catch(function (e) { btn.disabled = false; toast(errText(e), true); });
  }

  /* ================================================================ */
  /* Événements                                                       */
  /* ================================================================ */

  var ACTIONS = {
    'goto': function (el) {
      if (el.getAttribute('data-tab')) S.profit.tab = el.getAttribute('data-tab');
      navigate(el.getAttribute('data-route'), el.getAttribute('data-status'));
    },
    'profit-period': function (el) { S.profit.period = el.getAttribute('data-period'); loadProfit(); },
    'profit-tab': function (el) { S.profit.tab = el.getAttribute('data-tab'); renderProfit(); },
    'expense-add': addExpense,
    'catalog-add': function (el) { addToCatalog(el.getAttribute('data-label') ? [el.getAttribute('data-label')] : null, el); },
    'sms-send': function (el) {
      el.disabled = true;
      call('api_smsSendNow').then(function (r) { toast(r.message); loadShopStatus(); }).catch(function (e) { el.disabled = false; toast(errText(e), true); });
    },
    'period': function (el) { S.period = el.getAttribute('data-period'); pageDashboard(); },
    'chip': function (el) { S.filter.status = el.getAttribute('data-status'); S.filter.limit = 100; loadOrders(); },
    'more': function () { S.filter.limit += 100; loadOrders(); },
    'open-order': function (el) { openOrder(el.getAttribute('data-id')); },
    'new-order': openNewOrder,
    'releasit-transfer': function () {
      toast('Lecture de l’onglet RELEASIT…');
      call('api_releasitTransfer').then(function (r) {
        toast(r.message);
        loadShopStatus();
        if (r.summary && r.summary.added) { loadOrders(); refreshCount(); }
      }).catch(function (e) { toast(errText(e), true); loadShopStatus(); });
    },
    'shop-import': function () {
      toast('Importation depuis Shopify…');
      call('api_shopifyImport').then(function (r) {
        toast(r.message);
        loadShopStatus();
        loadOrders();
        refreshCount();
      }).catch(function (e) { toast(errText(e), true); loadShopStatus(); });
    },
    'close-modal': closeModal,
    'save-order': saveOrder,
    'parcel-cancel-ask': function (el) { askCancelParcel(el.getAttribute('data-id'), el.getAttribute('data-tracking'), el.getAttribute('data-from') === 'ship'); },
    'parcel-cancel': cancelParcel,
    'order-delete-ask': function (el) { askDeleteOrder(el.getAttribute('data-id')); },
    'order-delete': deleteOrder,
    'order-reopen': reopenOrder,
    'order-unlock': function (el) { S.unlockId = el.getAttribute('data-id'); if (S.order) renderOrderModal(S.order); },
    'create-order': createOrder,
    'toggle-blacklist': toggleBlacklist,
    'refresh-queue': function () { loadQueue(false, true); },
    'q-open': function (el) { if (!S.busy) openInDetail(el.getAttribute('data-id')); },
    'toggle-queue': function () { $('#queue').classList.toggle('open'); },
    'confirm': function () { submit('confirm'); },
    'no_answer': function () { submit('no_answer'); },
    'show-callback': function () { showPanel('callback'); },
    'show-cancel': function () { showPanel('cancel'); },
    'cb-quick': function (el) {
      var d = new Date();
      if (el.hasAttribute('data-min')) d = new Date(Date.now() + Number(el.getAttribute('data-min')) * 60000);
      else { d.setDate(d.getDate() + 1); d.setHours(Number(el.getAttribute('data-tomorrow')), 0, 0, 0); }
      submit('callback', { callback: d.toISOString() });
    },
    'callback': function () {
      var v = $('#cb-when').value;
      if (!v) { toast('Choisissez une date et une heure.', true); return; }
      submit('callback', { callback: new Date(v).toISOString() });
    },
    'cancel': function () { submit('cancel', { reason: $('#cancel-reason').value }); },
    'ship-reload': function () { loadShipping(); },
    'ship-tab': function (el) { S.ship.tab = el.getAttribute('data-tab'); renderShipping(); },
    'ship-dismiss': function () { S.ship.results = null; renderShipping(); },
    'ship-ask': askShip,
    'ship-confirm': doShip,
    'eco-test': function () { ecoAction('api_ecotrackTest', 'Test de la connexion…'); },
    'eco-status': function () { ecoAction('api_ecotrackSyncStatuses', 'Lecture des statuts chez Ecotrack…'); },
    'eco-fees-ask': function () {
      confirmModal('Récupérer les tarifs Ecotrack ?',
        'Les colonnes « Ecotrack domicile » et « Ecotrack stop desk » de l’onglet Tarifs seront remplacées par les prix d’Ecotrack. Les prix Yalidine ne changent pas.',
        'eco-fees', 'Récupérer');
    },
    'eco-fees': function () { closeModal(); ecoAction('api_ecotrackSyncFees', 'Récupération des tarifs…'); },
    'track-sync': function () {
      toast('Lecture des statuts chez Ecotrack…');
      call('api_ecotrackSyncStatuses').then(function (r) { toast(r.message); loadTracking(); refreshCount(); })
        .catch(function (e) { toast(errText(e), true); });
    },
    'track-days': function (el) { S.track.days = Number(el.getAttribute('data-days')); loadTracking(); },
    'track-filter': function (el) { S.track.filter = el.getAttribute('data-group'); renderTracking(); },
    'track-history': function (el) { openHistory(el.getAttribute('data-id')); },
    'track-done': function (el) {
      el.disabled = true;
      call('api_markFollowUp', el.getAttribute('data-id')).then(function () {
        toast('Alerte marquée comme traitée');
        loadTracking();
        refreshCount();
      }).catch(function (e) { el.disabled = false; toast(errText(e), true); });
    }
  };

  document.addEventListener('click', function (e) {
    if (e.target.classList && e.target.classList.contains('modal-backdrop')) { closeModal(); return; }
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.getAttribute('data-act')];
    if (!fn) return;
    e.preventDefault();
    e.stopPropagation();
    fn(el, e);
  });

  var searchTimer = null;
  document.addEventListener('input', function (e) {
    if (e.target.id === 'f-q') {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { S.filter.q = e.target.value; S.filter.limit = 100; loadOrders(); }, 350);
    } else if (e.target.closest('#d-form')) {
      updateSummary();
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.hasAttribute('data-ship-check')) {
      var sid = e.target.getAttribute('data-ship-check');
      if (e.target.checked) S.ship.selected[sid] = true; else delete S.ship.selected[sid];
      renderShipping();
      return;
    }
    if (e.target.hasAttribute('data-ship-all')) {
      S.ship.selected = {};
      if (e.target.checked && S.ship.data) {
        S.ship.data.toShip.forEach(function (o) { if (!o.problems.length) S.ship.selected[o.id] = true; });
      }
      renderShipping();
      return;
    }
    if (e.target.id === 'f-wilaya') { S.filter.wilaya = e.target.value; S.filter.limit = 100; loadOrders(); }
    else if (e.target.id === 'f-period') { S.filter.period = e.target.value; S.filter.limit = 100; loadOrders(); }
    else if (e.target.getAttribute('data-role') === 'status') toggleCancelField();
    else if (e.target.closest('#d-form')) updateSummary();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modalOpen()) closeModal();
  });

  function tick() {
    if (document.visibilityState !== 'visible' || S.busy || modalOpen()) return;
    if (S.route === 'confirmation') { if (!Object.keys(S.pending).length) loadQueue(false, true); }
    else if (S.route === 'suivi') loadTracking();
    else refreshCount();
  }

  /* ================================================================ */
  /* Démarrage                                                        */
  /* ================================================================ */

  var firstSpec = preloadSpec(currentRoute());
  call('api_bootstrap', firstSpec).then(function (b) {
    S.boot = b;
    if (b.preload && firstSpec && b.preload.key === firstSpec.key) S.preloaded[firstSpec.key] = b.preload.data;
    applyCounts(b.counts);
    $all('[data-shop]').forEach(function (el) { el.textContent = b.shop; });
    $all('[data-user-name]').forEach(function (el) { el.textContent = b.user.name; });
    $all('[data-user-mail]').forEach(function (el) { el.textContent = b.user.email; });
    $all('[data-admin]').forEach(function (el) { el.hidden = !b.user.admin; });
    window.addEventListener('hashchange', go);
    go();
    if (!b.counts) refreshCount();
    setInterval(tick, 60000);
  }).catch(function (e) {
    view.innerHTML = errorBox(e) +
      '<p class="sub" style="margin-top:12px">Vérifiez que le classeur est partagé avec votre adresse Google (en Éditeur), puis rechargez la page.</p>';
  });
})();
</script>
