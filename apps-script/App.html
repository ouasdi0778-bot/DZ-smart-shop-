  /** Photo du produit (page Stock › Modifier, ou reprise de Shopify) : la première des articles de la commande. */
  function productPhoto(items) {
    var it = (items || []).filter(function (x) { return x.photo; })[0];
    return it ? '<img class="prod-photo" src="' + h(it.photo) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' : '';
  }

  /** Avertissement de stock pour les articles d'une commande. */
  function stockNote(items, compact) {
    if (!items || !items.length) return '';
    var short = items.filter(function (it) { return it.short; });
    var html = short.map(function (it) {
      if (it.pack) {
        return '<div class="stock-warn">' + icon('alert') + 'Stock insuffisant pour le pack ' + h(it.model || it.product) + ' : ' + h((it.lacking || []).join(', ')) +
          (it.available !== null ? ' (packs disponibles : ' + Math.max(it.available, 0) + ', demandé ' + it.qty + ')' : '') + '</div>';
      }
      return '<div class="stock-warn">' + icon('alert') + 'Stock insuffisant : ' + h(it.model || it.product) + ' — disponible ' + Math.max(it.available, 0) +
        (it.reserved ? ' (' + it.reserved + ' réservé' + (it.reserved > 1 ? 's' : '') + ')' : '') + ', demandé ' + it.qty + '</div>';
    }).join('');
    if (!short.length && S.boot.user.admin && !compact) {
      var unknown = items.filter(function (it) { return !it.matched; });
      if (unknown.length) html += '<div class="stock-warn info">Produit absent de l’onglet Produits : stock et bénéfice non suivis (' + h(unknown.map(function (u) { return u.label; }).join(', ')) + ').</div>';
    }
    return html;
  }

  function toggleCancelField() {
    var st = $('#order-form [data-role="status"]');
    var reason = $('#order-form [name="cancelReason"]');
    if (!st || !reason) return;
    reason.closest('.field').hidden = st.value !== 'Annulée';
  }

  /** Nouvelle commande : un produit choisi dans la liste remplit le prix (prix de vente × quantité). */
  function fillNewOrderPrice() {
    var form = $('#order-form');
    var name = String(($('[name="product"]', form) || {}).value || '').trim();
    var p = S.boot.products.filter(function (x) { return x.name === name; })[0];
    if (!p || !p.price) return;
    var qty = Math.max(1, Number(($('[name="qty"]', form) || {}).value) || 1);
    $('[name="price"]', form).value = p.price * qty;
  }

  function openNewOrder() {
    showModal(
      modalHead('Nouvelle commande', '<p class="small" style="margin-top:4px">Elle sera ajoutée au classeur et à la file de confirmation.</p>') +
      '<div id="order-form">' + orderFields({ qty: 1, mode: S.boot.modes[0] }) + '</div>' +
      '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Annuler</button>' +
      '<button type="button" class="btn primary" data-act="create-order">Ajouter la commande</button></div>'
    );
  }

  /** Après une modification : recharge la page affichée ; les compteurs viennent de la réponse quand elle les donne. */
  function afterOrderChange(counts) {
    if (S.route === 'commandes') loadOrders();
    else if (S.route === 'tableau') pageDashboard();
    else if (S.route === 'expeditions') loadShipping();
    else if (S.route === 'suivi') loadTracking();
    if (counts) applyCounts(counts); else refreshCount();
  }

  function inStatusFilter(o) {
    var f = String(S.filter.q || '').trim() ? 'all' : S.filter.status;
    if (f === 'all') return true;
    if (f === 'todo') return !o.status || TODO_STATUSES.indexOf(o.status) >= 0;
    if (f === 'queue') return S.boot.queueStatuses.indexOf(o.status) >= 0;
    return o.status === f;
  }

  /**
   * Page Commandes : met à jour la ligne modifiée (ou la retire) sans recharger
   * toute la liste. Ailleurs, recharge la page comme avant.
   */
  function afterOrderSaved(o, removedId, counts) {
    counts = counts || (o && o.counts);
    if (S.route !== 'commandes' || !S.list) { afterOrderChange(counts); return; }
    applyCounts(counts);
    var id = removedId || o.id;
    var rows = S.list.rows;
    var idx = -1;
    for (var i = 0; i < rows.length; i++) if (rows[i].id === id) idx = i;
    if (idx < 0) { loadOrders(); return; }
    var old = rows[idx];
    var c = S.list.counts;
    var bump = function (st, n) {
      c[st || '—'] = Math.max((c[st || '—'] || 0) + n, 0);
      if (S.boot.queueStatuses.indexOf(st) >= 0) c.queue = Math.max((c.queue || 0) + n, 0);
      if (!st || TODO_STATUSES.indexOf(st) >= 0) c.todo = Math.max((c.todo || 0) + n, 0);
    };
    bump(old.status, -1);
    if (removedId) c.all = Math.max((c.all || 0) - 1, 0); else bump(o.status, 1);
    if (!removedId && inStatusFilter(o)) {
      rows[idx] = o;
    } else {
      rows.splice(idx, 1);
      S.list.total = Math.max(S.list.total - 1, 0);
    }
    renderChips(c);
    renderOrderList(S.list);
  }

  function saveOrder(btn) {
    var id = btn.getAttribute('data-id');
    var form = $('#order-form');
    var data = readForm(form);
    if (form.getAttribute('data-locked') === '1') {
      data = { notes: data.notes, status: data.status, cancelReason: data.cancelReason };
    } else if (form.getAttribute('data-force') === '1') {
      data.force = true;
      data.forceReason = ($('[data-role="force-reason"]') || {}).value || '';
      if (!String(data.forceReason).trim()) { toast('Indiquez le motif du déverrouillage.', true); return; }
    }
    // La fenêtre se ferme tout de suite ; si le serveur refuse, elle revient avec ce qui avait été saisi.
    var before = S.order;
    var unlockId = S.unlockId;
    delete S.orderCache[id];
    closeModal();
    toast('Enregistrement de la commande ' + id + '…');
    call('api_updateOrder', id, data).then(function (o) {
      toast('Commande ' + o.id + ' enregistrée');
      afterOrderSaved(o);
    }).catch(function (e) {
      toast('Commande ' + id + ' non enregistrée : ' + errText(e), true);
      if (!before || modalOpen()) return;
      S.unlockId = unlockId;
      renderOrderModal(before);
      restoreForm($('#order-form'), data);
      if (data.forceReason && $('[data-role="force-reason"]')) $('[data-role="force-reason"]').value = data.forceReason;
    });
  }

  /** Remet dans un formulaire les valeurs saisies (après un refus du serveur). */
  function restoreForm(form, data) {
    if (!form || !data) return;
    Object.keys(data).forEach(function (k) {
      var el = form.querySelector('[name="' + k + '"]');
      if (el && !el.disabled && typeof data[k] !== 'boolean') el.value = data[k];
    });
    if (typeof toggleCancelField === 'function') toggleCancelField();
  }

  function createOrder(btn) {
    var data = readForm($('#order-form'));
    btn.disabled = true;
    call('api_createOrder', data).then(function (o) {
      closeModal();
      toast('Commande ' + o.id + ' ajoutée');
      afterOrderChange(o.counts);
    }).catch(function (e) { btn.disabled = false; toast(errText(e), true); });
  }

  function toggleBlacklist(btn) {
    var on = btn.getAttribute('data-on') === 'true';
    btn.disabled = true;
    call('api_setBlacklist', btn.getAttribute('data-phone'), on).then(function (r) {
      toast(r.blacklisted ? 'Numéro ajouté à la liste noire' : 'Numéro retiré de la liste noire');
      btn.setAttribute('data-on', String(!r.blacklisted));
      btn.textContent = r.blacklisted ? 'Retirer de la liste noire' : 'Mettre en liste noire';
      btn.classList.toggle('danger', !r.blacklisted);
      btn.disabled = false;
    }).catch(function (e) { btn.disabled = false; toast(errText(e), true); });
  }

  /* ================================================================ */
  /* Centre de confirmation                                           */
  /* ================================================================ */

  function pageConfirm() {
    view.innerHTML =
      '<div class="page-head confirm-head"><div><h1>Centre de confirmation</h1><p class="sub">Connecté(e) : ' + h(S.boot.user.name) + '</p></div>' +
      '<div class="stats" id="cstats"></div></div>' +
      '<div class="confirm">' +
        '<section class="queue" id="queue" aria-label="File d’appels"><p class="loading">Chargement…</p></section>' +
        '<section class="detail" id="detail"></section>' +
      '</div>';
    S.prefetch = null;
    // Fiche de la première commande déjà reçue (mémoire sur l'appareil) : affichée sans attendre.
    if (S.queue && S.queue.firstDetail && S.queue.due && S.queue.due.length && S.queue.firstDetail.order.id === S.queue.due[0].id &&
        !(S.current && S.current.order && S.current.order.id === S.queue.due[0].id)) S.current = S.queue.firstDetail;
    var cached = S.queue && S.queue.due && S.queue.due.length && S.current && S.current.order && S.current.order.id === S.queue.due[0].id;
    if (S.queue) {
      renderQueue();
      if (cached) { S.currentId = S.current.order.id; markCurrent(); renderDetail(); } else { S.currentId = null; }
    } else {
      S.currentId = null;
    }
    loadQueue(true, true);
  }

  /** Retire de la file les commandes déjà envoyées au serveur, pas encore enregistrées. */
  function setQueue(q) {
    q.waiting = q.waiting || [];
    q.due = q.due.filter(function (x) { return !S.pending[x.id]; });
    q.later = q.later.filter(function (x) { return !S.pending[x.id]; });
    q.waiting = q.waiting.filter(function (x) { return !S.pending[x.id]; });
    q.stats.due = q.due.length;
    q.stats.later = q.later.length;
    q.stats.waiting = q.waiting.length;
    S.queue = q;
  }

  /** Rappels dont l'heure arrive : ils passent dans « À appeler maintenant », en orange (sans attendre le serveur). */
  function promoteRecalls() {
    var q = S.queue;
    if (!q || !q.later.length) return [];
    var now = Date.now();
    var moved = q.later.filter(function (x) { return x.callback && new Date(x.callback).getTime() <= now; });
    if (!moved.length) return [];
    moved.forEach(function (x) { x.recall = true; });
    q.later = q.later.filter(function (x) { return moved.indexOf(x) < 0; });
    q.due = moved.concat(q.due);
    q.stats.due = q.due.length;
    q.stats.later = q.later.length;
    setQueueCount(q.due.length);
    return moved;
  }

  function loadQueue(selectFirst, sync) {
    var opts = sync ? (selectFirst ? { sync: true, first: true } : { sync: true }) : null;
    syncStart();
    return (opts ? call('api_queue', opts) : call('api_queue')).then(function (q) {
      syncEnd();
      if (S.route !== 'confirmation') return;
      perfDone('confirmation');
      if (q.arrived) toast(arrivedText(q.arrived));
      if (q.menuCounts) applyCounts(q.menuCounts);
      setQueue(q);
      setQueueCount(q.stats.due, q.stats.pending);
      renderQueue();
      var ids = q.due.concat(q.later).map(function (x) { return x.id; });
      if (selectFirst || !S.currentId || ids.indexOf(S.currentId) < 0) {
        if (!selectFirst && S.currentId && !S.busy) toast('La commande ' + S.currentId + ' a été traitée par une autre personne.');
        var shown = q.due.length && S.currentId === q.due[0].id && $('#d-form') && S.current && q.firstDetail &&
          q.firstDetail.order.id === S.currentId && q.firstDetail.order.updated === S.current.order.updated;
        if (shown) {
          // La fiche affichée (dernières données) est toujours à jour : on la garde, pour ne pas effacer une saisie.
          S.current = q.firstDetail;
        } else if (q.firstDetail && q.due.length && q.firstDetail.order.id === q.due[0].id) {
          // Fiche jointe à la file : affichée sans nouvel aller-retour.
          S.currentId = q.due[0].id; S.current = q.firstDetail; ++S.detailToken;
          markCurrent(); renderDetail();
        } else if (q.due.length) openInDetail(q.due[0].id);
        else renderEmptyDetail();
      }
    }).catch(function (e) {
      syncEnd();
      if (S.route === 'confirmation' && !S.queue) $('#queue').innerHTML = errorBox(e);
    });
  }

  function renderQueue() {
    var q = S.queue;
    q.waiting = q.waiting || [];
    // Compteurs : un appui ouvre la liste au bon bloc (sur téléphone, la liste est repliée).
    $('#cstats').innerHTML =
      '<button type="button" data-act="queue-jump" data-b="due"><strong>' + q.stats.due + '</strong> à appeler</button>' +
      '<button type="button" class="st-cb" data-act="queue-jump" data-b="later"><strong>' + q.stats.later + '</strong> ' + (q.stats.later > 1 ? 'rappels' : 'rappel') + '</button>' +
      '<button type="button" class="st-na" data-act="queue-jump" data-b="waiting"><strong>' + q.waiting.length + '</strong> en attente</button>' +
      '<span class="st-mine">Mes confirmations aujourd’hui : <strong>' + q.stats.confirmedToday + '</strong></span>';
    var html = '<div class="q-legend" aria-hidden="true"><span><i class="q-new"></i>Nouvelle</span><span><i class="q-na"></i>Pas de réponse · Injoignable</span><span><i class="q-cb"></i>Rappel demandé</span></div>' +
      '<div class="q-top"><span class="queue-title" id="qb-due">À appeler maintenant · ' + q.due.length + '</span>' +
      '<button type="button" class="btn" style="min-height:36px;padding:0 10px" data-act="refresh-queue">' + icon('refresh') + 'Actualiser</button></div>';
    html += q.due.length ? q.due.map(function (x) { return queueCard(x, 'due'); }).join('') : '<p class="small">Personne à appeler pour le moment.</p>';
    html += '<span class="queue-title" id="qb-later">Rappels à venir · ' + q.later.length + '</span>' +
      (q.later.length ? q.later.map(function (x) { return queueCard(x, 'later'); }).join('') : '<p class="small">Aucun rappel programmé.</p>');
    if (q.waiting.length) {
      html += '<span class="queue-title" id="qb-waiting">En attente · ' + q.waiting.length + help('Ni confirmées ni annulées : elles restent ici jusqu’à une décision.') + '</span>' +
        q.waiting.map(function (x) { return queueCard(x, 'waiting'); }).join('');
    }
    $('#queue').innerHTML = html;
  }

  /** Les derniers appels : « 10:05 pas de réponse → 14:30 pas de réponse ». */
  function callsLine(calls, max) {
    if (!calls || !calls.length) return '';
    var shown = calls.slice(-(max || 3));
    return '<span class="q-calls">' + (calls.length > shown.length ? '… → ' : '') + shown.map(function (c) {
      return '<span><b>' + h(c.when.slice(6) || c.when) + '</b> ' + h(c.text.replace(/ · [^·]+$/, '').toLowerCase()) + '</span>';
    }).join(' → ') + '</span>';
  }

  /** Couleur d'une commande de la file : nouvelle (bleu), pas de réponse ou injoignable (orange), rappel demandé (violet). */
  function queueKind(x) {
    if (x.status === 'Rappeler') return 'cb';
    if (x.status === 'Pas de réponse' || x.status === 'Injoignable') return 'na';
    if (x.status === 'À confirmer' || !x.status) return 'new';
    return 'other';
  }
  /** Appels du jour : ●●○ (au plus APPELS_PAR_JOUR), et le total s'il est plus grand. */
  function callDots(x, kind) {
    if (kind !== 'na' && kind !== 'cb') return '';
    var max = S.boot.callsPerDay || 3;
    var n = Math.min(x.callsToday || 0, max);
    if (kind === 'cb' && !n) return ''; // rappel demandé sans appel manqué aujourd'hui : rien à compter
    var dots = '';
    for (var i = 0; i < max; i++) dots += '<i' + (i < n ? ' class="on"' : '') + '></i>';
    return '<span class="q-dots" title="Appels aujourd’hui">' + dots + '<em>' + n + '/' + max + ' aujourd’hui' +
      (x.attempts > n ? ' · ' + plural(x.attempts, 'appel', 'appels') + ' en tout' : '') + '</em></span>';
  }
  function queueCard(x, block) {
    var kind = queueKind(x);
    var when = block === 'later' ? 'rappel ' + fmtDate(x.callback)
      : x.status === 'À confirmer' || !x.status ? 'reçue ' + ago(x.date)
      : x.recall ? 'rappel prévu ' + fmtDate(x.callback) : (x.callback ? 'rappel ' + fmtDate(x.callback) : ago(x.date));
    var cls = 'q-item q-' + kind + (x.recall ? ' q-recall' : '') + (block === 'waiting' ? ' q-waiting' : '');
    var act = x.callable === false ? 'open-order' : 'q-open';
    var status = kind === 'new' ? '<span class="q-st">' + icon('inbox') + 'Nouvelle</span>'
      : kind === 'cb' ? '<span class="q-st">' + icon('calendar') + 'Rappel demandé</span>'
      : kind === 'na' ? '<span class="q-st">' + icon(x.status === 'Injoignable' ? 'alert' : 'noanswer') + h(x.status) + '</span>'
      : pill(x.status);
    // « Nouveau client » reste discret : les vraies alertes (liste noire, doublon, risque…) ressortent.
    var alert = x.alertLevel === 'new' ? (x.alert ? '<span class="q-quiet">' + h(x.alert) + '</span>' : '') : alertPill(x.alert, x.alertLevel);
    return '<button type="button" class="' + cls + '" data-act="' + act + '" data-id="' + h(x.id) + '" aria-current="' + (x.id === S.currentId) + '">' +
      '<span class="q-top"><strong dir="auto">' + h(x.client || 'Sans nom') + '</strong><span class="small">' + h(when) + '</span></span>' +
      '<span class="small" style="color:var(--ink-2)">' + h(x.id) + ' · ' + h(wilayaName(x.wilaya)) + ' · ' + money(x.total) + '</span>' +
      (x.recall ? '<span class="q-now"><span class="q-pulse"></span>À rappeler maintenant</span>' : '') +
      (x.reason ? '<span class="q-motif">' + icon('alert') + h(x.reason) + '</span>' : '') +
      '<span class="q-tags">' + status + alert +
        (x.late && block !== 'later' ? '<span class="pill q-latepill">' + icon('clock') + 'en retard · ' + h(hoursText(x.waitHours)) + '</span>' : '') +
        callDots(x, kind) +
      '</span>' + callsLine(x.calls) + '</button>';
  }  function markCurrent() {
    $all('#queue .q-item').forEach(function (b) {
      b.setAttribute('aria-current', String(b.getAttribute('data-id') === S.currentId));
    });
  }

  /**
   * Personne à appeler maintenant : la liste reste ouverte (sur téléphone aussi), pour qu'un client
   * qui rappelle se retrouve dans « Rappels à venir » ou « En attente ».
   */
  function renderEmptyDetail() {
    S.currentId = null;
    S.current = null;
    var q = S.queue || { later: [], waiting: [] };
    var next = q.later[0];
    var others = q.later.length + (q.waiting || []).length;
    var box = $('#detail');
    box.classList.add('is-empty');
    box.innerHTML = '<div class="card"><h2>Personne à appeler maintenant' +
      help('Les nouvelles commandes arrivent toutes seules, en général moins d’une minute après la commande.' +
        (others ? ' Un client rappelle ? Touchez sa commande dans « Rappels à venir » ou « En attente » : vous pouvez la confirmer tout de suite.' : '')) + '</h2>' +
      (next ? '<p class="sub">Prochain rappel : <span dir="auto">' + h(next.client) + '</span>, ' + fmtDate(next.callback) + '</p>' : '') +
      '</div>';
    var list = $('#queue');
    if (list) list.classList.add('open');
  }

  /** Compteur touché : la liste s'ouvre sur ce bloc. */
  function jumpToBlock(el) {
    var list = $('#queue');
    if (!list) return;
    list.classList.add('open');
    var title = $('#qb-' + el.getAttribute('data-b'));
    if (title) title.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function openInDetail(id) {
    S.currentId = id;
    markCurrent();
    $('#queue').classList.remove('open');
    $('#detail').classList.remove('is-empty');
    $('#detail').innerHTML = '<div class="card"><p class="loading">Chargement…</p></div>';
    var t = ++S.detailToken;
    call('api_getOrder', id).then(function (data) {
      if (t !== S.detailToken || S.route !== 'confirmation') return;
      S.current = data;
      renderDetail();
    }).catch(function (e) {
      if (t === S.detailToken) $('#detail').innerHTML = '<div class="card">' + errorBox(e) + '</div>';
    });
  }

  function renderDetail() {
    var dbox = $('#detail');
    // On sortait de « Personne à appeler » : la liste, ouverte pour l'occasion, se replie (téléphone).
    if (dbox && dbox.classList.contains('is-empty')) {
      dbox.classList.remove('is-empty');
      var list = $('#queue');
      if (list) list.classList.remove('open');
    }
    var d = S.current;
    var o = d.order;
    var b = S.boot;
    var hist = d.history;
    var a = ALERT[o.alertLevel] || ALERT['new'];
    var histText = hist.orders
      ? plural(hist.orders, 'autre commande', 'autres commandes') + ' : ' + hist.delivered + ' livrée(s), ' + hist.returned + ' retour(s), ' + hist.cancelled + ' annulée(s)'
      : 'Première commande avec ce numéro';
    var dueCount = S.queue ? S.queue.due.length : 0;
    var callBtn = d.phoneValid
      ? '<a class="btn primary d-call" href="tel:' + h(o.phone) + '" target="_top">' + icon('confirmation') + '<span class="d-call-txt">Appeler<small>' + h(fmtPhone(o.phone)) + '</small></span></a>'
      : '<span class="btn" aria-disabled="true">Numéro invalide · ' + h(o.phone || '—') + '</span>';
    // WhatsApp : le bouton ouvre la conversation avec le message prêt ; le « ? » le montre avant.
    var waBtn = d.intlPhone
      ? '<span class="d-wa-wrap"><a class="btn" id="d-wa" href="#" target="_blank" rel="noopener" title="WhatsApp">' + icon('whatsapp') + '<span class="lbl">WhatsApp</span></a>' +
        '<button type="button" class="qh" data-act="qh" data-tip="d-wa-tip" aria-label="Voir le message WhatsApp" aria-expanded="false">?</button></span>'
      : '';
    var pills = [ago(o.date), 'Jour ' + Math.min(o.callDay, S.boot.callDays) + '/' + S.boot.callDays, o.callsToday + '/' + S.boot.callsPerDay + ' appels'];
    if (o.attempts) pills.push(plural(o.attempts, 'appel en tout', 'appels en tout'));
    // La fiche s'ouvre en résumé ; le formulaire complet seulement avec « Modifier » (ou s'il manque quelque chose).
    var mustEdit = !d.phoneValid || !String(o.wilaya || '').trim() || !String(o.product || '').trim();
    S.editOpen = mustEdit;
    var important = o.alertLevel && o.alertLevel !== 'new';

    $('#detail').innerHTML =
      '<div class="card">' +
        '<div class="detail-head"><div><h2><span dir="auto">' + h(o.client || 'Client sans nom') + '</span><span class="d-id">' + h(o.id) + '</span></h2>' +
          '<div class="d-pills">' + pills.map(function (t) { return '<span>' + h(t) + '</span>'; }).join('') +
            (o.alertLevel === 'new' && o.alert ? '<span class="d-new">' + h(o.alert) + '</span>' : '') + '</div></div>' +
          '<div class="quick d-actions"><button type="button" class="btn queue-toggle" data-act="toggle-queue" title="File d’appels">File · ' + dueCount + '</button>' + callBtn + waBtn + '</div>' +
        '</div>' +
        (d.intlPhone ? '<span class="qh-tip d-wa-tip" id="d-wa-tip" hidden><span id="d-msg"></span>' +
          '<a class="btn wa-btn" id="d-wa2" href="#" target="_blank" rel="noopener">' + icon('whatsapp') + 'Envoyer sur WhatsApp</a></span>' : '') +
        (important ? '<div class="history" style="background:' + a.bg + '"><span class="strong" style="color:' + a.fg + '">' + h(o.alert) + '</span><span>' + h(histText) + '</span></div>' : '') +
        stockNote(d.stock, true) +
        '<div class="brief" id="d-brief"></div>' +
        callHistory(o) +
        '<div class="edit-box" id="d-edit"' + (mustEdit ? '' : ' hidden') + '>' +
        '<div class="form-grid" id="d-form">' +
          field('Client', input('client', o.client, ' dir="auto"')) +
          field('Téléphone', input('phone', o.phone, ' inputmode="tel"')) +
          field('Wilaya', '<select name="wilaya">' + options(b.wilayas, o.wilaya, 'Choisir…') + '</select>') +
          communeField(o) +
          field('Adresse', input('address', o.address, ' dir="auto"'), 'full') +
          field('Produit', input('product', o.product, ' list="d-product-list" dir="auto"'), 'full') +
          field('Quantité', input('qty', o.qty, ' type="number" min="1" step="1"')) +
          field('Prix des produits (DA)', input('price', o.price || '', ' type="number" min="0" step="10" inputmode="numeric"')) +
          field('Livraison', '<select name="mode">' + options(b.modes, o.mode || b.modes[0]) + '</select>') +
          field('Société', '<select name="carrier">' + options(b.carriers, o.carrier, 'Par défaut (' + b.defaultCarrier + ')') + '</select>') +
          field('Frais de livraison (DA)', input('shipping', o.shipping === null || o.shipping === undefined ? '' : o.shipping, ' type="number" min="0" step="10" inputmode="numeric" placeholder="Calcul automatique"')) +
          field('Notes', '<textarea name="notes" dir="auto">' + h(o.notes) + '</textarea>', 'full') +
        '</div>' +
        '<datalist id="d-product-list">' + (b.products || []).map(function (p) { return '<option value="' + h(p.name) + '">'; }).join('') + '</datalist>' +
        '<p class="small" style="margin-top:6px">Prix et frais automatiques' + help('Prix et frais se recalculent seuls (quantité, produit, wilaya, livraison, société) ; si vous les tapez à la main, votre montant est gardé.') + '</p>' +
        '<div class="sum" id="d-sum"></div>' +
        '</div>' +
      '</div>' +
      // Boutons du résultat : fixés en bas de l'écran (ordinateur et téléphone), avec leur raccourci clavier.
      '<div class="card outcome-card"><h3>Résultat de l’appel</h3>' +
        '<div class="outcomes">' +
          '<button type="button" class="btn primary big" data-act="confirm">' + icon('check') + 'Confirmer<kbd>C</kbd></button>' +
          '<button type="button" class="btn big" data-act="no_answer">' + icon('noanswer') + 'Pas de réponse<kbd>P</kbd></button>' +
          '<button type="button" class="btn warn big" data-act="show-callback">' + icon('calendar') + 'Rappeler<span class="opt"> plus tard</span><kbd>R</kbd></button>' +
          '<button type="button" class="btn danger big" data-act="show-cancel">' + icon('x') + 'Annuler<kbd>A</kbd></button>' +
        '</div><div id="d-panel"></div>' +
      '</div>';
    updateSummary();
    prefetchNext();
  }

  /** Historique des appels de la commande (colonne « Historique appels »). */
  function callHistory(o) {
    if (!o.calls || !o.calls.length) return '';
    return '<details class="call-log"' + (o.calls.length <= 3 ? ' open' : '') + '><summary class="small strong">' + icon('clock') + 'Historique des appels · ' + o.calls.length + '</summary><ol>' +
      o.calls.map(function (c, i) { return '<li><span class="small mono">' + h(c.when) + '</span> Appel ' + (i + 1) + ' : ' + h(c.text) + '</li>'; }).join('') +
      (o.callback && (o.status === 'Pas de réponse' || o.status === 'Rappeler') ? '<li class="next"><span class="small mono">' + h(fmtDate(o.callback)) + '</span> ' +
        (new Date(o.callback).getTime() <= Date.now() ? 'Rappel prévu : c’est l’heure, appelez maintenant' : 'Prochain rappel') + '</li>' : '') +
      '</ol></details>';
  }

  /** La commande suivante de la file (après `id`), ou null. */
  function nextDueAfter(id) {
    var due = S.queue ? S.queue.due : [];
    for (var i = 0; i < due.length; i++) {
      if (due[i].id === id) return due[i + 1] || (i > 0 ? due[0] : null);
    }
    return due[0] && due[0].id !== id ? due[0] : null;
  }

  /** Prépare en arrière-plan la commande suivante : elle s'affichera tout de suite. */
  function prefetchNext() {
    var next = S.currentId ? nextDueAfter(S.currentId) : null;
    if (!next || (S.prefetch && S.prefetch.id === next.id)) return;
    var id = next.id;
    S.prefetch = { id: id, data: null };
    call('api_getOrder', id).then(function (d) {
      if (S.prefetch && S.prefetch.id === id) S.prefetch.data = d;
    }).catch(function () {
      if (S.prefetch && S.prefetch.id === id) S.prefetch = null;
    });
  }

  /** Prix catalogue d'un produit (liste « Produits » du démarrage), ou null. */
  function catalogPrice(name) {
    var key = String(name || '').trim().toLowerCase();
    var list = S.boot.products || [];
    for (var i = 0; i < list.length; i++) if (String(list[i].name).trim().toLowerCase() === key) return Number(list[i].price) || null;
    return null;
  }

  /**
   * Prix et frais de la fiche de Confirmation : recalculés tant que la confirmatrice ne les a pas
   * tapés elle-même (data-touched) ; tapés, ils sont gardés et envoyés tels quels.
   */
  function confirmAmounts() {
    var o = S.current.order;
    var form = $('#d-form');
    var f = readForm(form);
    var qty = Math.max(1, parseInt(f.qty, 10) || 1);
    var priceEl = form.querySelector('[name="price"]');
    var shipEl = form.querySelector('[name="shipping"]');
    var price;
    var productChanged = String(f.product || '').trim() !== String(o.product || '').trim();
    if (priceEl && priceEl.hasAttribute('data-touched') && priceEl.value !== '') price = Math.max(0, Number(priceEl.value) || 0);
    else {
      var unit = productChanged && catalogPrice(f.product) !== null ? catalogPrice(f.product) : (o.qty ? o.price / o.qty : o.price);
      price = !productChanged && qty === o.qty ? o.price : Math.round(unit * qty);
      if (priceEl) priceEl.value = price || '';
    }
    var carrier = f.carrier || S.boot.defaultCarrier;
    var fee = feeFor(f.wilaya, carrier, f.mode);
    var shipping;
    if (shipEl && shipEl.hasAttribute('data-touched') && shipEl.value !== '') shipping = Math.max(0, Number(shipEl.value) || 0);
    else {
      var changed = f.wilaya !== o.wilaya || f.mode !== o.mode || (f.carrier || '') !== (o.carrier || '');
      shipping = (changed || o.shipping === null) && fee !== null ? fee : (o.shipping || 0);
      if (shipEl) shipEl.value = shipping;
    }
    var total = (price !== o.price || shipping !== (o.shipping || 0)) ? price + shipping : o.total;
    return { f: f, qty: qty, price: price, shipping: shipping, fee: fee, carrier: carrier, total: total,
      priceFromCatalog: productChanged && catalogPrice(f.product) !== null,
      priceTouched: !!(priceEl && priceEl.hasAttribute('data-touched')), shipTouched: !!(shipEl && shipEl.hasAttribute('data-touched')) };
  }

  /** Recalcule prix, frais, total et message quand la confirmatrice modifie la commande. */
  function updateSummary() {
    if (!S.current || !$('#d-form')) return;
    var o = S.current.order;
    var a = confirmAmounts();
    var f = a.f;
    var brief = $('#d-brief');
    var cs = communeState(f.wilaya, f.commune, f.carrier);
    if (brief) {
      var unknown = (S.current.stock || []).filter(function (it) { return !it.matched; });
      brief.innerHTML =
        bLine('pin', 'blue', (cs && cs.c ? '<strong>' + h(cs.c.n) + ', ' + h(wilayaName(f.wilaya)) + '</strong>' + (cs.c.a ? ' <span class="b-ar">' + h(cs.c.a) + '</span>' : '')
          : (f.commune ? '<span dir="auto">' + h(f.commune) + '</span>, ' : '') + '<strong>' + h(wilayaName(f.wilaya) || 'Wilaya à choisir') + '</strong>')) +
        (cs && cs.c && o.communeRaw && o.communeRaw !== cs.c.n && f.commune === o.commune ? '<span class="b-sub cm-recog">' + icon('check') + 'Commune reconnue (le client a écrit « <span dir="auto">' + h(o.communeRaw) + '</span> »)</span>' : '') +
        (cs && !cs.c ? '<span class="b-sub">' + communeWarn(cs.w, f.commune, f.address) + '</span>' : '') +
        (f.address ? bLine('home', 'blue', '<span dir="auto">' + h(f.address) + '</span>') : '') +
        addrWarn(f) +

  /** Fiche résumée : une ligne avec son icône dans une pastille de couleur (ou la photo du produit). */
  function bLine(ic, color, body, photo) {

  }

  /* v1.15 : l'adresse cite une autre wilaya que celle choisie (« … oued ghir bejaia » pour Biskra). */
  var WILAYA_AR = { 1: 'أدرار', 2: 'الشلف', 3: 'الأغواط', 4: 'أم البواقي', 5: 'باتنة', 6: 'بجاية', 7: 'بسكرة', 8: 'بشار', 9: 'البليدة', 10: 'البويرة', 11: 'تمنراست',
    12: 'تبسة', 13: 'تلمسان', 14: 'تيارت', 15: 'تيزي وزو', 16: 'الجزائر', 17: 'الجلفة', 18: 'جيجل', 19: 'سطيف', 20: 'سعيدة', 21: 'سكيكدة', 22: 'سيدي بلعباس',
    23: 'عنابة', 24: 'قالمة', 25: 'قسنطينة', 26: 'المدية', 27: 'مستغانم', 28: 'المسيلة', 29: 'معسكر', 30: 'ورقلة', 31: 'وهران', 32: 'البيض', 33: 'إليزي',
    34: 'برج بوعريريج', 35: 'بومرداس', 36: 'الطارف', 37: 'تندوف', 38: 'تيسمسيلت', 39: 'الوادي', 40: 'خنشلة', 41: 'سوق أهراس', 42: 'تيبازة', 43: 'ميلة',
    44: 'عين الدفلى', 45: 'النعامة', 46: 'عين تموشنت', 47: 'غرداية', 48: 'غليزان', 49: 'تيميمون', 50: 'برج باجي مختار', 51: 'أولاد جلال', 52: 'بني عباس',
    53: 'عين صالح', 54: 'عين قزام', 55: 'تقرت', 56: 'جانت', 57: 'المغير', 58: 'المنيعة' };
  var WILAYA_ALIAS = { 6: ['bgayet', 'bougie', 'vgayet'], 16: ['algiers', 'dzayer'], 19: ['stif'], 31: ['wahran'], 25: ['qacentina'], 15: ['tizi'] };
  // Noms trop courants dans une adresse (« adrar » = montagne, prénoms) : pas d'alerte.
  var WILAYA_SKIP = { 1: true, 20: true, 45: true };
  /** Mots d'un texte, français ou arabe, sans accents ni ponctuation : « Béjaïa » = « bejaia », « بجاية » = « بجايه ». */
  function wordsOf(s) {
    return ' ' + String(s || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
      .replace(/[\u064B-\u065F\u0670\u0640]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
      .replace(/[^a-z\u0621-\u064A]+/g, ' ').trim() + ' ';
  }
  function addressWilaya(f) {
    var cur = wCode(f.wilaya);
    var text = wordsOf(f.address + ' ' + f.commune);
    if (!cur || text.length < 5) return null;
    var hits = [];
    (S.boot.wilayas || []).forEach(function (label) {
      var code = wCode(label);
      if (!code || WILAYA_SKIP[code]) return;
      var keys = [wilayaName(label)].concat(WILAYA_ALIAS[code] || []).concat(WILAYA_AR[code] ? [WILAYA_AR[code]] : []);
      if (keys.some(function (k) { var w = wordsOf(k); return w.length > 3 && text.indexOf(w) >= 0; })) hits.push({ code: code, label: label });
    });
    if (!hits.length || hits.some(function (x) { return x.code === cur; })) return null;
    var hit = hits[0];
    // Commune de cette wilaya écrite dans l'adresse : la plus précise (« Oued Ghir » plutôt que le chef-lieu « Béjaïa »).
    var found = [];
    if (CM()) {
      var addr = wordsOf(f.address);
      var wname = wordsOf(wilayaName(hit.label));
      CM().list(hit.code).forEach(function (c) {
        var w = wordsOf(c.n);
        var wa = c.a ? wordsOf(c.a) : '';
        if ((w.length > 5 && addr.indexOf(w) >= 0) || (wa.length > 4 && addr.indexOf(wa) >= 0)) found.push({ n: c.n, chief: w === wname, len: w.length });
      });
    }
    found.sort(function (x, y) { return (x.chief - y.chief) || (y.len - x.len); });
    return { label: hit.label, commune: found.length ? found[0].n : '' };
  }
  function addrWarn(f) {
    var x = addressWilaya(f);
    if (!x) return '';
    return '<span class="b-sub addr-warn">' + icon('alert') + '<span>Adresse : <strong>' + h(wilayaName(x.label)) + '</strong> ? (wilaya : ' + h(wilayaName(f.wilaya)) + ')</span>' +
      '<button type="button" class="btn" data-act="addr-wilaya" data-w="' + h(x.label) + '" data-c="' + h(x.commune) + '">Mettre ' + h(wilayaName(x.label)) + (x.commune ? ' · ' + h(x.commune) : '') + '</button></span>';
  }

  /** Confirmation : commune absente de la liste d'Ecotrack, à demander au client (avec les communes proches). */
  function communeWarn(w, commune, address) {
    var near = CM().suggest(w, commune, address).slice(0, 2);
    return '<span class="cm-warn"><b>' + icon('alert') + 'Commune à vérifier</b>' +

      '<span class="acts"><button type="button" class="btn primary" data-act="commune-pick-d">Choisir la commune</button>' +
      near.map(function (c) { return '<button type="button" class="btn" data-act="commune-set" data-name="' + h(c.n) + '">' + h(c.n) + ' ?</button>'; }).join('') + '</span></span>';
  }

  /** Ce que la fiche envoie : prix et frais seulement s'ils ont été tapés (sinon le serveur les recalcule). */
  function confirmFields() {
    var a = confirmAmounts();
    var f = a.f;
    if (a.priceTouched || a.priceFromCatalog) f.price = a.price; else delete f.price; // nouveau produit : prix du catalogue
    if (!a.shipTouched) delete f.shipping;
    return f;
  }

  function fillTemplate(tpl, x) {
    var first = String(x.client || '').trim().split(/\s+/)[0] || '';
    var map = {
      prenom: first,
      client: x.client || '',
      numero: x.id,
      produit: (x.product || '') + (x.qty > 1 ? ' ×' + x.qty : ''),
      total: money(x.total),
      commune: x.commune || '',
      wilaya: wilayaName(x.wilaya),
      boutique: S.boot.shop
    };
    return String(tpl || '').replace(/\{(\w+)\}/g, function (m, k) { return map[k] !== undefined ? map[k] : m; });
  }

  function showPanel(kind) {

  /**
   * Résultat d'un appel : la commande quitte la file tout de suite, la suivante s'affiche ; l'envoi au
   * serveur part 5 secondes plus tard. D'ici là, « Annuler » (bandeau en bas) remet tout comme avant.
   * Une deuxième action, ou quitter l'application, envoie aussitôt l'action en attente.
   */
  var UNDO_MS = 5000;

  function submit(outcome, extra) {
    if (S.busy || !S.currentId || !S.current || Date.now() < S.cooldown) return;
    flushPending();
    var id = S.currentId;
    var payload = { fields: confirmFields() };
    Object.keys(extra || {}).forEach(function (k) { payload[k] = extra[k]; });
    var blacklist = outcome === 'cancel' && $('#cancel-black') && $('#cancel-black').checked;
    var job = { id: id, outcome: outcome, payload: payload, phone: S.current.order.phone, blacklist: blacklist, detail: S.current, where: null, sent: false,
      confirmed: outcome === 'confirm', leaves: outcome === 'confirm' || outcome === 'cancel' };
    ['due', 'later', 'waiting'].forEach(function (b) {
      var list = (S.queue && S.queue[b]) || [];
      for (var i = 0; i < list.length; i++) if (list[i].id === id) job.where = { block: b, index: i, item: list[i] };
    });
    var next = nextDueAfter(id);
    var ready = next && S.prefetch && S.prefetch.id === next.id && S.prefetch.data ? S.prefetch.data : null;

    // 1. La commande traitée quitte la file, la suivante s'affiche tout de suite.
    S.pending[id] = true;
    setQueue(S.queue);
    if (job.confirmed) S.queue.stats.confirmedToday++;
    if (job.leaves) S.pendingTotal = Math.max((S.pendingTotal || 0) - 1, 0);
    setQueueCount(S.queue.due.length);
    S.cooldown = Date.now() + 800;
    renderQueue();
    if (ready) {
      S.currentId = next.id; S.current = ready; S.prefetch = null;
      markCurrent(); renderDetail();
    } else if (next) {
      S.current = null;
      openInDetail(next.id);
    } else {
      renderEmptyDetail();
    }

    // 2. Envoi dans 5 secondes (annulable).
    job.timer = setTimeout(function () { sendCall(job); }, UNDO_MS);
    S.lastCall = job;
    showUndo(job);
  }

  /** Envoie l'action au serveur (un seul aller-retour : résultat, file, compteurs). */
  function sendCall(job) {
    if (job.sent) return;
    job.sent = true;
    clearTimeout(job.timer);
    if (S.lastCall === job) { S.lastCall = null; hideUndo(); }
    var id = job.id;
    var outcome = job.outcome;
    call('api_recordCall', id, outcome, job.payload, { queue: true }).then(function (o) {
      delete S.pending[id];
      var msgs = {
        confirm: 'Commande ' + o.id + ' confirmée',
        no_answer: o.status === 'Annulée' ? 'Commande ' + o.id + ' annulée automatiquement : aucune réponse en ' + S.boot.callDays + ' jours'
          : o.status === 'Injoignable' ? 'Commande ' + o.id + ' : client injoignable'
          : 'Pas de réponse (' + o.callsToday + '/' + S.boot.callsPerDay + ' aujourd’hui), rappel ' + fmtDate(o.callback),
        callback: 'Rappel programmé ' + fmtDate(o.callback),
        cancel: 'Commande ' + o.id + ' annulée'
      };
      toast(msgs[outcome]);
      if (job.blacklist) call('api_setBlacklist', job.phone, true).catch(function (e) { toast(errText(e), true); });
      applyCounts(o.counts);
      if (S.route !== 'confirmation') return;
      if (o.queue) { setQueue(o.queue); setQueueCount(S.queue.due.length); renderQueue(); }
    }).catch(function (e) {
      delete S.pending[id];
      toast('Commande ' + id + ' non enregistrée : ' + errText(e), true);
      if (S.route !== 'confirmation') return;
      loadQueue(!S.currentId);
    });
  }

  /** Une action encore en attente part tout de suite (nouvelle action, application quittée). */
  function flushPending() {
    if (S.lastCall && !S.lastCall.sent) sendCall(S.lastCall);
  }

  /** « Annuler » : rien n'est envoyé, la commande revient à sa place et sa fiche se rouvre. */
  function undoLast() {
    var job = S.lastCall;
    if (!job || job.sent) return;
    job.sent = true;
    clearTimeout(job.timer);
    S.lastCall = null;
    hideUndo();
    delete S.pending[job.id];
    if (S.queue) {
      if (job.where && !S.queue[job.where.block].some(function (x) { return x.id === job.id; })) {
        S.queue[job.where.block].splice(Math.min(job.where.index, S.queue[job.where.block].length), 0, job.where.item);
      }
      if (job.confirmed) S.queue.stats.confirmedToday = Math.max((S.queue.stats.confirmedToday || 0) - 1, 0);
      if (job.leaves) S.pendingTotal = (S.pendingTotal || 0) + 1;
      setQueue(S.queue);
      setQueueCount(S.queue.due.length);
    }
    toast('Annulé : la commande ' + job.id + ' n’a pas été modifiée.');
    if (S.route !== 'confirmation') return;
    renderQueue();
    ++S.detailToken;
    S.currentId = job.id;
    S.current = job.detail;
    markCurrent();
    renderDetail();
  }

  function showUndo(job) {
    var labels = { confirm: 'confirmée', no_answer: 'pas de réponse', callback: 'rappel programmé', cancel: 'annulée' };
    var bar = $('#undo-bar');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'undo-bar';
      bar.setAttribute('role', 'status');
      document.body.appendChild(bar);
    }
    bar.innerHTML = icon('check') + '<span class="grow">Commande <b>' + h(job.id) + '</b> : ' + labels[job.outcome] + '</span>' +
      '<button type="button" data-act="undo-call">Annuler</button><span class="undo-time" style="animation-duration:' + UNDO_MS + 'ms"></span>';
    bar.className = '';
    void bar.offsetWidth; // relance l'animation du temps restant
    bar.className = 'show';
  }
  function hideUndo() {
    var bar = $('#undo-bar');
    if (bar) bar.className = '';
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flushPending(); });
  window.addEventListener('pagehide', flushPending);

  function loadShipping() {
    var t = ++S.token;
    syncStart();

      syncEnd();
      if (t !== S.token || S.route !== 'expeditions') return;
      perfDone('expeditions');
      S.ship.data = d;
      var ready = {};
      d.toShip.forEach(function (o) { if (!o.problems.length) ready[o.id] = true; });
      Object.keys(S.ship.selected).forEach(function (id) { if (!ready[id]) delete S.ship.selected[id]; });
      var created = {};
      d.created.forEach(function (o) { created[o.id] = true; });
      Object.keys(S.ship.created.sel).forEach(function (id) { if (!created[id]) delete S.ship.created.sel[id]; });
      renderShipping();
      maybeRefreshCreated(d);
    }).catch(function (e) {
      syncEnd();
      if (t === S.token && S.route === 'expeditions' && !S.ship.data) $('#ship').innerHTML = errorBox(e);

  function pickedCreated() {
    var d = S.ship.data;
    if (!d) return [];
    return d.created.filter(function (o) { return S.ship.created.sel[o.id]; }).map(function (o) { return o.id; });
  }

  /** « Imprimé le … par … », « Pas imprimé » ou « À réimprimer ». */
  function labelBadge(l) {
    l = l || {};
    if (l.reprint) return '<span class="pill" style="background:#FFF3DC;color:#8A5200">À réimprimer</span><div class="small">colis recréé : nouveau n° de suivi</div>';
    if (l.printed) return '<span class="pill" style="background:#DDF0E4;color:#146C2E">' + icon('printer') + 'Imprimé</span><div class="small">le ' + h(l.at) + (l.by ? ' · ' + h(l.by) : '') + '</div>';
    return '<span class="pill" style="background:#EEF0F3;color:#3D4350">Pas imprimé</span>';

  /* ---------------- Bordereaux : téléchargement, mise en page, impression ---------------- */

  var LABEL_FORMAT_KEY = 'dz-smart-shop:format-bordereau';
  /** Format de cet appareil (retenu), sinon celui des Paramètres. */
  function labelFormat() {
    var v = '';
    try { v = window.localStorage.getItem(LABEL_FORMAT_KEY) || ''; } catch (e) { v = ''; }
    if (v === 'A4' || v === '10x15') return v;
    return (S.ship.data && S.ship.data.labelFormat) || 'A4';
  }
  function setLabelFormat(v) {
    try { window.localStorage.setItem(LABEL_FORMAT_KEY, v); } catch (e) { /* navigation privée : choix non retenu */ }
  }

  // Outil PDF (pdf-lib), chargé seulement au moment d'imprimer. L'empreinte vérifie que le fichier n'a pas été modifié.
  var PDFLIB_URLS = [
    'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js',
    'https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js'
  ];
  var PDFLIB_SRI = 'sha384-weMABwrltA6jWR8DDe9Jp5blk+tZQh7ugpCsF3JwSA53WZM9/14PjS5LAJNHNjAI';
  var pdfLibLoading = null;
  function loadPdfLib() {
    if (window.PDFLib) return Promise.resolve(window.PDFLib);
    if (pdfLibLoading) return pdfLibLoading;
    var attempt = function (i) {
      return new Promise(function (resolve, reject) {
        var tag = document.createElement('script');
        tag.src = PDFLIB_URLS[i];
        tag.integrity = PDFLIB_SRI;
        tag.crossOrigin = 'anonymous';
        tag.onload = function () { if (window.PDFLib) resolve(window.PDFLib); else reject(new Error('pdf-lib')); };
        tag.onerror = function () { tag.parentNode.removeChild(tag); reject(new Error('pdf-lib')); };
        document.head.appendChild(tag);
      }).catch(function () {
        if (i + 1 < PDFLIB_URLS.length) return attempt(i + 1);
        throw new Error('Impossible de charger l’outil de mise en page des PDF. Vérifiez la connexion internet, puis réessayez.');
      });
    };
    pdfLibLoading = attempt(0).catch(function (e) { pdfLibLoading = null; throw e; });
    return pdfLibLoading;
  }

  function base64Bytes(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  var MM = 72 / 25.4; // points par millimètre
  /** Pose une page de bordereau dans une case, sans la déformer, centrée. */
  function placeLabel(page, emb, x, y, w, hgt, margin) {
    var scale = Math.min((w - 2 * margin) / emb.width, (hgt - 2 * margin) / emb.height);
    var dw = emb.width * scale;
    var dh = emb.height * scale;
    page.drawPage(emb, { x: x + (w - dw) / 2, y: y + (hgt - dh) / 2, width: dw, height: dh });
  }
  function layoutLabels(L, out, pages, format) {
    if (format === '10x15') {
      pages.forEach(function (emb) { placeLabel(out.addPage([100 * MM, 150 * MM]), emb, 0, 0, 100 * MM, 150 * MM, 0); });
      return;
    }
    var W = 210 * MM;
    var H = 297 * MM;
    var grey = L.rgb(0.6, 0.6, 0.6);
    for (var i = 0; i < pages.length; i += 4) {
      var page = out.addPage([W, H]);
      for (var k = 0; k < 4 && i + k < pages.length; k++) {
        placeLabel(page, pages[i + k], (k % 2) * W / 2, H - (Math.floor(k / 2) + 1) * H / 2, W / 2, H / 2, 5 * MM);
      }
      // Traits de coupe
      page.drawLine({ start: { x: W / 2, y: 0 }, end: { x: W / 2, y: H }, thickness: 0.5, color: grey, dashArray: [4, 4] });
      page.drawLine({ start: { x: 0, y: H / 2 }, end: { x: W, y: H / 2 }, thickness: 0.5, color: grey, dashArray: [4, 4] });
    }
  }

  /** Un seul PDF avec tous les bordereaux : { bytes, pages, done, bad }. */
  function buildLabelsPdf(L, files, format) {
    return L.PDFDocument.create().then(function (out) {
      var pages = [];
      var done = [];
      var bad = [];
      var step = files.reduce(function (p, f) {
        return p.then(function () {
          return L.PDFDocument.load(base64Bytes(f.pdf), { ignoreEncryption: true })
            .then(function (src) { return out.embedPdf(src, src.getPageIndices()); })
            .then(function (embedded) { embedded.forEach(function (e) { pages.push(e); }); done.push(f); })
            .catch(function () { f.message = 'PDF d’Ecotrack illisible.'; bad.push(f); });
        });
      }, Promise.resolve());
      return step.then(function () {
        if (!pages.length) return { bytes: null, pages: 0, done: done, bad: bad };
        layoutLabels(L, out, pages, format);
        return out.save().then(function (bytes) { return { bytes: bytes, pages: out.getPageCount(), done: done, bad: bad }; });
      });
    });
  }

  function failedList(failed) {
    if (!failed.length) return '';
    return '<div class="lock-box warn"><p>' + plural(failed.length, 'bordereau non reçu', 'bordereaux non reçus') + ' :</p></div>' +
      failed.map(function (r) {
        return '<div class="result-row"><span class="pill" style="background:#FBE7E7;color:#A12626">Erreur</span>' +
          '<span class="grow"><strong>' + h(r.id) + '</strong>' + (r.client ? ' · ' + h(r.client) : '') +
          '<br><span class="small" style="color:#A12626">' + h(r.message || 'Erreur inconnue') + '</span></span></div>';
      }).join('');
  }

  function printProgress(done, total) {
    var p = total ? Math.round(done / total * 100) : 0;
    showModal(modalHead('Bordereaux') + '<p>Préparation des bordereaux… ' + done + ' / ' + total + '</p>' +
      '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + done + '"><span style="width:' + p + '%"></span></div>');
  }

  /** Télécharge les bordereaux chez Ecotrack (par petits paquets), puis les réunit en un seul PDF. */
  function printLabels(ids) {
    if (S.ship.printing || !ids.length) return;
    var format = labelFormat();
    var per = (S.ship.data && S.ship.data.labelsPerCall) || 6;
    var files = [];
    var failed = [];
    S.ship.printing = true;
    if (S.route === 'expeditions') renderShipping();
    printProgress(0, ids.length);
    var lib = loadPdfLib();
    lib.catch(function () { /* l'erreur est affichée plus bas */ });
    var chunks = [];
    for (var i = 0; i < ids.length; i += per) chunks.push(ids.slice(i, i + per));
    chunks.reduce(function (p, chunk) {
      return p.then(function () {
        return call('api_labelFiles', chunk).then(function (res) {
          res.forEach(function (r) { (r.ok ? files : failed).push(r); });
          printProgress(files.length + failed.length, ids.length);
        });
      });
    }, Promise.resolve()).then(function () {
      if (!files.length) return { bytes: null, pages: 0, done: [], bad: [] };
      return lib.then(function (L) { return buildLabelsPdf(L, files, format); });
    }).then(function (res) {
      S.ship.printing = false;
      if (S.route === 'expeditions') renderShipping();
      failed = failed.concat(res.bad);
      if (!res.bytes) {
        showModal(modalHead('Bordereaux') + '<p>Aucun bordereau n’a pu être préparé.</p>' + failedList(failed) +
          '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Fermer</button></div>');
        return;
      }
      showLabelsReady(res, failed, format);
    }).catch(function (e) {
      S.ship.printing = false;
      if (S.route === 'expeditions') renderShipping();
      showModal(modalHead('Bordereaux') + errorBox(e) + failedList(failed) +
        '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Fermer</button></div>');
    });
  }

  function showLabelsReady(res, failed, format) {
    if (S.ship.pdf && S.ship.pdf.url) URL.revokeObjectURL(S.ship.pdf.url);
    var url = URL.createObjectURL(new Blob([res.bytes], { type: 'application/pdf' }));
    S.ship.pdf = { url: url, marked: false, items: res.done.map(function (f) { return { id: f.id, tracking: f.tracking }; }) };
    var now = new Date();
    var name = 'bordereaux-' + now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2) +
      '-' + ('0' + now.getHours()).slice(-2) + 'h' + ('0' + now.getMinutes()).slice(-2) + '.pdf';
    var tip = format === '10x15'
      ? 'Puis, dans la fenêtre d’impression : papier <strong>100 × 150 mm</strong>, échelle <strong>taille réelle (100 %)</strong>, <strong>aucune marge</strong>.'
      : 'Puis, dans la fenêtre d’impression : papier <strong>A4</strong>, échelle <strong>taille réelle (100 %)</strong>. Découpez ensuite le long des pointillés.';
    showModal(modalHead('Bordereaux prêts') +
      '<p><strong>' + plural(res.done.length, 'bordereau', 'bordereaux') + '</strong> · ' + plural(res.pages, 'page', 'pages') + ' ' +
      (format === '10x15' ? 'étiquette 10×15' : 'A4 (4 par feuille)') + '</p>' +
      '<p class="small" style="margin:8px 0 12px">Le PDF s’ouvre dans un nouvel onglet : cliquez sur l’imprimante (ou Ctrl+P). ' + tip +
      ' Sur téléphone, ouvrez le fichier puis « Imprimer » ou « Partager » vers l’application de l’imprimante.</p>' +
      failedList(failed) +
      '<div class="modal-actions">' +
      '<a class="btn" href="' + h(url) + '" download="' + h(name) + '" data-label-download>Télécharger</a>' +
      '<button type="button" class="btn primary" data-act="labels-open">' + icon('printer') + 'Ouvrir et imprimer</button></div>');
  }

  /** Note « imprimé » (une fois par PDF) dès que vous l'ouvrez, l'imprimez ou le téléchargez. */
  function markLabelsPrinted() {
    var pdf = S.ship.pdf;
    if (!pdf || pdf.marked || !pdf.items.length) return;
    pdf.marked = true;
    call('api_markLabelsPrinted', pdf.items).then(function (r) {
      var d = S.ship.data;
      if (d) d.created.forEach(function (o) { if (r.labels[o.id]) o.label = r.labels[o.id]; });
      if (S.route === 'expeditions') renderShipping();
    }).catch(function (e) { pdf.marked = false; toast(errText(e), true); });
  }

  /**
   * Ouvre le PDF dans un nouvel onglet, où le lecteur PDF du navigateur l'imprime.
   * (L'application tourne dans un cadre protégé de Google : un PDF ne s'y affiche pas.)
   */
  function openLabelsPdf() {
    if (!S.ship.pdf) return;
    markLabelsPrinted();
    var win = window.open(S.ship.pdf.url, '_blank');
    if (!win) toast('Le navigateur a bloqué le nouvel onglet : autorisez les fenêtres pop-up, ou utilisez « Télécharger ».', true);
  }

  /* ---------------- Validation de l'expédition ---------------- */

  function askValidate() {
    var d = S.ship.data;
    var ids = pickedCreated();
    if (!d || !ids.length || S.ship.vbusy) return;
    var notPrinted = d.created.filter(function (o) { return S.ship.created.sel[o.id] && !o.label.printed; }).length;
    showModal(modalHead('Valider l’expédition ?') +
      '<p>' + plural(ids.length, 'colis va être validé', 'colis vont être validés') + ' chez Ecotrack. Ensuite, <strong>plus de modification ni d’annulation possible</strong> : ' +
      'en cas de problème, il faudra faire une demande de retour.</p>' +
      (notPrinted ? '<div class="lock-box warn"><p>' + icon('alert') + '' + plural(notPrinted, 'colis n’a pas', 'colis n’ont pas') + ' de bordereau imprimé dans l’outil.</p></div>' : '') +
      '<label class="check-line" style="margin:14px 0"><input type="checkbox" class="check" id="v-pickup"' + (d.pickup ? ' checked' : '') + '> ' +
      'Demander le ramassage' + help('Décoché : vous déposez les colis à l’agence.') + '</label>' +
      '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Annuler</button>' +
      '<button type="button" class="btn primary" data-act="validate-go">' + (notPrinted ? 'Valider quand même' : 'Valider ' + plural(ids.length, 'colis', 'colis')) + '</button></div>');
  }

  function doValidate() {
    var ids = pickedCreated();
    var box = $('#v-pickup');
    var pickup = box ? box.checked : !!(S.ship.data && S.ship.data.pickup);
    closeModal();
    if (!ids.length || S.ship.vbusy) return;
    S.ship.vbusy = true;
    renderShipping();
    toast('Validation chez Ecotrack en cours…');
    call('api_validateParcels', ids, pickup).then(function (res) {
      S.ship.vbusy = false;
      S.ship.vresults = res.results;
      S.ship.created.sel = {};
      applyCounts(res.counts);
      var ok = res.results.filter(function (r) { return r.ok; }).length;
      var ko = res.results.length - ok;
      toast(plural(ok, 'colis validé', 'colis validés') + (ko ? ', ' + plural(ko, 'refusé', 'refusés') : '') + (ok ? '. Ils passent dans Suivi.' : ''), ok === 0);
      loadShipping();
    }).catch(function (e) {
      S.ship.vbusy = false;
      toast(errText(e), true);
      renderShipping();
    });
  }

  /** Colis validés sur le site d'Ecotrack : relus à l'ouverture de la page (au plus une fois par minute). */
  function maybeRefreshCreated(d) {
    if (!d.configured || !d.created.length || Date.now() - S.ship.refreshedAt < 60000) return;
    S.ship.refreshedAt = Date.now();
    call('api_refreshCreated').then(function (r) {
      if (!r.updated && !r.missing) return;
      if (r.message) toast(r.message);
      if (S.route === 'expeditions') loadShipping();
      refreshCount();
    }).catch(function () { /* silencieux : la mise à jour automatique repassera */ });
  }

  /** « 5 h », « 2 j » à partir d'un nombre d'heures. */
  function hoursText(hours) {
    var n = Math.max(Number(hours) || 0, 0);
    if (n < 1) return 'moins d’1 h';
    return n < 48 ? n + ' h' : Math.floor(n / 24) + ' j';
  }

  function confirmModal(title, text, okAct, okLabel) {
    showModal(modalHead(h(title)) + '<p>' + h(text) + '</p>' +
      '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Annuler</button>' +
      '<button type="button" class="btn primary" data-act="' + okAct + '">' + h(okLabel) + '</button></div>');
  }

  function askShip() {
    var n = Object.keys(S.ship.selected).length;
    if (!n || S.ship.busy) return;
    confirmModal('Créer les colis chez Ecotrack ?', plural(n, 'colis va être créé', 'colis vont être créés') +
      ' chez Ecotrack, avec le total affiché comme montant à encaisser. Ils ne seront pas encore expédiés : vous imprimez ensuite les bordereaux et validez l’expédition (onglet « Créés, à valider »).',
      'ship-confirm', 'Créer les colis');
  }

  function doShip() {
    var ids = Object.keys(S.ship.selected);
    closeModal();
    if (!ids.length || S.ship.busy) return;
    S.ship.busy = true;
    renderShipping();
    toast('Envoi à Ecotrack en cours…');
    call('api_shipEcotrack', ids).then(function (res) {
      S.ship.busy = false;
      S.ship.selected = {};
      S.ship.results = res;
      S.ship.created.sel = {};
      res.forEach(function (r) { if (r.ok) S.ship.created.sel[r.id] = true; });
      var ok = res.filter(function (r) { return r.ok; }).length;
      toast(plural(ok, 'colis créé', 'colis créés') + (res.length - ok ? ', ' + (res.length - ok) + ' refusé(s)' : '') + (ok ? '. Imprimez les bordereaux, puis validez.' : ''), ok === 0);
      loadShipping();
      refreshCount();
    }).catch(function (e) {
      S.ship.busy = false;
      toast(errText(e), true);
      renderShipping();
    });
  }

  function ecoAction(fn, busyText) {
    toast(busyText);
    call(fn).then(function (r) {
      toast(r.message);
      if (fn === 'api_ecotrackSyncStatuses') loadShipping();
    }).catch(function (e) { toast(errText(e), true); });
  }

  /* ================================================================ */
  /* Suivi des colis                                                  */
  /* ================================================================ */

  var LEVELS = {
    urgent: { label: 'Urgent', bg: '#FBE7E7', fg: '#A12626' },
    warn: { label: 'À surveiller', bg: '#FFF3DC', fg: '#8A5200' },
    info: { label: 'Info', bg: '#E6EEFB', fg: '#1E4FA8' }
  };
  var GROUPS = [
    ['all', 'Tous'], ['transit', 'En route'], ['delivery', 'En livraison'],
    ['suspended', 'Suspendus'], ['returning', 'Retours']
  ];

  /** Onglet « Terminées » de Suivi : livrées (avec l'état de l'argent) et retours reçus. */
  function finishedSection(d) {
    var f = S.track.done;
    var tests = {
      all: function () { return true; },
      delivered: function (x) { return x.status === 'Livrée'; },
      unpaid: function (x) { return x.unpaid; },
      returned: function (x) { return x.status === 'Retour'; }
    };
    var chips = [['all', 'Toutes'], ['delivered', 'Livrées'], ['unpaid', 'Argent pas encore reçu'], ['returned', 'Retours reçus']];
    var shown = d.finished.filter(tests[f] || tests.all);
    var periods = [[7, '7 jours'], [30, '30 jours'], [90, '90 jours']];
    var html = '<section class="card"><div class="detail-head"><h2>Commandes terminées</h2>' +
      '<div class="seg" role="group" aria-label="Période">' + periods.map(function (p) {
        return '<button type="button" data-act="track-days" data-days="' + p[0] + '" aria-pressed="' + (d.days === p[0]) + '">' + p[1] + '</button>';
      }).join('') + '</div></div><div class="chips" role="group" aria-label="Filtrer" style="margin:12px 0">' +
      chips.map(function (c) {
        return '<button type="button" class="chip" data-act="track-done-filter" data-done="' + c[0] + '" aria-pressed="' + (f === c[0]) + '">' + c[1] + ' · ' + d.finished.filter(tests[c[0]]).length + '</button>';
      }).join('') + '</div>';
    if (!shown.length) return html + '<p class="empty" style="padding:18px 0">Aucune commande dans cette catégorie sur la période.</p></section>';
    html += '<div class="table-wrap" style="border:0"><table class="data cards"><thead><tr>' +
      ['Commande', 'Wilaya', 'Résultat', 'Argent / colis', 'Le', 'Total'].map(function (t) { return '<th scope="col">' + t + '</th>'; }).join('') + '</tr></thead><tbody>' +
      shown.map(function (x) {
        return '<tr><td data-label="Commande" class="multi"><button type="button" class="link-btn" data-act="open-order" data-id="' + h(x.id) + '">' + h(x.id) + '</button><div class="small">' + h(x.client) + '</div></td>' +
          '<td data-label="Wilaya">' + h(wilayaName(x.wilaya)) + '</td>' +
          '<td data-label="Résultat">' + pill(x.status) + '</td>' +
          '<td data-label="Argent / colis">' + h(x.label) + (x.unpaid ? ' <span class="pill" style="background:#FFF3DC;color:#8A5200">à recevoir</span>' : '') +
            (x.damaged ? ' <span class="pill" style="background:#FBE7E7;color:#A12626">abîmé, retiré du stock</span>' : '') +
            (x.canDamage && S.boot.user.stock ? ' <button type="button" class="btn" style="min-height:32px;padding:0 10px" data-act="return-damaged" data-id="' + h(x.id) + '">Abîmé ?</button>' : '') +
            (x.paymentId ? '<div class="small">Versement ' + h(x.paymentId) + '</div>' : '') + '</td>' +
          '<td data-label="Le">' + h(fmtDate(x.since)) + '</td>' +
          '<td data-label="Total" class="num strong">' + money(x.total) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    if (d.finishedTotal > d.finished.length) html += '<p class="small" style="margin-top:10px">Les ' + d.finished.length + ' plus récentes sur ' + d.finishedTotal + '.</p>';
    return html + '</section>';
  }

  function everyText(min) {
    min = Number(min) || 60;
    return min === 60 ? 'toutes les heures' : min === 120 ? 'toutes les 2 heures' : 'toutes les ' + min + ' minutes';
  }

  function waLink(phone) {
    var p = String(phone || '').replace(/\D/g, '');
    return /^0[567]\d{8}$/.test(p) ? 'https://wa.me/213' + p.slice(1) : '';
  }

  function pageTracking() {
    view.innerHTML = '<div id="track"><p class="loading">Chargement…</p></div>';
    if (S.track.data && S.track.data.days === S.track.days) renderTracking();
    loadTracking();
  }

  function loadTracking() {
    var t = ++S.token;
    syncStart();
    return call('api_trackingOverview', S.track.days).then(function (d) {
      syncEnd();
      if (t !== S.token || S.route !== 'suivi') return;
      perfDone('suivi');
      S.track.data = d;
      setAlertCount(d.alerts.filter(function (a) { return a.level !== 'info'; }).length);
      renderTracking();
    }).catch(function (e) {
      syncEnd();
      if (t === S.token && S.route === 'suivi' && !S.track.data) $('#track').innerHTML = errorBox(e);
    });
  }

  function renderTracking() {
    var d = S.track.data;
    var box = $('#track');
    if (!d || !box) return;
    var html = '<div class="page-head"><div><h1>Suivi des colis' + help('Statuts relus chez Ecotrack automatiquement ' + h(everyText(d.every)) + '. L’argent (chez le livreur, à recevoir, versements d’Ecotrack) est dans Statistiques › Argent.') + '</h1><p class="sub">' +
      (d.lastSync ? stat(true, 'Ecotrack · lu ' + h(ago(d.lastSync))) : stat(false, 'Statuts pas encore lus')) + '</p></div>' +
      '<button type="button" class="btn primary" data-act="track-sync">' + icon('refresh') + 'Actualiser les statuts</button></div>';
    html += '<div class="stack">';
    if (!d.configured) {
      html += '<div class="card"><h2>Ecotrack n’est pas encore configuré</h2><p class="sub">Enregistrez l’adresse et le jeton dans le classeur (menu DZ Smart Shop › Ecotrack), puis créez vos premiers colis dans la page Expéditions.</p></div>';
    }
    if (d.lastError) html += errorBox(d.lastError);

    // Alertes
    html += '<section class="card"><h2>À traiter · ' + d.alerts.length + '</h2>';
    if (!d.alerts.length) {
      html += '<p class="empty" style="padding:18px 0">Rien à traiter : vos colis avancent normalement.</p>';
    } else {
      html += d.alerts.map(function (a) {
        var lv = LEVELS[a.level] || LEVELS.info;
        var wa = waLink(a.phone);
        return '<div class="result-row track-alert lv-' + h(a.level) + '"><span class="pill" style="min-width:96px;text-align:center;background:' + lv.bg + ';color:' + lv.fg + '">' + lv.label + '</span>' +
          '<span class="grow"><strong>' + h(a.title) + '</strong> · <button type="button" class="link-btn" data-act="open-order" data-id="' + h(a.id) + '">' + h(a.id) + '</button> · <span dir="auto">' + h(a.client) + '</span> · ' + h(wilayaName(a.wilaya)) +
          (a.tagLabel ? ' ' + tagPill(a.tag, a.tagLabel) : '') +
          '<br><span class="act-short">→ ' + h(shortAction(a)) + '</span>' + help(h(a.detail)) +
          (a.courierNote ? '<br><span class="small courier-note">' + icon('courier') + 'Livreur : ' + h(a.courierNote) + '</span>' : '') +
          (a.calls && !a.proposeReturn ? '<br><span class="small strong">' + plural(a.calls, 'appel sans réponse', 'appels sans réponse') + '</span>' : '') +
          '<br><span class="small mono">' + h(a.tracking) + ' · ' + h(a.carrierLabel || 'statut pas encore lu') + ' · depuis ' + h(ago(a.since).replace(/^il y a /, '')) + '</span>' +
          (a.proposeReturn ? '<span class="lock-box warn" style="margin-top:8px"><p>' + plural(a.calls, 'appel', 'appels') + ' sans réponse : demander le retour du colis ?</p>' +
            '<button type="button" class="btn danger" style="min-height:40px" data-act="follow-return" data-id="' + h(a.id) + '">Demander le retour</button>' +
            '<button type="button" class="btn" style="min-height:40px" data-act="follow-quick" data-result="informed" data-id="' + h(a.id) + '">Laisser le livreur réessayer</button></span>' : '') +
          '</span>' +
          '<span class="quick track-actions">' +
            (/^0\d{8,9}$/.test(String(a.phone).replace(/\D/g, '')) ? '<a class="btn icon-only" href="tel:' + h(a.phone) + '" target="_top" title="Appeler" aria-label="Appeler">' + icon('confirmation') + '</a>' : '') +
            (a.callable
              ? '<button type="button" class="btn primary" style="min-height:40px" data-act="follow-open" data-id="' + h(a.id) + '">Résultat de l’appel</button>'
              : '<button type="button" class="btn" style="min-height:40px" data-act="track-done" data-id="' + h(a.id) + '">Marquer comme traité</button>') +
            '<details class="more-menu"><summary class="btn icon-only" title="Plus d’actions" aria-label="Plus d’actions">⋯</summary><div class="menu">' +
              (wa ? '<a href="' + h(wa) + '" target="_blank" rel="noopener">' + icon('whatsapp') + 'WhatsApp</a>' : '') +
              '<button type="button" data-act="track-history" data-id="' + h(a.id) + '">' + icon('clock') + 'Chronologie</button>' +
              (a.callable ? '<button type="button" data-act="track-done" data-id="' + h(a.id) + '">' + icon('check') + 'Marquer comme traité</button>' : '') +
            '</div></details>' +
          '</span></div>';
      }).join('');
    }
    html += '</section>';

    // Colis : en cours, ou terminés (livrés, retours reçus)
    var view = S.track.view;
    html += '<div class="seg" role="group" aria-label="Colis" style="align-self:flex-start">' +
      '<button type="button" data-act="track-view" data-view="active" aria-pressed="' + (view === 'active') + '">En cours · ' + d.parcels.length + '</button>' +
      '<button type="button" data-act="track-view" data-view="done" aria-pressed="' + (view === 'done') + '">Terminées (' + d.days + ' j) · ' + d.finishedTotal + '</button></div>';
    if (view === 'done') html += finishedSection(d);
    else html += activeSection(d);
    html += '</div>';
    box.innerHTML = html;
  }

  /** Colis en cours (en route, en livraison, suspendus, retours en cours). */
  function activeSection(d) {
    var html = '';
    var f = S.track.filter;
    var shown = d.parcels.filter(function (p) { return f === 'all' || p.group === f; });
    html += '<section class="card"><h2>Colis en cours · ' + d.parcels.length + '</h2><div class="chips" role="group" aria-label="Filtrer les colis" style="margin-bottom:12px">' +
      GROUPS.map(function (g) {
        var n = g[0] === 'all' ? d.parcels.length : d.parcels.filter(function (p) { return p.group === g[0]; }).length;
        return '<button type="button" class="chip" data-act="track-filter" data-group="' + g[0] + '" aria-pressed="' + (f === g[0]) + '">' + g[1] + ' · ' + n + '</button>';
      }).join('') + '</div>';
    if (!shown.length) {
      html += '<p class="empty" style="padding:18px 0">Aucun colis dans cette catégorie.</p>';
    } else {
      html += '<div class="table-wrap" style="border:0"><table class="data cards"><thead><tr>' +
        ['Commande', 'Wilaya', 'N° de suivi', 'Statut Ecotrack', 'Depuis', 'Total', ''].map(function (t) { return '<th scope="col">' + t + '</th>'; }).join('') + '</tr></thead><tbody>' +
        shown.map(function (p) {
          return '<tr><td data-label="Commande" class="multi"><button type="button" class="link-btn" data-act="open-order" data-id="' + h(p.id) + '">' + h(p.id) + '</button><div class="small">' + h(p.client) + '</div></td>' +
            '<td data-label="Wilaya">' + h(wilayaName(p.wilaya)) + '</td>' +
            '<td data-label="N° de suivi" class="mono">' + h(p.tracking) + '</td>' +
            '<td data-label="Statut Ecotrack" class="multi">' + h(p.carrierLabel || '—') + (p.stale ? ' <span class="pill" style="background:#FFF3DC;color:#8A5200">' + (p.group === 'draft' ? 'à valider' : 'sans mouvement') + '</span>' : '') +
              (p.courierNote && (p.group === 'suspended' || p.group === 'returning') ? '<div class="small courier-note">' + (p.tagLabel ? tagPill('', p.tagLabel) + ' ' : '') + h(p.courierNote) + '</div>' : '') + '</td>' +
            '<td data-label="Depuis">' + h(hoursText(p.ageHours)) + '</td>' +
            '<td data-label="Total" class="num strong">' + money(p.total) + '</td>' +
            '<td data-label=""><button type="button" class="btn" style="min-height:36px" data-act="track-history" data-id="' + h(p.id) + '">' + icon('clock') + 'Chronologie</button></td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    return html + '</section>';
  }

  /* Chronologie d'un colis : dans la fiche de la commande si elle est ouverte, sinon dans une fenêtre. */
  /** Remarques du colis : le livreur à gauche, vous à droite. */
  function remarksHtml(d) {
    if (!d.remarks) return '';
    var html = '<h3 class="small strong" style="margin:14px 0 6px">Échanges avec le livreur</h3>';
    if (!d.remarksOk) return html + '<p class="small">Remarques non disponibles : ' + h(d.remarksError || 'erreur') + '</p>';
    if (!d.remarks.length) return html + '<p class="small">Aucune remarque sur ce colis.</p>';
    return html + '<div class="remarks">' + d.remarks.map(function (r) {
      return '<div class="remark' + (r.mine ? ' mine' : '') + '"><span class="small strong">' + (r.mine ? 'Vous' : '' + icon('courier') + '' + h(r.author || 'Livreur')) + '</span>' +
        (r.tagLabel ? ' ' + tagPill(r.tag, r.tagLabel) : '') +
        '<div>' + h(r.mine ? r.text.replace(/^Vendeur\s*:\s*/, '') : r.text) + '</div>' +
        '<span class="small">' + (r.date ? fmtDate(r.date) : h(r.dateText || '')) + '</span></div>';
    }).join('') + '</div>';
  }

  var TAG_STYLE = {
    injoignable: '#FFF3DC;color:#8A5200', refus: '#FBE7E7;color:#A12626', reporte: '#E6EEFB;color:#1E4FA8', adresse: '#EFE9FB;color:#5B34A8'
  };
  function tagPill(tag, label) {
    var key = tag || ({ Injoignable: 'injoignable', Refus: 'refus', 'Reporté': 'reporte', Adresse: 'adresse' })[label] || '';
    return '<span class="pill" style="background:' + (TAG_STYLE[key] || '#EEF0F3;color:#3D4350') + '">' + h(label) + '</span>';
  }

  /* ---------------- Résultat de l'appel (alertes de suivi) ---------------- */

  /** Suivi : l'action à faire, en quelques mots (la phrase complète est dans le « ? »). */
  function shortAction(a) {
    var map = { suspended: 'Appeler le client', returning: 'Rappeler le client', return_stuck: 'Réclamer le retour à Ecotrack', draft: 'Valider dans Expédier',
      money_late: 'Vérifier le paiement avec Ecotrack', missing: 'Vérifier dans Ecotrack', unknown: 'Mettre à jour à la main' };
    if (map[a.kind]) return map[a.kind];
    var t = String(a.detail || '');
    if (a.kind === 'stale') return t.split(' (')[0];
    var i = t.lastIndexOf(' : ');
    t = i >= 0 ? t.slice(i + 3) : t;
    return t.charAt(0).toUpperCase() + t.slice(1).replace(/\.$/, '');
  }

  function alertById(id) {
    var d = S.track.data;
    return d ? d.alerts.filter(function (a) { return a.id === id; })[0] : null;
  }

  function openFollow(id) {
    var a = alertById(id);
    if (!a) return;
    S.follow = { id: id };
    showModal(modalHead('Résultat de l’appel · ' + h(id), '<p class="small">' + h(a.client) + ' · ' + h(fmtPhone(a.phone)) + ' · ' + h(wilayaName(a.wilaya)) + '</p>') +
      (a.courierNote ? '<p class="small courier-note" style="margin-bottom:10px">' + icon('courier') + 'Livreur : ' + h(a.courierNote) + '</p>' : '') +
      '<div class="follow-choices">' +
      followChoice('informed', 'ok', 'Prévenu, il attend le livreur', 'L’alerte se ferme.') +
      followChoice('postpone', 'calendar', 'Reporter la livraison', 'Remarque au livreur avec le jour et l’heure ; l’alerte revient ce jour-là si le colis n’est pas livré.') +
      followChoice('address', 'pin', 'Nouvelle adresse ou nouveau téléphone', 'Remarque au livreur, et ligne dans les notes de la commande.') +
      followChoice('refused', 'x', 'Il refuse le colis', (a.canReturn ? 'Demande de retour chez Ecotrack, et client signalé' : 'Client signalé') + ' « a refusé un colis » (sans liste noire).') +
      followChoice('no_answer', 'noanswer', 'Pas de réponse', a.calls ? 'Appel ' + (a.calls + 1) + ' sur 3.'
        : 'Rappel dans 2 h (3 essais)' + (a.canReturn ? ' ; un SMS part au client au premier appel sans réponse.' : '.')) +
      '</div><div id="follow-form"></div>');
  }

  function followChoice(result, iconName, title, note) {
    return '<button type="button" class="follow-choice" data-act="follow-pick" data-result="' + result + '"><span class="icon" aria-hidden="true">' + icon(iconName) + '</span>' +
      '<span><strong>' + h(title) + '</strong><br><span class="small">' + h(note) + '</span></span></button>';
  }

  function localInput(d) {
    var p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function pickFollow(result) {
    if (!S.follow) return;
    S.follow.result = result;
    $all('.follow-choice').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-result') === result)); });
    var box = $('#follow-form');
    if (result === 'informed' || result === 'no_answer') { sendFollow(result, {}); return; }
    var html = '';
    if (result === 'postpone') {
      var t = new Date();
      t.setDate(t.getDate() + 1);
      t.setHours(14, 0, 0, 0);
      html = field('Le client est disponible le', '<input type="datetime-local" id="follow-when" value="' + localInput(t) + '">', 'full') +
        '<div class="quick" style="margin:-4px 0 10px">' +
        '<button type="button" class="chip" data-act="follow-when" data-days="1" data-hour="9">Demain 9 h</button>' +
        '<button type="button" class="chip" data-act="follow-when" data-days="1" data-hour="14">Demain 14 h</button>' +
        '<button type="button" class="chip" data-act="follow-when" data-days="2" data-hour="9">Après-demain 9 h</button></div>' +
        field('Précision pour le livreur (facultatif)', '<input id="follow-note" maxlength="120" placeholder="Ex. appeler avant de passer">', 'full');
    } else if (result === 'address') {
      html = field('Nouvelle adresse ou nouveau numéro', '<textarea id="follow-text" rows="3" maxlength="240" placeholder="Ex. nouveau numéro 0661 22 33 44, ou : cité 200 logements, bâtiment 12"></textarea>', 'full');
    } else if (result === 'refused') {
      var a = alertById(S.follow.id) || {};
      html = '<p>' + (a.canReturn ? 'Une <strong>demande de retour</strong> part chez Ecotrack (la société de livraison peut l’ignorer). ' : '') +
        'Le client est <strong>signalé</strong> « a refusé un colis » : ses prochaines commandes l’afficheront. Pas de liste noire.</p>';
    }
    box.innerHTML = '<div class="follow-form">' + html + '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Annuler</button>' +
      '<button type="button" class="btn primary" data-act="follow-send">' + (result === 'refused' ? 'Confirmer le refus' : 'Envoyer au livreur') + '</button></div></div>';
    var first = $('#follow-form input, #follow-form textarea');
    if (first) first.focus();
  }

  function submitFollow() {
    var f = S.follow;
    if (!f || !f.result) return;
    var data = {};
    if (f.result === 'postpone') {
      var v = $('#follow-when') ? $('#follow-when').value : '';
      if (!v) { toast('Choisissez le jour et l’heure.', true); return; }
      data = { when: new Date(v).toISOString(), note: $('#follow-note') ? $('#follow-note').value : '' };
    } else if (f.result === 'address') {
      data = { text: $('#follow-text') ? $('#follow-text').value : '' };
    }
