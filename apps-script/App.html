  var moduleLoading = {};
  /** Les premières données d'une page lourde (mêmes arguments que la page demandera). */
  function moduleSpec(name) {
    if (name === 'stock') return { fn: 'api_stockPage', args: [] };
    if (name === 'benefices') return { fn: 'api_profit', args: periodArgs(S.profit.p) };
    if (name === 'admin') return { fn: 'api_adminOverview', args: [] };
    if (name === 'stats') {
      var st = S.stats || { period: '30', from: '', to: '' };
      var custom = st.period === 'custom';
      return { fn: 'api_stats', args: [custom ? '' : st.period, custom ? st.from : '', custom ? st.to : ''] };
    }
    return null;
  }

  function loadModule(name, withData) {
    if (DZ.modules[name]) return Promise.resolve(DZ.modules[name]);
    if (moduleLoading[name]) return moduleLoading[name];
    moduleLoading[name] = call('api_pageScript', name, withData ? moduleSpec(name) : null).then(function (res) {
      var tag = document.createElement('script');
      tag.text = typeof res === 'string' ? res : res.code;
      if (res && res.preload) S.preloaded[res.preload.key] = res.preload.data;
      document.body.appendChild(tag);
      if (!DZ.modules[name]) throw new Error('Page illisible : rechargez l’application.');
      return DZ.modules[name];
    }).catch(function (e) { delete moduleLoading[name]; throw e; });
    return moduleLoading[name];
  }

  function openModule(name) {
    if (DZ.modules[name]) { DZ.modules[name].page(); return; }
    view.innerHTML = '<p class="loading">Chargement…</p>';
    syncStart();
    loadModule(name, true).then(function (m) { syncEnd(); if (S.route === name) m.page(); }, function (e) { syncEnd(); throw e; })
      .catch(function (e) { if (S.route === name) view.innerHTML = errorBox(e); });
  }

  /** Les champs des pages chargées à la demande (listes de choix…). */
  function moduleChange(e) {
    var names = Object.keys(DZ.modules);
    for (var i = 0; i < names.length; i++) {
      var m = DZ.modules[names[i]];
      if (m.onChange && m.onChange(e)) return true;
    }
    return false;
  }

    // Case à cocher dans une ligne cliquable : cocher sans ouvrir la commande.
    var stop = e.target.closest && e.target.closest('[data-stop]');
    if (stop) {
      if (e.target.tagName !== 'INPUT') {
        var box = stop.querySelector('input[type=checkbox]');
        if (box) { box.checked = !box.checked; box.dispatchEvent(new Event('change', { bubbles: true })); }
      }

    if (!(e.target.closest && e.target.closest('.qh, .qh-tip'))) closeHelp();

  function preloadPages() {
    var specs = [];
    if (!S.dash[periodKey(S.dashP)]) specs.push({ fn: 'api_dashboard', args: periodArgs(S.dashP), key: periodKey(S.dashP) });
    if (!S.list) specs.push({ fn: 'api_listOrders', args: [listArgs(false)] });
    if (!S.queue && S.route !== 'confirmation') specs.push({ fn: 'api_queue', args: [] });
    if (!S.ship.data) specs.push({ fn: 'api_shippingList', args: [] });
    if (!S.track.data) specs.push({ fn: 'api_trackingOverview', args: [S.track.days] });
    var then = function () {
      var u = S.boot.user;
      var names = [].concat(u.admin ? ['stats', 'admin', 'benefices'] : []).concat(u.stock ? ['stock'] : []);
      names.reduce(function (p, n) { return p.then(function () { return loadModule(n).catch(function () {}); }); }, Promise.resolve());
    };
    if (!specs.length) { then(); return; }
    call('api_preloadPages', specs).then(function (list) {
      list.forEach(function (r, i) {
        if (!r || !r.data) return;
        var s = specs[i];
        if (s.fn === 'api_dashboard' && !S.dash[s.key]) S.dash[s.key] = r.data;
        else if (s.fn === 'api_listOrders' && !S.list) { S.list = r.data; S.listKey = JSON.stringify(s.args[0]); }
        else if (s.fn === 'api_queue' && !S.queue && S.route !== 'confirmation') setQueue(r.data);
        else if (s.fn === 'api_shippingList' && !S.ship.data) S.ship.data = r.data;
        else if (s.fn === 'api_trackingOverview' && !S.track.data) S.track.data = r.data;
      });
      then();
    }).catch(function () { /* simple préparation : sans effet si elle échoue */ });
  }

      (on ? '<p class="small" style="color:#146C2E;font-weight:600">' + icon('ok') + 'Activées sur ce téléphone' + (info.device ? ' (' + h(info.device) + ')' : '') + '</p>'
        : denied ? '<p class="small" style="color:#A12626">Notifications bloquées par le navigateur : touchez le cadenas à côté de l’adresse › Notifications › Autoriser, puis rouvrez cette fenêtre.</p>'
          : '<p class="small">Pas encore activées sur ce téléphone.</p>') +
      '<div class="push-list">' +
      sw('orders', 'Nouvelles commandes', 'Dès qu’une commande arrive (Releasit, Shopify)') +
      sw('callbacks', 'Rappels à l’heure', 'Une commande « à rappeler » arrive à son heure') +
      (info.admin ? sw('tracking', 'Colis à traiter', 'Refus, retour, colis bloqué') + sw('problems', 'Problèmes de l’outil', 'Relais RELEASIT muet, Ecotrack en panne…') : '') +
      sw('quiet', 'Silence la nuit', 'Pas de notification de 22 h à 8 h') + '</div>' +
      '<div class="modal-actions">' + (on ? '<button type="button" class="btn" data-act="push-test">Envoyer un essai</button><button type="button" class="btn" data-act="push-off">Désactiver</button>'
        : '<button type="button" class="btn primary" data-act="push-on"' + (denied ? ' disabled' : '') + '>Activer sur ce téléphone</button>') + '</div>');
  }
  document.addEventListener('change', function (e) {
    var key = e.target && e.target.getAttribute && e.target.getAttribute('data-push-pref');
    if (!key || !S.pushSub || !S.pushInfo) return;
    S.pushInfo.prefs[key] = e.target.checked;
    call('api_pushPrefs', S.pushSub.endpoint, S.pushInfo.prefs).then(function (r) { S.pushInfo.prefs = r.prefs; toast(r.message); })
      .catch(function (err) { toast(errText(err), true); });
  });

  /** Active les notifications de ce téléphone : autorisation, abonnement, enregistrement. */
  function pushOn(el) {
    var c = window.DZ_CLOUD;
    if (el) el.disabled = true;
    return call('api_pushInfo').then(function (info) {
      return c.push.subscribe(info.publicKey).then(function (sub) { return call('api_pushSubscribe', sub.toJSON(), null, deviceName()); });
    }).then(function (r) {
      if (el) el.disabled = false;
      var b = $('#push-banner');
      if (b) b.remove();
      toast(r.message);
      return r;
    }).catch(function (e) { if (el) el.disabled = false; toast(errText(e), true); throw e; });
  }


  function bootFailed(e) {
    view.innerHTML = errorBox(e) +
      '<p class="sub" style="margin-top:12px">Vérifiez que le classeur est partagé avec votre adresse Google (en Éditeur), puis rechargez la page.</p>';
  }

  // Lien avec une page demandée (« &page=benefices », depuis la version Cloudflare).
  if (window.DZ_DEVICE && DZ_DEVICE.page && ROUTES.indexOf(DZ_DEVICE.page) >= 0 && !location.hash) location.hash = '#/' + DZ_DEVICE.page;
  var mem = memRead();
  if (mem) {
    // Ouverture instantanée : la dernière version des pages, gardée sur cet appareil, s'affiche tout de suite ;
    // le serveur est appelé en même temps et chaque page se met à jour dès qu'il répond (barre en haut).
    S.boot = mem.boot;
    S.fromMemory = true;
    if (mem.dash) S.dash[mem.dash.key] = mem.dash.data;
    if (mem.list) { S.list = mem.list.data; S.listKey = mem.list.key; }
    if (mem.queue) setQueue(mem.queue);
    if (mem.ship) S.ship.data = mem.ship;
    if (mem.track) S.track.data = mem.track;
    applyBoot(S.boot);
    window.addEventListener('hashchange', go);
    go();
    syncStart();
    call('api_bootstrap', null).then(function (b) {
      syncEnd();
      var old = S.boot.user;
      S.boot = b;
      S.fromMemory = false;
      applyBoot(b);
      // Rôle changé entre-temps (administrateur, magasinier) : la page est redessinée avec les bons droits.
      if (old.admin !== b.user.admin || old.stock !== b.user.stock || old.name !== b.user.name) go();
      memSave();
      started();
    }).catch(function (e) {
      syncEnd();
      memClear();
      bootFailed(e);
    });
  } else {
    var firstSpec = preloadSpec(currentRoute());
    call('api_bootstrap', firstSpec).then(function (b) {
      S.boot = b;
      if (b.preload && firstSpec && b.preload.key === firstSpec.key) S.preloaded[firstSpec.key] = b.preload.data;
      applyBoot(b);
      window.addEventListener('hashchange', go);
      go();
      if (!b.counts) refreshCount();
      memSave();
      started();
    }).catch(bootFailed);
  }
})();
</script>
