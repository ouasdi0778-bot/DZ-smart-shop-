<script>
(function () {
  'use strict';

  /* ================================================================ */
  /* État et outils                                                   */
  /* ================================================================ */

  var S = {
    boot: null,
    route: '',
    dashP: null,      // période du tableau de bord { period, from, to } (retenue sur l'appareil)
    filter: { status: 'todo', q: '', wilaya: '', period: '30', limit: 100 },
    queue: null,
    currentId: null,
    current: null,
    busy: false,
    token: 0,
    detailToken: 0,
    ship: {
      data: null, tab: 'toship', selected: {}, busy: false, results: null,
      created: { sel: {}, filter: 'all' }, // onglet « Créés, à valider » : sélection et filtre
      vbusy: false, vresults: null,         // validation de l'expédition
      printing: false, pdf: null,           // dernier PDF de bordereaux { url, items, marked }
      refreshedAt: 0                        // dernière relecture des colis créés chez Ecotrack
    },
    track: { data: null, days: 30, filter: 'all', view: 'active', done: 'all' },
    follow: null,     // alerte en cours : { id, result } (fenêtre « Résultat de l'appel »)
    followBusy: false,
    order: null,      // dernière commande affichée dans la fenêtre (pour la réafficher)
    unlockId: null,   // commande déverrouillée par un administrateur
    list: null,       // dernière liste de la page Commandes (mise à jour sur place)
    preloaded: {},    // réponses déjà reçues avec le démarrage (clé : fonction + arguments)
    prefetch: null,   // commande suivante préparée à l'avance { id, data }
    pending: {},      // commandes envoyées, en cours d'enregistrement
    cooldown: 0,      // évite qu'un double clic traite aussi la commande suivante
    profit: { p: null, tab: 'resume', data: null },
    stock: { data: null },
    pendingTotal: 0,  // commandes ni confirmées ni annulées (compteur « 5 / 12 »)
    dash: {},         // tableau de bord déjà reçu, par période (affiché tout de suite au retour sur la page)
    listKey: '',      // filtre de la dernière liste reçue (S.list)
    nav: null         // { route, t0 } : mesure du temps de la page ouverte
  };
  var TZ = 'Africa/Algiers';

  /* ---------------- Période libre (Tableau de bord, Bénéfices), retenue sur cet appareil ---------------- */
  var PERIODS = [['today', 'Aujourd’hui'], ['yesterday', 'Hier'], ['7', '7 jours'], ['30', '30 jours'], ['month', 'Ce mois'],
    ['lastmonth', 'Mois dernier'], ['all', 'Tout'], ['custom', 'Personnalisé…']];
  var PERIOD_KEY = 'dz-smart-shop:periode:';
  function loadPeriod(page, def) {
    try {
      var v = JSON.parse(window.localStorage.getItem(PERIOD_KEY + page) || 'null');
      if (v && PERIODS.some(function (x) { return x[0] === v.period; }) && (v.period !== 'custom' || (v.from && v.to))) return v;
    } catch (e) { /* navigation privée : période par défaut */ }
    return { period: def, from: '', to: '' };
  }
  function savePeriod(page, p) {
    try { window.localStorage.setItem(PERIOD_KEY + page, JSON.stringify(p)); } catch (e) { /* choix non retenu, sans importance */ }
  }
  function periodKey(p) { return p.period === 'custom' ? 'custom:' + p.from + ':' + p.to : p.period; }
  function periodArgs(p) { return p.period === 'custom' ? ['', p.from, p.to] : [p.period]; }
  function isoDay(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function dayText(k) { return k ? k.split('-').reverse().join('/') : ''; }
  /** Boutons de période ; « Personnalisé… » ouvre deux dates (du / au). */
  function periodPicker(p, act) {
    var html = '<div class="chips period-chips" role="group" aria-label="Période">' + PERIODS.map(function (x) {
      return '<button type="button" class="chip" data-act="' + act + '" data-period="' + x[0] + '" aria-pressed="' + (p.period === x[0]) + '">' + x[1] + '</button>';
    }).join('') + '</div>';
    if (p.period === 'custom') {
      html += '<div class="quick period-custom">' +
        field('Du', '<input type="date" data-pfrom value="' + h(p.from) + '" max="' + isoDay(new Date()) + '">') +
        field('Au', '<input type="date" data-pto value="' + h(p.to) + '" max="' + isoDay(new Date()) + '">') +
        '<button type="button" class="btn primary" data-act="' + act + '" data-period="custom" data-apply="1">Afficher</button></div>';
    }
    return html;
  }
  /** Clic sur une période : true s'il faut recharger les données (false : seulement afficher les dates). */
  function pickPeriod(p, el, page) {
    var per = el.getAttribute('data-period');
    if (per === 'custom' && !el.hasAttribute('data-apply')) {
      p.period = 'custom';
      if (!p.from || !p.to) { var t = new Date(); p.to = isoDay(t); t.setDate(t.getDate() - 6); p.from = isoDay(t); }
      return false;
    }
    if (per === 'custom') {
      var f = ($('[data-pfrom]') || {}).value || '';
      var to = ($('[data-pto]') || {}).value || '';
      if (!f || !to) { toast('Choisissez les deux dates.', true); return false; }
      if (f > to) { var x = f; f = to; to = x; }
      p.from = f; p.to = to;
    }
    p.period = per;
    savePeriod(page, p);
    return true;
  }
  var ALERT = {
    bad: { bg: '#FBE7E7', fg: '#A12626' },
    warn: { bg: '#FCEBDD', fg: '#9A4200' },
    ok: { bg: '#DDF0E4', fg: '#146C2E' },
    'new': { bg: '#E6EEFB', fg: '#1E4FA8' }
  };
  /* ---------------- Mémoire sur l'appareil (ouverture instantanée) ---------------- */
  // Les dernières pages reçues (tableau de bord, commandes, file d'appels, expéditions, suivi) sont gardées
  // sur cet appareil, pour ce compte seulement (clé tirée de l'adresse, jamais l'adresse elle-même), 24 h au plus.
  var DEVICE = window.DZ_DEVICE || {};
  var MEM_KEY = DEVICE.key ? 'dz-smart-shop:memoire:' + DEVICE.key : '';
  var MEM_MAX_AGE = 24 * 3600000;
  function memClear() {
    try { if (MEM_KEY) window.localStorage.removeItem(MEM_KEY); } catch (e) { /* sans importance */ }
  }
  function memRead() {
    if (!MEM_KEY) return null;
    try {
      var m = JSON.parse(window.localStorage.getItem(MEM_KEY) || 'null');
      if (!m) return null;
      if (m.v !== DEVICE.v || !m.boot || !m.boot.user || Date.now() - m.at > MEM_MAX_AGE) { memClear(); return null; }
      return m;
    } catch (e) { return null; }
  }
  var memTimer = null;
  /** Garde l'état des pages (un peu après chaque mise à jour, pour ne pas ralentir l'écran). */
  function memSave(now) {
    if (!MEM_KEY || !S.boot || S.fromMemory) return;
    clearTimeout(memTimer);
    var write = function () {
      try {
        var boot = {};
        Object.keys(S.boot).forEach(function (k) { if (k !== 'preload') boot[k] = S.boot[k]; });
        var dk = periodKey(S.dashP);
        var m = {
          v: DEVICE.v, at: Date.now(), boot: boot,
          dash: S.dash[dk] ? { key: dk, data: S.dash[dk] } : null,
          list: S.list && S.listKey ? { key: S.listKey, data: S.list } : null,
          queue: S.queue || null,
          ship: S.ship.data || null,
          track: S.track.data || null
        };
        var text = JSON.stringify(m);
        if (text.length > 3000000) { m.list = null; m.track = null; text = JSON.stringify(m); }
        window.localStorage.setItem(MEM_KEY, text);
      } catch (e) { /* mémoire pleine ou interdite (navigation privée) : l'application marche quand même */ }
    };
    if (now) write(); else memTimer = setTimeout(write, 2000);
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') memSave(true); });

  var view = document.getElementById('view');
  S.sel = { orders: {}, trash: {}, expenses: {} }; // sélection en plusieurs, par liste
  /** Boutons de la barre d'actions de chaque liste (sélection en plusieurs) : fonction(n) → html. */
  var BULK = {};
  S.dashP = loadPeriod('tableau', '7');
  S.profit.p = loadPeriod('benefices', '30');

  /* Petite barre en haut de l'écran pendant qu'une page se met à jour en arrière-plan. */
  var syncing = 0;
  function syncStart() { syncing++; document.body.classList.add('syncing'); }
  function syncEnd() {
    syncing = Math.max(0, syncing - 1);
    if (!syncing) { document.body.classList.remove('syncing'); if (typeof memSave === 'function') memSave(); }
  }

  /** Temps entre le clic sur la page et ses données à jour, gardé sur cet appareil (page Administration). */
  var PERF_KEY = 'dz-smart-shop:temps-pages';
  function perfDone(route) {
    var n = S.nav;
    if (!n || n.route !== route) return;
    S.nav = null;
    var ms = Math.round(performance.now() - n.t0);
    try {
      var all = JSON.parse(window.localStorage.getItem(PERF_KEY) || '{}');
      var p = all[route] || { n: 0, total: 0, last: 0 };
      p.n = Math.min(p.n + 1, 50);
      p.total = p.n === 50 ? Math.round(p.total / 50 * 49) + ms : p.total + ms;
      p.last = ms;
      all[route] = p;
      window.localStorage.setItem(PERF_KEY, JSON.stringify(all));
    } catch (e) { /* navigation privée : pas de mesure */ }
  }

  /** Appelle une fonction du serveur (Api.gs) et renvoie une promesse. */
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    var key = fn + '|' + JSON.stringify(args);
    if (S.preloaded && Object.prototype.hasOwnProperty.call(S.preloaded, key)) {
      var ready = S.preloaded[key];
      delete S.preloaded[key];
      return Promise.resolve(ready);
    }
    return new Promise(function (resolve, reject) {
      var done = function (res) {
        // Une action qui modifie quelque chose : les fiches gardées pour l'affichage instantané sont oubliées.
        if (!READ_ONLY.test(fn) && S.orderCache) S.orderCache = {};
        resolve(res);
      };
      var runner = google.script.run.withSuccessHandler(done).withFailureHandler(reject);
      runner[fn].apply(runner, args);
    });
  }
  var READ_ONLY = /^api_(get|list|queue|dashboard|counts|tracking|shipping|parcel|profit|stats|bootstrap|page|preload|import|health|admin|settingsGet|stock$|stockPage|team|clients|sms)/;

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function h(value) {
    return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function errText(e) { return (e && e.message) ? e.message : String(e || 'Erreur inconnue'); }
  function errorBox(e) { return '<div class="error-box" role="alert">' + h(errText(e)) + '</div>'; }

  function money(n) {
    var v = Math.round(Number(n) || 0);
    return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' DA';
  }
  function pct(a, b) { return b ? Math.round(a / b * 100) + ' %' : '—'; }
  function plural(n, one, many) { return n + ' ' + (n > 1 ? many : one); }

  function fmtDate(iso, withDay) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    var o = { timeZone: TZ, hour: '2-digit', minute: '2-digit' };
    if (withDay !== false) { o.day = '2-digit'; o.month = '2-digit'; }
    // L'année seulement si ce n'est pas l'année en cours (évite de confondre deux 14/11).
    if (withDay !== false && d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
    try { return d.toLocaleString('fr-FR', o); } catch (e) { return d.toLocaleString('fr-FR'); }
  }
  /** Jour seul (« 14/11/2026 »), à l'heure d'Algérie. */
  function fmtDay(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    try { return d.toLocaleDateString('fr-FR', { timeZone: TZ, day: '2-digit', month: '2-digit', year: 'numeric' }); } catch (e) { return d.toLocaleDateString('fr-FR'); }
  }
  function ago(iso) {
    if (!iso) return '';
    var diff = Date.now() - new Date(iso).getTime();
    var future = diff < 0;
    var m = Math.round(Math.abs(diff) / 60000);
    var txt = m < 1 ? 'à l’instant' : m < 60 ? m + ' min' : m < 1440 ? Math.round(m / 60) + ' h' : Math.round(m / 1440) + ' j';
    if (m < 1) return txt;
    return future ? 'dans ' + txt : 'il y a ' + txt;
  }
  function fmtPhone(p) {
    var s = String(p || '');
    if (/^0\d{9}$/.test(s)) return s.replace(/^(\d{4})(\d{2})(\d{2})(\d{2})$/, '$1 $2 $3 $4');
    return s;
  }
  function wilayaName(w) { return String(w || '').replace(/^\d+\s*-\s*/, ''); }

  /**
   * v1.14 : une explication rangée derrière un « ? » (s'ouvre au toucher, se ferme au deuxième toucher ou
   * en touchant ailleurs). `html` est déjà du HTML (textes de l'application).
   */
  function help(html) {
    return '<button type="button" class="qh" data-act="qh" aria-label="Explication" aria-expanded="false">?</button><span class="qh-tip" hidden>' + html + '</span>';
  }
  function closeHelp() {
    $all('.qh-tip:not([hidden])').forEach(function (t) { t.hidden = true; });
    $all('.qh.on').forEach(function (b) { b.classList.remove('on'); b.setAttribute('aria-expanded', 'false'); });
  }
  /** État en un coup d'œil : point de couleur et quelques mots. */
  function stat(ok, html) { return '<span class="st' + (ok === false ? ' warn' : '') + '"><i></i>' + html + '</span>'; }

  /** Icône (dessin du « sprite » de Index.html). */
  function icon(name, cls) {
    return '<svg class="ic' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
  }
  var STATUS_ICON = {
    'À confirmer': 'clock', 'Pas de réponse': 'noanswer', 'Rappeler': 'calendar', 'Injoignable': 'noanswer', 'Confirmée': 'check',
    'Expédiée': 'suivi', 'En livraison': 'courier', 'Livrée': 'home', 'Retour': 'return', 'Annulée': 'x'
  };

  function pill(status) {
    var st = (S.boot && S.boot.styles[status]) || { bg: '#EEF0F3', fg: '#3D4350' };
    return '<span class="pill" style="background:' + st.bg + ';color:' + st.fg + '">' + (STATUS_ICON[status] ? icon(STATUS_ICON[status]) : '') + h(status || '—') + '</span>';
  }
  function alertPill(text, level) {
    if (!text) return '';
    var st = ALERT[level] || ALERT['new'];
    return '<span class="pill" style="background:' + st.bg + ';color:' + st.fg + '">' + h(text) + '</span>';
  }

  /** Liste d'options ; garde une valeur inconnue pour ne pas la perdre. */
  function options(list, selected, emptyLabel) {
    var out = emptyLabel !== undefined ? '<option value="">' + h(emptyLabel) + '</option>' : '';
    if (selected && list.indexOf(selected) < 0) out += '<option selected>' + h(selected) + '</option>';
    return out + list.map(function (v) {
      return '<option' + (v === selected ? ' selected' : '') + '>' + h(v) + '</option>';
    }).join('');
  }
  function field(label, control, cls) {
    return '<label class="field' + (cls ? ' ' + cls : '') + '">' + h(label) + control + '</label>';
  }
  function input(name, value, attrs) {
    return '<input name="' + name + '" value="' + h(value) + '"' + (attrs || '') + '>';
  }
  function readForm(root) {
    var out = {};
    $all('[name]', root).forEach(function (el) {
      out[el.name] = el.type === 'checkbox' ? el.checked : el.value;
    });
    return out;
  }

  var toastTimer = null;
  function toast(msg, isError) {
    var t = $('#toast');
    var busy = /…$/.test(String(msg || ''));
    t.innerHTML = (busy ? '' : icon(isError ? 'alert' : 'ok')) + '<span>' + h(msg) + '</span>';
    t.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = ''; }, isError ? 6000 : 3200);
  }

  /** Frais de livraison d'après l'onglet Tarifs, ou null. */
  function feeFor(wilaya, carrier, mode) {
    var code = parseInt(String(wilaya || ''), 10);
    var r = S.boot.rates[code];
    var c = carrier || S.boot.defaultCarrier;
    if (r && r[c] && r[c][mode] !== undefined) return r[c][mode];
    return null;
  }

  /* ================================================================ */
  /* Navigation                                                       */
  /* ================================================================ */

  var ROUTES = ['tableau', 'commandes', 'confirmation', 'expeditions', 'suivi', 'benefices', 'stock', 'stats', 'admin'];
  /** Statuts de la page Commandes (pas encore confirmées). */
  var TODO_STATUSES = ['À confirmer', 'Pas de réponse', 'Rappeler', 'Injoignable'];
  /** Page où se trouve une commande trouvée par la recherche. */
  var PAGE_LABELS = { expedier: 'Expédier', suivi: 'Suivi', terminees: 'Suivi › Terminées', annulees: 'Annulées' };

  function currentRoute() {
    var r = (location.hash || '').replace(/^#\/?/, '');
    return ROUTES.indexOf(r) < 0 ? 'tableau' : r;
  }

  /** Arguments de la liste des commandes ; à l'ouverture de la page : vérifie RELEASIT et l'état des importations. */
  function listArgs(first) {
    var f = {};
    Object.keys(S.filter).forEach(function (k) { f[k] = S.filter[k]; });
    if (String(f.q || '').trim()) f.status = 'all'; // une recherche trouve les commandes de toutes les pages
    if (first) { f.sync = true; f.withStatus = true; }
    return f;
  }

  /** Ce que la première page demandera : calculé par le serveur avec le démarrage, en un seul aller-retour. */
  function preloadSpec(route) {
    var spec = route === 'tableau' ? { fn: 'api_dashboard', args: periodArgs(S.dashP) }
      : route === 'commandes' ? { fn: 'api_listOrders', args: [listArgs(true)] }
      : route === 'confirmation' ? { fn: 'api_queue', args: [{ sync: true, first: true }] }
      : null;
    if (spec) spec.key = spec.fn + '|' + JSON.stringify(spec.args);
    return spec;
  }

  function go() {
    var r = currentRoute();
    S.route = r;
    S.nav = { route: r, t0: performance.now() };
    $all('[data-route]').forEach(function (a) {
      var on = a.getAttribute('data-route') === r;
      a.classList.toggle('active', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    closeModal();
    var title = PAGE_TITLES[r] || '';
    $all('[data-page-title]').forEach(function (el) { el.textContent = title; });
    document.documentElement.classList.toggle('has-title', !!title);
    if (cloudMoved(r)) { /* page déplacée */ }
    else if (r === 'tableau') pageDashboard();
    else if (r === 'commandes') pageOrders();
    else if (r === 'expeditions') pageShipping();
    else if (r === 'suivi') pageTracking();
    else if (r === 'benefices' || r === 'stats' || r === 'admin') { if (S.boot.user.admin) openModule(r); else { location.hash = '#/tableau'; return; } }
    else if (r === 'stock') { if (S.boot.user.stock) openModule(r); else { location.hash = '#/tableau'; return; } }
    else pageConfirm();
    view.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  /** Titre de la page dans l'en-tête du téléphone. */
  var PAGE_TITLES = { tableau: 'Tableau de bord', commandes: 'Commandes', confirmation: 'Confirmation', expeditions: 'Expédier', suivi: 'Suivi',
    benefices: 'Bénéfices', stock: 'Stock', stats: 'Statistiques', admin: 'Administration' };
  function isPhone() { return !!(window.matchMedia && window.matchMedia('(max-width: 860px)').matches); }

  function navigate(route, status) {
    if (status) { S.filter.status = status; S.filter.limit = 100; }
    if (location.hash === '#/' + route) go(); else location.hash = '#/' + route;
  }

  /** Compteur de Confirmation : « à appeler maintenant / total en attente » (ni confirmées ni annulées). */
  function setQueueCount(n, pending) {
    if (pending !== undefined && pending !== null) S.pendingTotal = pending;
    var total = Math.max(S.pendingTotal || 0, n || 0);
    $all('[data-queue-count]').forEach(function (el) {
      el.textContent = (n || 0) + '/' + total;
      el.title = (n || 0) + ' à appeler maintenant, ' + total + ' en attente au total';
      el.hidden = !total;
    });
  }
  function setAlertCount(n) {
    $all('[data-alert-count]').forEach(function (el) { el.textContent = n; el.hidden = !n; });
  }
  function applyCounts(c) {
    if (!c) return;
    setQueueCount(c.queue, c.pending);
    setAlertCount(c.alerts);
    if (c.toShip !== undefined) $all('[data-ship-count]').forEach(function (el) { el.textContent = c.toShip; el.hidden = !c.toShip; });
  }
  /** Administrateur : bandeau si une tâche automatique est en panne (détail dans Administration). */
  function showHealth(hl) {
    var banner = $('#health-banner');
    var n = hl ? hl.problems : 0;
    $all('[data-health-count]').forEach(function (el) { el.textContent = n; el.hidden = !n; });
    if (!banner) return;
    if (!hl || (!hl.late && !n)) { banner.hidden = true; return; }
    banner.innerHTML = '' + icon('alert') + '' + (hl.late ? 'Les tâches automatiques ne tournent plus.' : plural(n, 'problème détecté', 'problèmes détectés') + ' dans les tâches automatiques.') +
      ' <a href="#/admin">Voir l’état de l’outil</a>';
    banner.hidden = false;
  }

  function refreshCount() {
    call('api_counts').then(applyCounts).catch(function () {});
  }
  function arrivedText(n) {
    return n > 1 ? n + ' nouvelles commandes reçues' : '1 nouvelle commande reçue';
  }

  /* ================================================================ */
  /* Tableau de bord                                                  */
  /* ================================================================ */

  function pageDashboard(onlyHead) {
    var p = S.dashP;
    var head = '<div class="page-head"><div><h1>Tableau de bord</h1><p class="sub" id="dash-sub"></p></div></div>' +
      '<div id="dash-period">' + periodPicker(p, 'period') + '</div>';
    if (onlyHead && $('#dash-period')) { $('#dash-period').innerHTML = periodPicker(p, 'period'); return; }
    var t = ++S.token;
    view.innerHTML = head + '<div id="dash" style="margin-top:14px"><p class="loading">Chargement…</p></div>';
    var key = periodKey(p);
    if (S.dash[key]) renderDashboard(S.dash[key]); // dernières données tout de suite, mises à jour juste après
    syncStart();
    call.apply(null, ['api_dashboard'].concat(periodArgs(p))).then(function (d) {
      syncEnd();
      S.dash[key] = d;
      if (t === S.token) { renderDashboard(d); perfDone('tableau'); }
    }).catch(function (e) {
      syncEnd();
      if (t === S.token && !S.dash[key]) $('#dash').innerHTML = errorBox(e);
    });
  }

  /** Petite courbe des 7 derniers jours (le dernier point = aujourd'hui). */
  function spark(values) {
    if (!values || !values.length) return '';
    var max = Math.max.apply(null, values.concat([1]));
    var W = 84;
    var H = 26;
    var pts = values.map(function (v, i) { return (4 + i * (W - 8) / (values.length - 1)).toFixed(1) + ',' + (H - 4 - v / max * (H - 8)).toFixed(1); });
    var last = pts[pts.length - 1].split(',');
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="7 derniers jours : ' + values.join(', ') + '">' +
      '<polyline points="' + pts.join(' ') + '"/><circle cx="' + last[0] + '" cy="' + last[1] + '" r="2.6"/></svg>';
  }

  function renderDashboard(d) {
    var st = S.boot.styles;
    var sp = d.spark || {};
    var sub = $('#dash-sub');
    if (sub && d.range) sub.textContent = d.range.all ? 'Toutes les commandes (archives comprises)' : d.range.from === d.range.to ? 'Le ' + dayText(d.range.from) : 'Du ' + dayText(d.range.from) + ' au ' + dayText(d.range.to);
    var kpis = [
      ['Commandes reçues', d.received, plural(d.waiting, 'commande en attente', 'commandes en attente'), 'commandes', sp.received],
      ['Taux de confirmation', pct(d.confirmed, d.decided), d.confirmed + ' confirmées sur ' + d.decided + ' traitées', 'confirmation', sp.confirmed],
      ['Taux de livraison', pct(d.delivered, d.delivered + d.returned), d.delivered + ' livrées · ' + d.returned + ' retours', 'home', sp.delivered],
      ['Montant livré', money(d.revenueDelivered), 'Commandes livrées sur la période', 'benefices', sp.revenue],
      ['Argent en route', money(d.inTransitAmount), plural(d.inTransitCount, 'colis pas encore livré', 'colis pas encore livrés'), 'suivi', null]
    ];
    var funnel = [
      ['Reçues', d.received, '#EEF0F3', '#3D4350'],
      ['Confirmées', d.confirmed, st['Confirmée'].bg, st['Confirmée'].fg],
      ['Expédiées', d.shipped, st['Expédiée'].bg, st['Expédiée'].fg],
      ['Livrées', d.delivered, st['Livrée'].bg, st['Livrée'].fg],
      ['Retours', d.returned, st['Retour'].bg, st['Retour'].fg],
      ['Annulées', d.cancelled, st['Annulée'].bg, st['Annulée'].fg]
    ];
    var todo = [
      [d.todo.toConfirm, 'à appeler maintenant', 'confirmation', '', 'Confirmer', st['À confirmer']],
      [d.todo.callbacksToday, 'rappels prévus plus tard aujourd’hui', 'confirmation', '', 'Voir', st['Rappeler']],
      [d.todo.toShip, 'commandes confirmées à expédier', 'expeditions', '', 'Expédier', st['Confirmée']],
      [d.todo.unreachable, 'clients injoignables', 'commandes', 'Injoignable', 'Voir', st['Injoignable']],
      [d.todo.waitingLong, 'commandes jamais appelées depuis plus de 24 h', 'confirmation', '', 'Appeler', st['Annulée']],
      [d.todo.parcelAlerts, 'colis à traiter (suspendus, retours, sans mouvement…)', 'suivi', '', 'Suivi', st['Retour']]
    ];
    if (d.todo.stockLow) todo.push([d.todo.stockLow, 'modèles en stock bas ou en rupture', 'stock', '', 'Stock', st['Rappeler']]);

    var html = '<div class="stack">';
    html += '<section class="grid-kpi" aria-label="Chiffres clés">' + kpis.map(function (k) {
      return '<div class="card kpi"><span class="label"><span class="kpi-ic">' + icon(k[3]) + '</span>' + h(k[0]) + '</span>' +
        '<span class="kpi-row"><span class="value">' + h(k[1]) + '</span>' + spark(k[4]) + '</span><span class="note">' + h(k[2]) + '</span></div>';
    }).join('') + '</section>';

    html += '<section class="card"><h2>Parcours des commandes</h2><div class="funnel">' + funnel.map(function (f) {
      return '<div style="background:' + f[2] + ';color:' + f[3] + '"><span class="strong">' + f[0] + '</span><span class="n">' + f[1] + '</span><span class="small" style="color:' + f[3] + '">' + (d.received ? pct(f[1], d.received) + ' des reçues' : 'aucune commande') + '</span></div>';
    }).join('') + '</div></section>';

    html += '<div class="row">';
    html += '<section class="card"><h2>À faire</h2>' + todo.map(function (t) {
      return '<div class="todo"><span class="n" style="background:' + t[5].bg + ';color:' + t[5].fg + '">' + t[0] + '</span>' +
        '<span class="t">' + h(t[1]) + '</span>' +
        '<button type="button" class="btn" data-act="goto" data-route="' + t[2] + '" data-status="' + h(t[3]) + '"' + (t[6] ? ' data-tab="' + t[6] + '"' : '') + '>' + t[4] + '</button></div>';
    }).join('') + '</section>';

    html += '<section class="card"><h2>Taux de livraison par wilaya' + help('Orange : moins de 70 % livrés. « — » : aucun colis terminé.') + '</h2>';
    if (!d.byWilaya.length) {
      html += '<p class="empty">Pas encore de colis expédiés sur la période.</p>';
    } else {
      html += '<div class="bars">' + d.byWilaya.map(function (w) {
        var done = w.delivered + w.returned;
        var rate = done ? Math.round(w.delivered / done * 100) : null;
        return '<div class="bar-row"><span>' + h(w.name) + '<br><span class="small">' + plural(w.orders, 'colis', 'colis') + '</span></span>' +
          '<span class="bar" aria-hidden="true"><span class="' + (rate !== null && rate < 70 ? 'low' : '') + '" style="width:' + (rate || 0) + '%"></span></span>' +
          '<span class="strong" style="text-align:right">' + (rate === null ? '—' : rate + ' %') + '</span></div>';
      }).join('') + '</div>';
    }
    html += '</section></div>';

    html += '<div class="row">';
    html += '<section class="card"><h2>Par confirmatrice</h2>' + (d.byAgent.length ? table(
      ['Confirmatrice', 'Traitées', 'Confirmées', 'Taux'],
      d.byAgent.map(function (a) { return [h(a.name), a.orders, a.confirmed, pct(a.confirmed, a.orders)]; }), [1, 2, 3]
    ) : '<p class="empty">Aucune commande traitée sur la période.</p>') + '</section>';
    html += '<section class="card"><h2>Par produit</h2>' + (d.byProduct.length ? table(
      ['Produit', 'Commandes', 'Confirmées', 'Livrées', 'Retours'],
      d.byProduct.map(function (p) { return [h(p.name), p.orders, p.confirmed, p.delivered, p.returned]; }), [1, 2, 3, 4]
    ) : '<p class="empty">Aucune commande sur la période.</p>') + '</section>';
    html += '</div></div>';
    $('#dash').innerHTML = html;
  }

  function table(head, rows, numCols) {
    numCols = numCols || [];
    return '<div class="table-wrap" style="border:0"><table class="data cards"><thead><tr>' + head.map(function (t) {
      return '<th scope="col">' + h(t) + '</th>';
    }).join('') + '</tr></thead><tbody>' + rows.map(function (r) {
      return '<tr>' + r.map(function (c, i) {
        return '<td data-label="' + h(head[i]) + '"' + (numCols.indexOf(i) >= 0 ? ' class="num"' : '') + '>' + c + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
  }

  /* ================================================================ */
  /* Commandes                                                        */
  /* ================================================================ */

  function pageOrders() {
    var f = S.filter;
    var periods = [['today', 'Aujourd’hui'], ['7', '7 derniers jours'], ['30', '30 derniers jours'], ['all', 'Tout']];
    // Téléphone (v1.12) : la recherche en haut, les filtres sur une ligne qui défile, wilaya et période
    // dans « Filtres » (feuille du bas), le bouton « + » pour une nouvelle commande : la liste tout de suite.
    view.innerHTML =
      '<div class="orders-page"><div class="page-head"><div><h1>Commandes' + help('Commandes pas encore confirmées. Une commande confirmée passe dans <strong>Expédier</strong>, puis <strong>Suivi</strong>. La recherche trouve toutes les commandes.') + '</h1></div>' +
      '<button type="button" class="btn primary" data-act="new-order">' + icon('plus') + 'Nouvelle commande</button></div>' +
      '<div class="ord-search">' + icon('search') + '<input type="search" id="f-q" value="' + h(f.q) + '" placeholder="Nom, téléphone, n° de commande ou de suivi" aria-label="Rechercher"></div>' +
      '<div class="chips-line"><button type="button" class="chip filters-chip" data-act="filters-sheet">' + icon('filter') + 'Filtres' + filterBadge() + '</button>' +
      '<div class="chips" id="chips" role="group" aria-label="Filtrer par statut"></div></div>' +
      '<div class="filters ord-filters">' +
        field('Wilaya', '<select id="f-wilaya">' + options(S.boot.wilayas, f.wilaya, 'Toutes les wilayas') + '</select>') +
        field('Période', '<select id="f-period">' + periods.map(function (p) {
          return '<option value="' + p[0] + '"' + (f.period === p[0] ? ' selected' : '') + '>' + p[1] + '</option>';
        }).join('') + '</select>') +
      '</div>' +
      '<div id="shop-status"></div>' +
      '<div id="orders-list"><p class="loading">Chargement…</p></div></div>' +
      '<button type="button" class="fab" data-act="new-order" aria-label="Nouvelle commande">' + icon('plus') + '</button>';
    if (S.list && S.listKey === listKey()) {
      renderChips(S.list.counts);
      renderOrderList(S.list);
      if (S.list.importStatus) renderShopStatus(S.list.importStatus);
    }
    loadOrders(true);
  }

  /** Nombre de filtres actifs (wilaya, période autre que 30 jours) : pastille du bouton « Filtres ». */
  function filterBadge() {
    var n = (S.filter.wilaya ? 1 : 0) + (S.filter.period && S.filter.period !== '30' ? 1 : 0);
    return n ? '<span class="chip-badge">' + n + '</span>' : '';
  }

  /** Téléphone : wilaya, période, sélection de plusieurs commandes, dans une feuille en bas de l'écran. */
  function filtersSheet() {
    var f = S.filter;
    var periods = [['today', 'Aujourd’hui'], ['7', '7 jours'], ['30', '30 jours'], ['all', 'Tout']];
    S.sheetFilter = { wilaya: f.wilaya, period: f.period };
    showModal(modalHead('Filtres') +
      '<div class="form-grid" id="sheet-filters">' + field('Wilaya', '<select name="wilaya">' + options(S.boot.wilayas, f.wilaya, 'Toutes les wilayas') + '</select>', 'full') + '</div>' +
      '<p class="small" style="margin:12px 0 6px;font-weight:600">Période</p><div class="chips">' + periods.map(function (p) {
        return '<button type="button" class="chip" data-act="sheet-period" data-p="' + p[0] + '" aria-pressed="' + (f.period === p[0]) + '">' + p[1] + '</button>';
      }).join('') + '</div>' +
      (S.boot.user.admin ? '<p class="small" style="margin:14px 0 6px;font-weight:600">Autres</p><div class="chips">' +
        '<button type="button" class="chip" data-act="sheet-trash">Corbeille</button>' +
        '<button type="button" class="chip" data-act="sheet-select" aria-pressed="' + !!S.selMode + '">' + icon('check') + 'Sélectionner plusieurs</button></div>' : '') +
      '<div class="modal-actions"><button type="button" class="btn" data-act="sheet-clear">Effacer</button><button type="button" class="btn primary" data-act="sheet-apply">Voir les commandes</button></div>');
    var m = $('#modal-root .modal');
    if (m) m.classList.add('sheet');
  }
  function applySheet(close) {
    var sel = $('#sheet-filters [name="wilaya"]');
    S.filter.wilaya = sel ? sel.value : S.filter.wilaya;
    S.filter.period = S.sheetFilter.period;
    S.filter.limit = 100;
    if (close) closeModal();
    var w = $('#f-wilaya'); if (w) w.value = S.filter.wilaya;
    var pe = $('#f-period'); if (pe) pe.value = S.filter.period;
    var fc = $('.filters-chip');
    if (fc) fc.innerHTML = icon('filter') + 'Filtres' + filterBadge();
    loadOrders();
  }

  /** Le filtre d'une liste (sans les options d'ouverture de page). */
  function listKey() { return JSON.stringify(listArgs(false)); }

  /* Arrivée automatique des commandes (Releasit, Shopify) : état, et transfert à la demande. */
  function statusCard(inner) {
    return '<div class="card" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px;padding:12px 16px">' + inner + '</div>';
  }
  /** Petite ligne d'état (arrivée des commandes, SMS) : discrète, avec son action en lien. */
  function srcLine(ok, inner, act, actLabel) {
    return '<div class="src-line"><span class="src-dot ' + (ok ? 'ok' : 'warn') + '"></span><span>' + inner + '</span>' +
      (act ? ' · <button type="button" class="link-btn" data-act="' + act + '">' + h(actLabel) + '</button>' : '') + '</div>';
  }

  function loadShopStatus() {
    call('api_importStatus').then(renderShopStatus).catch(function () {});
  }

  function renderShopStatus(st) {
    (function () {
      var box = $('#shop-status');
      if (!box || S.route !== 'commandes') return;
      var r = st.releasit;
      var s = st.shopify;
      var html = '';
      if (r.found) {
        html += srcLine(!r.lastError, '<strong>Releasit</strong>' + (r.lastRun ? ' · ' + h(ago(r.lastRun)) : ''), 'releasit-transfer', 'transférer');
        if (r.missing.length) {
          html += '<div class="error-box" role="alert" style="margin-bottom:14px;background:#FFF3DC;color:#8A5200">Onglet RELEASIT : colonne(s) absente(s) : ' +
            h(r.missing.join(', ')) + '. Ajoutez-les dans les réglages Google Sheets de Releasit.</div>';
        }
        if (r.lastError) html += '<div style="margin-bottom:14px">' + errorBox(r.lastError) + '</div>';
      }
      if (s.configured) {
        html += srcLine(!s.lastError, '<strong>Shopify</strong>' + (s.lastRun ? ' · ' + h(ago(s.lastRun)) : ''), 'shop-import', 'importer') +
          (s.lastError ? '<div style="margin-bottom:14px">' + errorBox(s.lastError) + '</div>' : '');
      }
      var sm = st.sms;
      if (sm && sm.configured) {
        html += srcLine(!sm.lastError, '<strong>SMS</strong> · ' + (sm.waiting ? sm.waiting + ' en attente' : '0 en attente') +
          help('SMS envoyés depuis le ' + h(sm.from) + '. Statuts avec SMS : ' + h(sm.statuses.join(', ') || 'aucun') + '. Les textes se modifient dans Administration › Réglages › SMS.'),
          S.boot.user.admin && sm.waiting ? 'sms-send' : '', 'envoyer') +
          (sm.lastError ? '<div style="margin-bottom:14px">' + errorBox(sm.lastError) + '</div>' : '');
      }
      if (!r.found && !s.configured) {
        html += statusCard('<span class="muted">Les commandes n’arrivent pas encore automatiquement. Connectez Releasit COD à un onglet <strong>RELEASIT</strong> du classeur, ' +
          'ou connectez Shopify (dans le classeur, sur ordinateur : menu <strong>DZ Smart Shop</strong>).</span>');
      }
      box.innerHTML = html;
    })();
  }

  function loadOrders(first) {
    var t = ++S.token;
    if (S.filter.status === 'trash' && !String(S.filter.q || '').trim()) { loadTrash(t); return; }
    var key = listKey();
    syncStart();
    call('api_listOrders', listArgs(first)).then(function (res) {
      syncEnd();
      if (t !== S.token || S.route !== 'commandes') return;
      S.list = res;
      S.listKey = key;
      perfDone('commandes');
      renderChips(res.counts);
      renderOrderList(res);
      if (res.importStatus) renderShopStatus(res.importStatus);
      if (res.arrived) { toast(arrivedText(res.arrived)); if (res.menuCounts) applyCounts(res.menuCounts); }
    }).catch(function (e) {
      syncEnd();
      if (t === S.token) $('#orders-list').innerHTML = errorBox(e);
    });
  }

  /** Corbeille (administrateur) : commandes supprimées, avec « Restaurer ». */
  function loadTrash(t) {
    $('#orders-list').innerHTML = '<p class="loading">Chargement…</p>';
    call('api_listTrash').then(function (res) {
      if (t !== S.token || S.route !== 'commandes') return;
      renderChips(S.list ? S.list.counts : {});
      var box = $('#orders-list');
      if (!res.rows.length) { box.innerHTML = '<div class="card"><p class="empty">La corbeille est vide.</p></div>'; return; }
      var ids = res.rows.map(function (o) { return o.id; });
      var keep = {};
      ids.forEach(function (id) { if (S.sel.trash[id]) keep[id] = true; });
      S.sel.trash = keep;
      box.innerHTML = '<div class="list-tools"><p class="small grow"><strong>Corbeille</strong>' + help('Commandes supprimées avec le bouton « Supprimer » (aussi dans l’onglet <strong>Corbeille</strong> du classeur). Releasit et Shopify ne les font pas revenir.') +
        (res.autoDays ? ' Effacées automatiquement après ' + res.autoDays + ' jours.' : '') + '</p>' +
        '<label class="small sel-all">' + selAllBox('trash', ids) + ' Tout cocher (' + ids.length + ')</label>' +
        '<button type="button" class="btn danger" style="min-height:36px" data-act="trash-purge-ask" data-scope="all">' + icon('trash') + 'Vider la corbeille</button></div>' +
        '<div class="table-wrap"><table class="data cards"><thead><tr><th scope="col" class="sel">' + selAllBox('trash', ids) + '</th>' +
        ['N°', 'Client', 'Produit', 'Total', 'Statut', 'Supprimée', ''].map(function (t) { return '<th scope="col">' + t + '</th>'; }).join('') + '</tr></thead><tbody>' +
        res.rows.map(function (o) {
          return '<tr>' + selCell('trash', o.id) +
            '<td data-label="N°" class="multi">' + h(o.id) + '<div class="small">' + fmtDate(o.date) + '</div></td>' +
            '<td data-label="Client" class="multi">' + h(o.client) + '<div class="small">' + h(fmtPhone(o.phone)) + '</div></td>' +
            '<td data-label="Produit">' + h(o.product) + '</td><td data-label="Total" class="num">' + money(o.total) + '</td><td data-label="Statut">' + pill(o.status) + '</td>' +
            '<td data-label="Supprimée" class="multi">' + h(fmtDate(o.deletedAt)) + '<div class="small">par ' + h(o.deletedBy || '—') + (o.reason ? ' · ' + h(o.reason) : '') + '</div></td>' +
            '<td data-label=""><button type="button" class="btn" style="min-height:36px" data-act="trash-restore" data-id="' + h(o.id) + '">' + icon('return') + 'Restaurer</button></td></tr>';
        }).join('') + '</tbody></table></div>' + bulkBar('trash');
    }).catch(function (e) {
      if (t === S.token) $('#orders-list').innerHTML = errorBox(e);
    });
  }

  function renderChips(counts) {
    if (String(S.filter.q || '').trim()) {
      $('#chips').innerHTML = '<span class="small">Recherche dans toutes les commandes (toutes les pages) · ' + plural(counts.all || 0, 'résultat', 'résultats') + '</span>';
      return;
    }
    var list = [['todo', 'À traiter']].concat(TODO_STATUSES.map(function (s) { return [s, s]; }));
    var chip = function (c, n) {
      return '<button type="button" class="chip" data-act="chip" data-status="' + h(c[0]) + '" aria-pressed="' + (S.filter.status === c[0]) + '">' +
        h(c[1]) + (n === null ? '' : ' · ' + (n || 0)) + '</button>';
    };
    $('#chips').innerHTML = list.filter(function (c) {
      return c[0] === 'todo' || c[0] === S.filter.status || counts[c[0]];
    }).map(function (c) { return chip(c, counts[c[0]]); }).join('') +
      '<span class="chip-sep" aria-hidden="true"></span>' +
      chip(['Annulée', 'Annulées'], counts['Annulée']) +
      (S.boot.user.admin ? chip(['trash', 'Corbeille'], null) : '');
  }

  function renderOrderList(res) {
    var box = $('#orders-list');
    if (!res.rows.length) {
      box.innerHTML = '<div class="card"><p class="empty">Aucune commande ne correspond à ces filtres.</p></div>';
      return;
    }
    var head = ['N°', 'Client', 'Wilaya', 'Produit', 'Total', 'Statut', 'Alerte', 'Livraison'];
    var selOn = S.boot.user.admin && S.selMode;
    var ids = res.rows.map(function (o) { return o.id; });
    var html = S.boot.user.admin ? '<div class="list-tools' + (selOn ? ' sel-on' : '') + '"><button type="button" class="btn" style="min-height:36px" data-act="sel-mode" aria-pressed="' + !!selOn + '">' + icon('check') + (selOn ? 'Terminer la sélection' : 'Sélectionner plusieurs') + '</button>' +
      (selOn ? '<label class="small sel-all">' + selAllBox('orders', ids) + ' Tout cocher (' + ids.length + ')</label>' : '') + '</div>' : '';
    html += '<div class="table-wrap"><table class="data cards"><thead><tr>' + (selOn ? '<th scope="col" class="sel">' + selAllBox('orders', ids) + '</th>' : '') + head.map(function (t) {
      return '<th scope="col">' + t + '</th>';
    }).join('') + '</tr></thead><tbody>';
    res.rows.forEach(function (o) {
      var stc = (S.boot.styles[o.status] || {}).fg || '#CFD4DB';
      html += '<tr class="clickable compact' + (selOn ? ' selectable' : '') + '" style="--st:' + stc + '" data-act="open-order" data-id="' + h(o.id) + '">' +
        (selOn ? selCell('orders', o.id) : '') +
        '<td class="m-sum" data-label=""><span class="l1"><span>' + (selOn ? '<span data-stop class="m-sel">' + selBox('orders', o.id) + '</span>' : '') + '<span dir="auto">' + h(o.client || '—') + '</span></span><span class="num">' + money(o.total) + '</span></span>' +
          '<span class="l2">' + pill(o.status) + '<span>' + h(wilayaName(o.wilaya)) + '</span><span>· ' + h(o.id) + '</span>' +
          (o.locked ? '<span class="lock-icon">' + icon('lock') + '</span>' : '') +
          (o.alertLevel === 'bad' || o.alertLevel === 'warn' ? alertPill(o.alert, o.alertLevel) : '') +
          (o.status === 'Annulée' && o.cancelReason ? '<span style="color:#A12626">Motif : ' + h(o.cancelReason) + '</span>' : '') + '</span>' +
          '<span class="l3"><span>' + h(o.product || '') + (o.qty > 1 ? ' ×' + o.qty : '') + '</span>' + (o.date ? '<span class="ago">' + h(ago(o.date)) + '</span>' : '') + '</span></td>' +
        '<td data-label="N°" class="multi"><button type="button" class="link-btn" data-act="open-order" data-id="' + h(o.id) + '">' + h(o.id) + '</button>' +
          (o.locked ? ' <span class="lock-icon" title="Verrouillée" aria-label="Verrouillée">' + icon('lock') + '</span>' : '') + '<div class="small">' + fmtDate(o.date) + '</div></td>' +
        '<td data-label="Client" class="multi"><span dir="auto">' + h(o.client) + '</span><div class="small">' + h(fmtPhone(o.phone)) + '</div></td>' +
        '<td data-label="Wilaya" class="multi">' + h(o.wilaya) + '<div class="small" dir="auto">' + h(o.commune) + '</div></td>' +
        '<td data-label="Produit">' + h(o.product) + (o.qty > 1 ? ' ×' + o.qty : '') + '</td>' +
        '<td data-label="Total" class="num strong">' + money(o.total) + '</td>' +
        '<td data-label="Statut">' + pill(o.status) +
          (o.status === 'Annulée' && o.cancelReason ? '<div class="small strong" style="color:#A12626">Motif : ' + h(o.cancelReason) + '</div>' : '') +
          (PAGE_LABELS[o.page] && S.filter.status !== 'Annulée' ? '<div class="small">→ ' + PAGE_LABELS[o.page] + '</div>' : '') + '</td>' +
        '<td data-label="Alerte">' + alertPill(o.alert, o.alertLevel) + '</td>' +
        '<td data-label="Livraison" class="multi">' + h(o.mode) + '<div class="small">' + h([o.carrier, o.tracking].filter(Boolean).join(' · ')) + '</div></td>' +
      '</tr>';
    });
    html += '</tbody></table></div>';
    html += '<p class="small" style="margin-top:10px">' + res.rows.length + ' sur ' + res.total + ' commande(s)</p>';
    if (res.total > res.rows.length) html += '<p style="margin-top:10px"><button type="button" class="btn" data-act="more">Afficher plus</button></p>';
    if (selOn) html += bulkBar('orders');
    box.innerHTML = html;
  }

  BULK.orders = function (n) {
    return '<button type="button" class="btn danger" data-act="orders-trash-ask"' + (n ? '' : ' disabled') + '>' + icon('trash') + 'Mettre à la corbeille (' + n + ')</button>';
  };
  BULK.trash = function (n) {
    return '<button type="button" class="btn" data-act="trash-restore-sel"' + (n ? '' : ' disabled') + '>' + icon('return') + 'Restaurer (' + n + ')</button>' +
      '<button type="button" class="btn danger" data-act="trash-purge-ask" data-scope="sel"' + (n ? '' : ' disabled') + '>' + icon('trash') + 'Supprimer définitivement (' + n + ')</button>';
  };

  function askTrashOrders() {
    var ids = selIds('orders');
    if (!ids.length) return;
    showModal(modalHead('Mettre à la corbeille') +
      '<p>' + plural(ids.length, 'commande cochée', 'commandes cochées') + ' : <span class="small">' + h(ids.slice(0, 12).join(', ')) + (ids.length > 12 ? '…' : '') + '</span></p>' +
      '<p class="small" style="margin-top:6px">Les commandes déjà envoyées à une société de livraison sont protégées : elles seront ignorées. Vous pourrez restaurer les autres depuis la Corbeille.</p>' +
      '<div style="height:10px"></div>' + field('Motif (facultatif)', input('bulkReason', '', ' id="bulk-reason" placeholder="Ex. commandes test"'), 'full') +
      '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Retour</button>' +
      '<button type="button" class="btn danger" data-act="orders-trash">' + icon('trash') + 'Mettre à la corbeille (' + ids.length + ')</button></div>');
  }

  function trashOrdersSel(btn) {
    var ids = selIds('orders');
    var reason = ($('#bulk-reason') || {}).value || '';
    btn.disabled = true;
    call('api_deleteOrders', ids, reason).then(function (r) {
      closeModal();
      toast(r.message, !r.deleted.length);
      r.deleted.forEach(function (id) { delete S.sel.orders[id]; });
      if (r.counts) applyCounts(r.counts);
      S.list = null;
      loadOrders();
    }).catch(function (e) { btn.disabled = false; toast(errText(e), true); });
  }

  function askPurgeTrash(el) {
    var all = el.getAttribute('data-scope') === 'all';
    var ids = all ? [] : selIds('trash');
    if (!all && !ids.length) return;
    showModal(modalHead(all ? 'Vider la corbeille' : 'Supprimer définitivement') +
      '<p>' + (all ? 'Toutes les commandes de la corbeille' : plural(ids.length, 'commande cochée', 'commandes cochées')) + ' seront <strong>effacées pour de bon</strong>. Impossible de les restaurer ensuite.</p>' +
      '<p class="small" style="margin-top:6px">Leur n° reste bloqué : Releasit et Shopify ne les feront pas revenir.</p>' +
      '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Retour</button>' +
      '<button type="button" class="btn danger" data-act="trash-purge" data-scope="' + (all ? 'all' : 'sel') + '">' + icon('trash') + (all ? 'Vider la corbeille' : 'Effacer (' + ids.length + ')') + '</button></div>');
  }

  function purgeTrash(el) {
    var all = el.getAttribute('data-scope') === 'all';
    el.disabled = true;
    (all ? call('api_purgeTrash') : call('api_purgeTrash', selIds('trash'))).then(function (r) {
      closeModal();
      toast(r.message);
      S.sel.trash = {};
      loadOrders();
    }).catch(function (e) { el.disabled = false; toast(errText(e), true); });
  }

  function restoreTrashSel(el) {
    el.disabled = true;
    call('api_restoreOrders', selIds('trash')).then(function (r) {
      toast(r.message, !r.restored.length);
      S.sel.trash = {};
      S.list = null;
      loadOrders();
    }).catch(function (e) { el.disabled = false; toast(errText(e), true); });
  }

  /* ---------------- Sélection en plusieurs (commandes, corbeille, dépenses) ---------------- */

  function selIds(g) { return Object.keys(S.sel[g] || (S.sel[g] = {})); }
  function selBox(g, id) {
    S.sel[g] = S.sel[g] || {};
    return '<input type="checkbox" class="sel-box" data-sel="' + g + '" value="' + h(id) + '"' + (S.sel[g][id] ? ' checked' : '') + ' aria-label="Sélectionner ' + h(id) + '">';
  }
  function selCell(g, id) { return '<td class="sel" data-stop data-label="Sélectionner">' + selBox(g, id) + '</td>'; }
  function selAllBox(g, ids) {
    S.sel[g] = S.sel[g] || {};
    var all = ids.length > 0 && ids.every(function (i) { return S.sel[g][i]; });
    return '<input type="checkbox" class="sel-box" data-sel-all="' + g + '" data-ids="' + h(ids.join('\n')) + '"' + (all ? ' checked' : '') + ' aria-label="Tout sélectionner">';
  }
  function bulkInner(g) {
    var n = selIds(g).length;
    return '<span class="strong">' + plural(n, 'sélectionnée', 'sélectionnées') + '</span>' + (BULK[g] ? BULK[g](n) : '') +
      '<button type="button" class="btn" data-act="sel-clear" data-group="' + g + '">Tout décocher</button>';
  }
  function bulkBar(g) { return '<div class="bulk-bar" data-bulk="' + g + '"' + (selIds(g).length ? '' : ' hidden') + '>' + bulkInner(g) + '</div>'; }
  function refreshSel(g) {
    $all('input[data-sel="' + g + '"]').forEach(function (x) { x.checked = !!S.sel[g][x.value]; });
    $all('input[data-sel-all="' + g + '"]').forEach(function (x) {
      var ids = x.getAttribute('data-ids').split('\n').filter(Boolean);
      x.checked = ids.length > 0 && ids.every(function (i) { return S.sel[g][i]; });
    });
    $all('[data-bulk="' + g + '"]').forEach(function (b) { b.hidden = !selIds(g).length; b.innerHTML = bulkInner(g); });
  }
  function clearSel(g) { S.sel[g] = {}; refreshSel(g); }

  /* ---------------- Fenêtre de commande ---------------- */

  function showModal(html) {
    $('#modal-root').innerHTML = '<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">' + html + '</div></div>';
    var first = $('#modal-root input, #modal-root select, #modal-root button');
    if (first) first.focus();
  }
  function closeModal() { $('#modal-root').innerHTML = ''; }
  function modalOpen() { return !!$('#modal-root .modal'); }
  function modalHead(title, extra) {
    return '<div class="modal-head"><div><h2 id="modal-title" style="font:700 20px var(--font-title)">' + title + '</h2>' + (extra || '') + '</div>' +
      '<button type="button" class="icon-btn" data-act="close-modal" aria-label="Fermer">×</button></div>';
  }

  /* ---------------- v1.13 : communes d'Ecotrack (version Cloudflare) ---------------- */

  /** La liste des communes d'Ecotrack, reçue sur l'appareil (version Cloudflare), ou null. */
  function CM() { var c = window.DZ_CLOUD && window.DZ_CLOUD.communes; return c && c.ready() ? c : null; }
  function wCode(w) { var m = String(w || '').match(/^0*(\d{1,2})\b/); return m ? +m[1] : 0; }
  /** La liste s'applique aux commandes envoyées par Ecotrack ; pour une autre société, la commune reste libre. */
  function communeListOn(carrier) { return !!CM() && (carrier || S.boot.defaultCarrier) === 'Ecotrack'; }
  /** État de la commune : { c: commune d'Ecotrack ou null, n: nombre de communes de la wilaya }, ou null (liste pas utilisée). */
  function communeState(wilaya, commune, carrier) {
    if (!communeListOn(carrier)) return null;
    var w = wCode(wilaya);
    var n = w ? CM().list(w).length : 0;
    return n ? { w: w, n: n, c: CM().find(w, commune) } : null;
  }
  /** Case « Commune » : le choix dans la liste d'Ecotrack (avec recherche), ou une case libre. */
  function communeField(o) {
    return field('Commune', '<span class="cm-box">' + communeInner(o.wilaya, o.commune, o.carrier) + '</span>');
  }
  function communeInner(wilaya, commune, carrier) {
    commune = String(commune == null ? '' : commune);
    if (!communeListOn(carrier)) return input('commune', commune, ' dir="auto"');
    var w = wCode(wilaya);
    var st = communeState(wilaya, commune, carrier);
    var c = st && st.c;
    if (c) commune = c.n; // écrite autrement (en arabe, sans accents) : enregistrée avec le nom d'Ecotrack
    var label = c ? '<span>' + h(c.n) + '</span>' + (c.a ? '<span class="ar">' + h(c.a) + '</span>' : '')
      : commune ? '<span dir="auto">' + h(commune) + '</span>' : '<span class="cm-ph">' + (w ? 'Choisir la commune' : 'Choisissez d’abord la wilaya') + '</span>';
    var hint = !st ? '' : c ? '<span class="cm-hint ok">' + icon('check') + 'Liste officielle d’Ecotrack · ' + st.n + ' communes' + (c.s ? ' <span class="cm-tag">🏢 Bureau stop desk</span>' : '') + '</span>'
      : commune ? '<span class="cm-hint bad">' + icon('alert') + 'Pas dans la liste d’Ecotrack : choisissez la commune</span>' : '';
    return '<input type="hidden" name="commune" value="' + h(commune) + '">' +
      '<button type="button" class="cm-pick' + (c || !commune ? '' : ' bad') + '" data-act="commune-pick"' + (st ? '' : ' disabled') + '>' + label + '<span class="chev">▾</span></button>' + hint;
  }
  /** Redessine la case Commune d'un formulaire (wilaya ou société changée, commune choisie). */
  function refreshCommune(form, value) {
    var box = form && form.querySelector('.cm-box');
    if (!box) return;
    var get = function (n) { var el = form.querySelector('[name="' + n + '"]'); return el ? el.value : ''; };
    box.innerHTML = communeInner(get('wilaya'), value === undefined ? get('commune') : value, get('carrier'));
  }
  function setCommune(form, name) {
    if (!form) return;
    refreshCommune(form, name);
    var el = form.querySelector('[name="commune"]');
    if (el) el.dispatchEvent(new Event('input', { bubbles: true }));
  }
  /** Feuille « Commune » : les communes de la wilaya, recherche en français ou en arabe. */
  function communeSheet(wilaya, current, onPick) {
    var w = wCode(wilaya);
    if (!CM() || !w) return;
    closeCommuneSheet();
    var root = document.createElement('div');
    root.id = 'cm-root';
    root.innerHTML = '<div class="cm-bg" data-act="cm-close"></div><div class="cm-sheet" role="dialog" aria-modal="true" aria-labelledby="cm-title">' +
      '<div class="cm-grab"></div><div class="cm-head"><h2 id="cm-title">Commune · ' + h(wilaya) + '</h2>' +
      '<button type="button" class="icon-btn" data-act="cm-close" aria-label="Fermer">×</button></div>' +
      '<label class="cm-search">' + icon('search') + '<input type="search" id="cm-q" placeholder="Nom de la commune (français ou arabe)" autocomplete="off" aria-label="Rechercher une commune"></label>' +
      '<p class="small" id="cm-count"></p><div class="cm-list" id="cm-list"></div>' +
      '<p class="small cm-legend">🏢 Bureau : un bureau stop desk Ecotrack dans la commune.</p></div>';
    document.body.appendChild(root);
    S.cmPick = { w: w, wilaya: wilaya, current: current, onPick: onPick };
    renderCommuneList('');
    setTimeout(function () { var q = $('#cm-q'); if (q && !isPhone()) q.focus(); }, 30);
  }
  function renderCommuneList(q) {
    var p = S.cmPick;
    var cm = CM();
    if (!p || !cm || !$('#cm-list')) return;
    var all = cm.list(p.w);
    var list = cm.search(p.w, q);
    var cur = cm.find(p.w, p.current);
    $('#cm-count').textContent = (String(q || '').trim() ? list.length + ' sur ' : '') + plural(all.length, 'commune', 'communes') + ' · en français ou en arabe';
    $('#cm-list').innerHTML = list.map(function (c) {
      var on = cur && cur.n === c.n;
      return '<button type="button" class="cm-row' + (on ? ' on' : '') + '" data-act="cm-choose" data-name="' + h(c.n) + '">' + (on ? '<span class="ok">✓</span>' : '') +
        '<b>' + h(c.n) + '</b>' + (c.s ? '<span class="cm-tag">🏢 Bureau</span>' : '') + '<span class="ar">' + h(c.a || '') + '</span></button>';
    }).join('') +
      (String(q || '').trim() && !list.length ? '<p class="small cm-none">Aucune commune « ' + h(q) + ' » dans cette wilaya. Vérifiez la wilaya.</p>' : '') +
      (String(q || '').trim() && !list.length ? '<button type="button" class="cm-row cm-free" data-act="cm-choose" data-name="' + h(String(q).trim()) + '">Écrire « ' + h(String(q).trim()) + ' » (hors liste : Ecotrack refusera le colis)</button>' : '');
  }
  function closeCommuneSheet() { var r = $('#cm-root'); if (r) r.remove(); S.cmPick = null; }
  /** Fiche résumée : la commune d'Ecotrack avec son nom arabe, ou « à vérifier ». */
  function communeText(o) {
    var st = communeState(o.wilaya, o.commune, o.carrier);
    if (!o.commune) return '';
    if (!st) return '<span dir="auto">' + h(o.commune) + '</span>';
    return st.c ? h(st.c.n) + (st.c.a ? ' <span class="muted">· ' + h(st.c.a) + '</span>' : '')
      : '<span dir="auto">' + h(o.commune) + '</span> <span class="pill cm-pill">Commune à vérifier</span>';
  }

  /** Les cases d'une commande, une par une (ordinateur : une grille ; téléphone : des blocs). */
  function orderFieldMap(o) {
    var b = S.boot;
    return {
      client: field('Client', input('client', o.client)),
      phone: field('Téléphone', input('phone', o.phone, ' inputmode="tel"')),
      wilaya: field('Wilaya', '<select name="wilaya">' + options(b.wilayas, o.wilaya, 'Choisir…') + '</select>'),
      commune: communeField(o),
      address: field('Adresse', input('address', o.address), 'full'),
      product: field('Produit', input('product', o.product, ' list="product-list"')),
      qty: field('Quantité', input('qty', o.qty || 1, ' type="number" min="1" step="1"')),
      price: field('Prix des produits (DA)', input('price', o.price || '', ' type="number" min="0" step="10"')),
      mode: field('Livraison', '<select name="mode">' + options(b.modes, o.mode || b.modes[0]) + '</select>'),
      carrier: field('Société', '<select name="carrier">' + options(b.carriers, o.carrier, 'Par défaut (' + b.defaultCarrier + ')') + '</select>'),
      shipping: field('Frais de livraison (DA)', input('shipping', o.shipping === null || o.shipping === undefined ? '' : o.shipping, ' type="number" min="0" step="10" placeholder="Calcul automatique"')),
      tracking: o.id ? field('N° de suivi', input('tracking', o.tracking)) : '',
      notes: field('Notes', '<textarea name="notes">' + h(o.notes) + '</textarea>', 'full')
    };
  }
  function productList() {
    return '<datalist id="product-list">' + S.boot.products.map(function (p) { return '<option value="' + h(p.name) + '">'; }).join('') + '</datalist>';
  }
  function orderFields(o) {
    var f = orderFieldMap(o);
    return '<div class="form-grid">' +
      ['client', 'phone', 'wilaya', 'commune', 'address', 'product', 'qty', 'price', 'mode', 'carrier', 'shipping', 'tracking', 'notes'].map(function (k) { return f[k]; }).join('') +
      '</div>' + productList();
  }

  /* Fiche d'une commande : affichée tout de suite (dernière fiche reçue, ou la ligne de la liste), puis mise à jour. */
  S.orderCache = {}; // n° → { data, at } : fiches déjà reçues (10 minutes)
  function listRow(id) {
    var rows = S.list && S.list.rows ? S.list.rows : [];
    for (var i = 0; i < rows.length; i++) if (rows[i].id === id) return rows[i];
    return null;
  }
  /** Aperçu en lecture seule, le temps que la fiche complète arrive. */
  function orderPreview(o) {
    return modalHead('Commande ' + h(o.id), '<p style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">' + pill(o.status) + alertPill(o.alert, o.alertLevel) + '</p>') +
      '<span hidden data-order-modal="' + h(o.id) + '"></span>' +
      '<div class="money-lines" style="max-width:none">' +
      '<div><span>Client</span><span>' + h(o.client || '—') + ' · ' + h(fmtPhone(o.phone)) + '</span></div>' +
      '<div><span>Livraison</span><span>' + h(wilayaName(o.wilaya)) + (o.commune ? ' · ' + h(o.commune) : '') + ' · ' + h(o.mode || '') + '</span></div>' +
      '<div><span>Produit</span><span>' + h(o.product || '—') + (o.qty > 1 ? ' ×' + o.qty : '') + '</span></div>' +
      '<div class="total"><span>Total</span><span>' + money(o.total) + '</span></div></div>' +
      '<p class="loading" style="padding:14px 0">Chargement de la fiche…</p>';
  }
  function orderModalShown(id) { return !!$('#modal-root [data-order-modal="' + String(id).replace(/"/g, '') + '"]'); }

  function openOrder(id) {
    S.unlockId = null;
    S.orderDirty = false;
    S.orderEdit = null;
    var c = S.orderCache[id];
    var fresh = c && Date.now() - c.at < 10 * 60000;
    if (fresh) renderOrderModal(c.data);
    else {
      var row = listRow(id);
      showModal(row ? orderPreview(row) : modalHead('Commande ' + h(id)) + '<span hidden data-order-modal="' + h(id) + '"></span><p class="loading">Chargement…</p>');
    }
    syncStart();
    call('api_getOrder', id).then(function (data) {
      syncEnd();
      S.orderCache[id] = { data: data, at: Date.now() };
      if (!orderModalShown(id)) return; // fenêtre fermée ou remplacée entre-temps
      // Déjà affichée et rien n'a changé, ou saisie en cours : on ne redessine pas (rien n'est effacé).
      if (fresh && (S.orderDirty || JSON.stringify(c.data) === JSON.stringify(data))) { S.order = data; return; }
      renderOrderModal(data);
    }).catch(function (e) {
      syncEnd();
      if (!fresh && orderModalShown(id)) showModal(modalHead('Commande ' + h(id)) + errorBox(e));
    });
  }

  /**
   * Téléphone (v1.12) : la fiche en résumé lisible (client, livraison, produit, total, appels),
   * avec Appeler, WhatsApp et Modifier toujours visibles en bas de l'écran.
   */
  function orderSummary(data, r) {
    var o = data.order;
    var hist = data.history;
    var wa = waLink(o.phone);
    var calls = String(o.callLog || '').split('|').map(function (x) { return x.trim(); }).filter(Boolean).map(function (raw) {
      var m = raw.match(/^(\d{2}\/\d{2} \d{2}:\d{2}) (.*)$/);
      return { when: m ? m[1] : '', text: m ? m[2] : raw };
    }).reverse();
    var histText = hist.orders
      ? plural(hist.orders, 'autre commande', 'autres commandes') + ' : ' + hist.delivered + ' livrée' + (hist.delivered > 1 ? 's' : '') + ', ' +
        hist.returned + ' retour' + (hist.returned > 1 ? 's' : '') + ', ' + hist.cancelled + ' annulée' + (hist.cancelled > 1 ? 's' : '')
      : 'Première commande avec ce numéro';
    var line = function (lab, val) { return val ? '<div class="brief-line"><span class="lab">' + lab + '</span><span>' + val + '</span></div>' : ''; };
    var photo = productPhoto(data.stock);
    var meta = ['Reçue ' + ago(o.date), o.source, o.attempts ? plural(o.attempts, 'appel', 'appels') : '', o.agent ? 'par ' + o.agent : ''].filter(Boolean).map(h).join(' · ');
    var more = (data.phoneValid ? '<button type="button" class="btn ' + (data.blacklisted ? '' : 'danger') + '" data-act="toggle-blacklist" data-phone="' + h(o.phone) + '" data-on="' + (!data.blacklisted) + '">' +
        (data.blacklisted ? 'Retirer de la liste noire' : 'Mettre en liste noire') + '</button>' : '') +
      (r.canDelete ? '<button type="button" class="btn danger" data-act="order-delete-ask" data-id="' + h(o.id) + '">' + icon('trash') + 'Supprimer</button>' : '');
    showModal(
      '<div class="of-head"><button type="button" class="icon-btn" data-act="close-modal" aria-label="Retour">' + icon('back') + '</button>' +
      '<h2 id="modal-title">Commande ' + h(o.id) + '</h2>' +
      (more ? '<button type="button" class="icon-btn" data-act="of-more" aria-label="Autres actions">⋯</button>' : '<span></span>') + '</div>' +
      '<span hidden data-order-modal="' + h(o.id) + '"></span>' +
      (more ? '<div class="of-more" id="of-more" hidden>' + more + '</div>' : '') +
      '<div class="of-pills">' + pill(o.status) + alertPill(o.alert, o.alertLevel) + (o.status === 'Annulée' && o.cancelReason ? '<span class="small">Motif : ' + h(o.cancelReason) + '</span>' : '') + '</div>' +
      '<p class="small of-meta">' + meta + '</p>' +
      '<section class="of-card"><div class="of-client"><div><b dir="auto">' + h(o.client || '—') + '</b>' +
        '<a class="of-phone" href="tel:' + h(o.phone) + '" target="_top">' + h(fmtPhone(o.phone)) + '</a></div>' +
        (o.phone ? '<button type="button" class="btn of-copy" data-act="copy-text" data-text="' + h(o.phone) + '">Copier</button>' : '') + '</div>' +
        '<p class="small' + (hist.returned || hist.cancelled ? ' of-warn' : '') + '">' + h(histText) + '</p></section>' +
      (o.tracking ?
        '<div class="history" style="background:#F4F5F7;margin-bottom:0"><span class="strong">Colis Ecotrack</span><span class="mono">' + h(o.tracking) + '</span>' +
        '<span>' + (o.carrierLabel ? h(o.carrierLabel) : 'statut pas encore lu') + (o.carrierMoved ? ' · mouvement ' + h(ago(o.carrierMoved)) : '') + '</span>' +
        '<button type="button" class="btn" style="min-height:36px;margin-left:auto" data-act="track-history" data-id="' + h(o.id) + '">Voir la chronologie</button></div>' +
        '<div id="parcel-history"></div>' : '') +

  /* Verrou : message, et boutons Annuler le colis / Remettre à confirmer / Modifier quand même. */
