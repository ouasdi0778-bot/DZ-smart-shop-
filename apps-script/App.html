        '<td data-label="Bordereau" class="multi">' + labelBadge(o.label) + '</td>' +
        '<td data-label="Créé depuis">' + h(hoursText(o.ageHours)) + (o.late ? ' <span class="pill" style="background:#FFF3DC;color:#8A5200">à valider</span>' : '') + '</td>' +
        '<td data-label="Total" class="num strong">' + money(o.total) + '</td>' +
        '<td data-label=""><button type="button" class="btn danger" style="min-height:36px" data-act="parcel-cancel-ask" data-from="ship" data-id="' + h(o.id) + '" data-tracking="' + h(o.tracking) + '">Annuler le colis</button></td></tr>';
    });
    return html + '</tbody></table></div>' +
      (d.canValidate ? '' : '<p class="small">La validation de l’expédition est réservée à l’administrateur et au magasinier (onglet Équipe).</p>') +
      '<p class="small">Une erreur dans un colis pas encore validé ? « Annuler le colis » le supprime chez Ecotrack : la commande redevient modifiable, puis vous recréez le colis (et réimprimez son bordereau).</p>';
  }

  function pickedCreated() {
    var d = S.ship.data;
    if (!d) return [];
    return d.created.filter(function (o) { return S.ship.created.sel[o.id]; }).map(function (o) { return o.id; });
  }

  /** « Imprimé le … par … », « Pas imprimé » ou « À réimprimer ». */
  function labelBadge(l) {
    l = l || {};
    if (l.reprint) return '<span class="pill" style="background:#FFF3DC;color:#8A5200">À réimprimer</span><div class="small">colis recréé : nouveau n° de suivi</div>';
    if (l.printed) return '<span class="pill" style="background:#DDF0E4;color:#146C2E">🖨 Imprimé</span><div class="small">le ' + h(l.at) + (l.by ? ' · ' + h(l.by) : '') + '</div>';
    return '<span class="pill" style="background:#EEF0F3;color:#3D4350">Pas imprimé</span>';
  }

  /* ---------------- Bordereaux : téléchargement, mise en page, impression ---------------- */

  var LABEL_FORMAT_KEY = 'dz-smart-shop:format-bordereau';
  /** Format de cet appareil (retenu), sinon celui des Paramètres. */
  function labelFormat() {
    var v = '';
    try { v = window.localStorage.getItem(LABEL_FORMAT_KEY) || ''; } catch (e) { v = ''; }
    if (v === 'A4' || v === '10x15') return v;
    return (S.ship.data && S.ship.data.labelFormat) || 'A4';
  }
  function setLabelFormat(v) {
    try { window.localStorage.setItem(LABEL_FORMAT_KEY, v); } catch (e) { /* navigation privée : choix non retenu */ }
  }

  // Outil PDF (pdf-lib), chargé seulement au moment d'imprimer. L'empreinte vérifie que le fichier n'a pas été modifié.
  var PDFLIB_URLS = [
    'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js',
    'https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js'
  ];
  var PDFLIB_SRI = 'sha384-weMABwrltA6jWR8DDe9Jp5blk+tZQh7ugpCsF3JwSA53WZM9/14PjS5LAJNHNjAI';
  var pdfLibLoading = null;
  function loadPdfLib() {
    if (window.PDFLib) return Promise.resolve(window.PDFLib);
    if (pdfLibLoading) return pdfLibLoading;
    var attempt = function (i) {
      return new Promise(function (resolve, reject) {
        var tag = document.createElement('script');
        tag.src = PDFLIB_URLS[i];
        tag.integrity = PDFLIB_SRI;
        tag.crossOrigin = 'anonymous';
        tag.onload = function () { if (window.PDFLib) resolve(window.PDFLib); else reject(new Error('pdf-lib')); };
        tag.onerror = function () { tag.parentNode.removeChild(tag); reject(new Error('pdf-lib')); };
        document.head.appendChild(tag);
      }).catch(function () {
        if (i + 1 < PDFLIB_URLS.length) return attempt(i + 1);
        throw new Error('Impossible de charger l’outil de mise en page des PDF. Vérifiez la connexion internet, puis réessayez.');
      });
    };
    pdfLibLoading = attempt(0).catch(function (e) { pdfLibLoading = null; throw e; });
    return pdfLibLoading;
  }

  function base64Bytes(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  var MM = 72 / 25.4; // points par millimètre
  /** Pose une page de bordereau dans une case, sans la déformer, centrée. */
  function placeLabel(page, emb, x, y, w, hgt, margin) {
    var scale = Math.min((w - 2 * margin) / emb.width, (hgt - 2 * margin) / emb.height);
    var dw = emb.width * scale;
    var dh = emb.height * scale;
    page.drawPage(emb, { x: x + (w - dw) / 2, y: y + (hgt - dh) / 2, width: dw, height: dh });
  }
  function layoutLabels(L, out, pages, format) {
    if (format === '10x15') {
      pages.forEach(function (emb) { placeLabel(out.addPage([100 * MM, 150 * MM]), emb, 0, 0, 100 * MM, 150 * MM, 0); });
      return;
    }
    var W = 210 * MM;
    var H = 297 * MM;
    var grey = L.rgb(0.6, 0.6, 0.6);
    for (var i = 0; i < pages.length; i += 4) {
      var page = out.addPage([W, H]);
      for (var k = 0; k < 4 && i + k < pages.length; k++) {
        placeLabel(page, pages[i + k], (k % 2) * W / 2, H - (Math.floor(k / 2) + 1) * H / 2, W / 2, H / 2, 5 * MM);
      }
      // Traits de coupe
      page.drawLine({ start: { x: W / 2, y: 0 }, end: { x: W / 2, y: H }, thickness: 0.5, color: grey, dashArray: [4, 4] });
      page.drawLine({ start: { x: 0, y: H / 2 }, end: { x: W, y: H / 2 }, thickness: 0.5, color: grey, dashArray: [4, 4] });
    }
  }

  /** Un seul PDF avec tous les bordereaux : { bytes, pages, done, bad }. */
  function buildLabelsPdf(L, files, format) {
    return L.PDFDocument.create().then(function (out) {
      var pages = [];
      var done = [];
      var bad = [];
      var step = files.reduce(function (p, f) {
        return p.then(function () {
          return L.PDFDocument.load(base64Bytes(f.pdf), { ignoreEncryption: true })
            .then(function (src) { return out.embedPdf(src, src.getPageIndices()); })
            .then(function (embedded) { embedded.forEach(function (e) { pages.push(e); }); done.push(f); })
            .catch(function () { f.message = 'PDF d’Ecotrack illisible.'; bad.push(f); });
        });
      }, Promise.resolve());
      return step.then(function () {
        if (!pages.length) return { bytes: null, pages: 0, done: done, bad: bad };
        layoutLabels(L, out, pages, format);
        return out.save().then(function (bytes) { return { bytes: bytes, pages: out.getPageCount(), done: done, bad: bad }; });
      });
    });
  }

  function failedList(failed) {
    if (!failed.length) return '';
    return '<div class="lock-box warn"><p>' + plural(failed.length, 'bordereau non reçu', 'bordereaux non reçus') + ' :</p></div>' +
      failed.map(function (r) {
        return '<div class="result-row"><span class="pill" style="background:#FBE7E7;color:#A12626">Erreur</span>' +
          '<span class="grow"><strong>' + h(r.id) + '</strong>' + (r.client ? ' · ' + h(r.client) : '') +
          '<br><span class="small" style="color:#A12626">' + h(r.message || 'Erreur inconnue') + '</span></span></div>';
      }).join('');
  }

  function printProgress(done, total) {
    var p = total ? Math.round(done / total * 100) : 0;
    showModal(modalHead('Bordereaux') + '<p>Préparation des bordereaux… ' + done + ' / ' + total + '</p>' +
      '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + done + '"><span style="width:' + p + '%"></span></div>');
  }

  /** Télécharge les bordereaux chez Ecotrack (par petits paquets), puis les réunit en un seul PDF. */
  function printLabels(ids) {
    if (S.ship.printing || !ids.length) return;
    var format = labelFormat();
    var per = (S.ship.data && S.ship.data.labelsPerCall) || 6;
    var files = [];
    var failed = [];
    S.ship.printing = true;
    if (S.route === 'expeditions') renderShipping();
    printProgress(0, ids.length);
    var lib = loadPdfLib();
    lib.catch(function () { /* l'erreur est affichée plus bas */ });
    var chunks = [];
    for (var i = 0; i < ids.length; i += per) chunks.push(ids.slice(i, i + per));
    chunks.reduce(function (p, chunk) {
      return p.then(function () {
        return call('api_labelFiles', chunk).then(function (res) {
          res.forEach(function (r) { (r.ok ? files : failed).push(r); });
          printProgress(files.length + failed.length, ids.length);
        });
      });
    }, Promise.resolve()).then(function () {
      if (!files.length) return { bytes: null, pages: 0, done: [], bad: [] };
      return lib.then(function (L) { return buildLabelsPdf(L, files, format); });
    }).then(function (res) {
      S.ship.printing = false;
      if (S.route === 'expeditions') renderShipping();
      failed = failed.concat(res.bad);
      if (!res.bytes) {
        showModal(modalHead('Bordereaux') + '<p>Aucun bordereau n’a pu être préparé.</p>' + failedList(failed) +
          '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Fermer</button></div>');
        return;
      }
      showLabelsReady(res, failed, format);
    }).catch(function (e) {
      S.ship.printing = false;
      if (S.route === 'expeditions') renderShipping();
      showModal(modalHead('Bordereaux') + errorBox(e) + failedList(failed) +
        '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Fermer</button></div>');
    });
  }

  function showLabelsReady(res, failed, format) {
    if (S.ship.pdf && S.ship.pdf.url) URL.revokeObjectURL(S.ship.pdf.url);
    var url = URL.createObjectURL(new Blob([res.bytes], { type: 'application/pdf' }));
    S.ship.pdf = { url: url, marked: false, items: res.done.map(function (f) { return { id: f.id, tracking: f.tracking }; }) };
    var now = new Date();
    var name = 'bordereaux-' + now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2) +
      '-' + ('0' + now.getHours()).slice(-2) + 'h' + ('0' + now.getMinutes()).slice(-2) + '.pdf';
    var tip = format === '10x15'
      ? 'Puis, dans la fenêtre d’impression : papier <strong>100 × 150 mm</strong>, échelle <strong>taille réelle (100 %)</strong>, <strong>aucune marge</strong>.'
      : 'Puis, dans la fenêtre d’impression : papier <strong>A4</strong>, échelle <strong>taille réelle (100 %)</strong>. Découpez ensuite le long des pointillés.';
    showModal(modalHead('Bordereaux prêts') +
      '<p><strong>' + plural(res.done.length, 'bordereau', 'bordereaux') + '</strong> · ' + plural(res.pages, 'page', 'pages') + ' ' +
      (format === '10x15' ? 'étiquette 10×15' : 'A4 (4 par feuille)') + '</p>' +
      '<p class="small" style="margin:8px 0 12px">Le PDF s’ouvre dans un nouvel onglet : cliquez sur l’imprimante (ou Ctrl+P). ' + tip +
      ' Sur téléphone, ouvrez le fichier puis « Imprimer » ou « Partager » vers l’application de l’imprimante.</p>' +
      failedList(failed) +
      '<div class="modal-actions">' +
      '<a class="btn" href="' + h(url) + '" download="' + h(name) + '" data-label-download>Télécharger</a>' +
      '<button type="button" class="btn primary" data-act="labels-open">🖨 Ouvrir et imprimer</button></div>');
  }

  /** Note « imprimé » (une fois par PDF) dès que vous l'ouvrez, l'imprimez ou le téléchargez. */
  function markLabelsPrinted() {
    var pdf = S.ship.pdf;
    if (!pdf || pdf.marked || !pdf.items.length) return;
    pdf.marked = true;
    call('api_markLabelsPrinted', pdf.items).then(function (r) {
      var d = S.ship.data;
      if (d) d.created.forEach(function (o) { if (r.labels[o.id]) o.label = r.labels[o.id]; });
      if (S.route === 'expeditions') renderShipping();
    }).catch(function (e) { pdf.marked = false; toast(errText(e), true); });
  }

  /**
   * Ouvre le PDF dans un nouvel onglet, où le lecteur PDF du navigateur l'imprime.
   * (L'application tourne dans un cadre protégé de Google : un PDF ne s'y affiche pas.)
   */
  function openLabelsPdf() {
    if (!S.ship.pdf) return;
    markLabelsPrinted();
    var win = window.open(S.ship.pdf.url, '_blank');
    if (!win) toast('Le navigateur a bloqué le nouvel onglet : autorisez les fenêtres pop-up, ou utilisez « Télécharger ».', true);
  }

  /* ---------------- Validation de l'expédition ---------------- */

  function askValidate() {
    var d = S.ship.data;
    var ids = pickedCreated();
    if (!d || !ids.length || S.ship.vbusy) return;
    var notPrinted = d.created.filter(function (o) { return S.ship.created.sel[o.id] && !o.label.printed; }).length;
    showModal(modalHead('Valider l’expédition ?') +
      '<p>' + plural(ids.length, 'colis va être validé', 'colis vont être validés') + ' chez Ecotrack. Ensuite, <strong>plus de modification ni d’annulation possible</strong> : ' +
      'en cas de problème, il faudra faire une demande de retour.</p>' +
      (notPrinted ? '<div class="lock-box warn"><p>⚠ ' + plural(notPrinted, 'colis n’a pas', 'colis n’ont pas') + ' de bordereau imprimé dans l’outil.</p></div>' : '') +
      '<label class="check-line" style="margin:14px 0"><input type="checkbox" class="check" id="v-pickup"' + (d.pickup ? ' checked' : '') + '> ' +
      'Demander le ramassage <span class="small">(décoché : vous déposez les colis à l’agence)</span></label>' +
      '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Annuler</button>' +
      '<button type="button" class="btn primary" data-act="validate-go">' + (notPrinted ? 'Valider quand même' : 'Valider ' + plural(ids.length, 'colis', 'colis')) + '</button></div>');
  }

  function doValidate() {
    var ids = pickedCreated();
    var box = $('#v-pickup');
    var pickup = box ? box.checked : !!(S.ship.data && S.ship.data.pickup);
    closeModal();
    if (!ids.length || S.ship.vbusy) return;
    S.ship.vbusy = true;
    renderShipping();
    toast('Validation chez Ecotrack en cours…');
    call('api_validateParcels', ids, pickup).then(function (res) {
      S.ship.vbusy = false;
      S.ship.vresults = res.results;
      S.ship.created.sel = {};
      applyCounts(res.counts);
      var ok = res.results.filter(function (r) { return r.ok; }).length;
      var ko = res.results.length - ok;
      toast(plural(ok, 'colis validé', 'colis validés') + (ko ? ', ' + plural(ko, 'refusé', 'refusés') : '') + (ok ? '. Ils passent dans Suivi.' : ''), ok === 0);
      loadShipping();
    }).catch(function (e) {
      S.ship.vbusy = false;
      toast(errText(e), true);
      renderShipping();
    });
  }

  /** Colis validés sur le site d'Ecotrack : relus à l'ouverture de la page (au plus une fois par minute). */
  function maybeRefreshCreated(d) {
    if (!d.configured || !d.created.length || Date.now() - S.ship.refreshedAt < 60000) return;
    S.ship.refreshedAt = Date.now();
    call('api_refreshCreated').then(function (r) {
      if (!r.updated && !r.missing) return;
      if (r.message) toast(r.message);
      if (S.route === 'expeditions') loadShipping();
      refreshCount();
    }).catch(function () { /* silencieux : la mise à jour automatique repassera */ });
  }

  /** « 5 h », « 2 j » à partir d'un nombre d'heures. */
  function hoursText(hours) {
    var n = Math.max(Number(hours) || 0, 0);
    if (n < 1) return 'moins d’1 h';
    return n < 48 ? n + ' h' : Math.floor(n / 24) + ' j';
  }

  function confirmModal(title, text, okAct, okLabel) {
    showModal(modalHead(h(title)) + '<p>' + h(text) + '</p>' +
      '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Annuler</button>' +
      '<button type="button" class="btn primary" data-act="' + okAct + '">' + h(okLabel) + '</button></div>');
  }

  function askShip() {
    var n = Object.keys(S.ship.selected).length;
    if (!n || S.ship.busy) return;
    confirmModal('Créer les colis chez Ecotrack ?', plural(n, 'colis va être créé', 'colis vont être créés') +
      ' chez Ecotrack, avec le total affiché comme montant à encaisser. Ils ne seront pas encore expédiés : vous imprimez ensuite les bordereaux et validez l’expédition (onglet « Créés, à valider »).',
      'ship-confirm', 'Créer les colis');
  }

  function doShip() {
    var ids = Object.keys(S.ship.selected);
    closeModal();
    if (!ids.length || S.ship.busy) return;
    S.ship.busy = true;
    renderShipping();
    toast('Envoi à Ecotrack en cours…');
    call('api_shipEcotrack', ids).then(function (res) {
      S.ship.busy = false;
      S.ship.selected = {};
      S.ship.results = res;
      S.ship.created.sel = {};
      res.forEach(function (r) { if (r.ok) S.ship.created.sel[r.id] = true; });
      var ok = res.filter(function (r) { return r.ok; }).length;
      toast(plural(ok, 'colis créé', 'colis créés') + (res.length - ok ? ', ' + (res.length - ok) + ' refusé(s)' : '') + (ok ? '. Imprimez les bordereaux, puis validez.' : ''), ok === 0);
      loadShipping();
      refreshCount();
    }).catch(function (e) {
      S.ship.busy = false;
      toast(errText(e), true);
      renderShipping();
    });
  }

  function ecoAction(fn, busyText) {
    toast(busyText);
    call(fn).then(function (r) {
      toast(r.message);
      if (fn === 'api_ecotrackSyncStatuses') loadShipping();
    }).catch(function (e) { toast(errText(e), true); });
  }

  /* ================================================================ */
  /* Suivi des colis                                                  */
  /* ================================================================ */

  var LEVELS = {
    urgent: { label: 'Urgent', bg: '#FBE7E7', fg: '#A12626' },
    warn: { label: 'À surveiller', bg: '#FFF3DC', fg: '#8A5200' },
    info: { label: 'Info', bg: '#E6EEFB', fg: '#1E4FA8' }
  };
  var GROUPS = [
    ['all', 'Tous'], ['transit', 'En route'], ['delivery', 'En livraison'],
    ['suspended', 'Suspendus'], ['returning', 'Retours']
  ];

  /** Onglet « Terminées » de Suivi : livrées (avec l'état de l'argent) et retours reçus. */
  function finishedSection(d) {
    var f = S.track.done;
    var tests = {
      all: function () { return true; },
      delivered: function (x) { return x.status === 'Livrée'; },
      unpaid: function (x) { return x.unpaid; },
      returned: function (x) { return x.status === 'Retour'; }
    };
    var chips = [['all', 'Toutes'], ['delivered', 'Livrées'], ['unpaid', 'Argent pas encore reçu'], ['returned', 'Retours reçus']];
    var shown = d.finished.filter(tests[f] || tests.all);
    var html = '<section class="card"><h2>Commandes terminées</h2><div class="chips" role="group" aria-label="Filtrer" style="margin-bottom:12px">' +
      chips.map(function (c) {
        return '<button type="button" class="chip" data-act="track-done-filter" data-done="' + c[0] + '" aria-pressed="' + (f === c[0]) + '">' + c[1] + ' · ' + d.finished.filter(tests[c[0]]).length + '</button>';
      }).join('') + '</div>';
    if (!shown.length) return html + '<p class="empty" style="padding:18px 0">Aucune commande dans cette catégorie sur la période.</p></section>';
    html += '<div class="table-wrap" style="border:0"><table class="data cards"><thead><tr>' +
      ['Commande', 'Wilaya', 'Résultat', 'Argent / colis', 'Le', 'Total'].map(function (t) { return '<th scope="col">' + t + '</th>'; }).join('') + '</tr></thead><tbody>' +
      shown.map(function (x) {
        return '<tr><td data-label="Commande" class="multi"><button type="button" class="link-btn" data-act="open-order" data-id="' + h(x.id) + '">' + h(x.id) + '</button><div class="small">' + h(x.client) + '</div></td>' +
          '<td data-label="Wilaya">' + h(wilayaName(x.wilaya)) + '</td>' +
          '<td data-label="Résultat">' + pill(x.status) + '</td>' +
          '<td data-label="Argent / colis">' + h(x.label) + (x.unpaid ? ' <span class="pill" style="background:#FFF3DC;color:#8A5200">à recevoir</span>' : '') +
            (x.damaged ? ' <span class="pill" style="background:#FBE7E7;color:#A12626">abîmé, retiré du stock</span>' : '') +
            (x.canDamage && S.boot.user.stock ? ' <button type="button" class="btn" style="min-height:32px;padding:0 10px" data-act="return-damaged" data-id="' + h(x.id) + '">Abîmé ?</button>' : '') +
            (x.paymentId ? '<div class="small">Versement ' + h(x.paymentId) + '</div>' : '') + '</td>' +
          '<td data-label="Le">' + h(fmtDate(x.since)) + '</td>' +
          '<td data-label="Total" class="num strong">' + money(x.total) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    if (d.finishedTotal > d.finished.length) html += '<p class="small" style="margin-top:10px">Les ' + d.finished.length + ' plus récentes sur ' + d.finishedTotal + '.</p>';
    return html + '</section>';
  }

  function waLink(phone) {
    var p = String(phone || '').replace(/\D/g, '');
    return /^0[567]\d{8}$/.test(p) ? 'https://wa.me/213' + p.slice(1) : '';
  }

  function pageTracking() {
    view.innerHTML = '<div id="track"><p class="loading">Chargement…</p></div>';
    loadTracking();
  }

  function loadTracking() {
    var t = ++S.token;
    return call('api_trackingOverview', S.track.days).then(function (d) {
      if (t !== S.token || S.route !== 'suivi') return;
      S.track.data = d;
      setAlertCount(d.alerts.filter(function (a) { return a.level !== 'info'; }).length);
      renderTracking();
    }).catch(function (e) {
      if (t === S.token && S.route === 'suivi') $('#track').innerHTML = errorBox(e);
    });
  }

  function renderTracking() {
    var d = S.track.data;
    var box = $('#track');
    if (!d || !box) return;
    var m = d.money;
    var toReceive = m.delivered.amount + m.cashed.amount + m.ready.amount;
    var html = '<div class="page-head"><div><h1>Suivi des colis</h1><p class="sub">' +
      (d.lastSync ? 'Statuts relus ' + h(ago(d.lastSync)) + ' · automatiquement toutes les 30 minutes' : 'Statuts pas encore relus') + '</p></div>' +
      '<button type="button" class="btn primary" data-act="track-sync">Actualiser les statuts</button></div>';
    html += '<div class="stack">';
    if (!d.configured) {
      html += '<div class="card"><h2>Ecotrack n’est pas encore configuré</h2><p class="sub">Enregistrez l’adresse et le jeton dans le classeur (menu DZ Smart Shop › Ecotrack), puis créez vos premiers colis dans la page Expéditions.</p></div>';
    }
    if (d.lastError) html += errorBox(d.lastError);

    // Argent
    var periods = [[7, '7 jours'], [30, '30 jours'], [90, '90 jours']];
    html += '<section class="card"><div class="detail-head"><div><h2>Où est l’argent</h2><p class="muted">Montants à encaisser, avant déduction des frais d’Ecotrack. À recevoir : <strong>' + money(toReceive) + '</strong></p></div>' +
      '<div class="seg" role="group" aria-label="Période des paiements reçus">' + periods.map(function (p) {
        return '<button type="button" data-act="track-days" data-days="' + p[0] + '" aria-pressed="' + (d.days === p[0]) + '">' + p[1] + '</button>';
      }).join('') + '</div></div>' +
      '<div class="grid-kpi">' + [
        ['Chez le livreur', m.enRoute, 'Colis pas encore livrés'],
        ['Livrés, pas encaissés', m.delivered, 'Le livreur n’a pas encore remis l’argent'],
        ['Encaissés, pas payés', m.cashed, 'Ecotrack a l’argent, pas encore versé'],
        ['Prêts à être versés', m.ready, 'Paiement prêt chez Ecotrack'],
        ['Payés (' + d.days + ' jours)', m.paid, 'Argent reçu']
      ].map(function (k) {
        return '<div class="kpi" style="padding:4px 0"><span class="label">' + h(k[0]) + '</span><span class="value">' + money(k[1].amount) + '</span><span class="note">' + plural(k[1].count, 'colis', 'colis') + ' · ' + h(k[2]) + '</span></div>';
      }).join('') + '</div></section>';

    // Alertes
    html += '<section class="card"><h2>À traiter · ' + d.alerts.length + '</h2>';
    if (!d.alerts.length) {
      html += '<p class="empty" style="padding:18px 0">Rien à traiter : vos colis avancent normalement (alerte après ' + d.alertHours + ' h sans mouvement).</p>';
    } else {
      html += d.alerts.map(function (a) {
        var lv = LEVELS[a.level] || LEVELS.info;
        var wa = waLink(a.phone);
        return '<div class="result-row"><span class="pill" style="min-width:96px;text-align:center;background:' + lv.bg + ';color:' + lv.fg + '">' + lv.label + '</span>' +
          '<span class="grow"><strong>' + h(a.title) + '</strong> · <button type="button" class="link-btn" data-act="open-order" data-id="' + h(a.id) + '">' + h(a.id) + '</button> · ' + h(a.client) + ' · ' + h(wilayaName(a.wilaya)) +
          '<br><span class="small" style="color:var(--ink-2)">' + h(a.detail) + '</span>' +
          '<br><span class="small mono">' + h(a.tracking) + ' · ' + h(a.carrierLabel || 'statut pas encore lu') + ' · depuis ' + h(ago(a.since).replace(/^il y a /, '')) + '</span></span>' +
          '<span class="quick">' +
            (/^0\d{8,9}$/.test(String(a.phone).replace(/\D/g, '')) ? '<a class="btn" style="min-height:40px" href="tel:' + h(a.phone) + '" target="_top">Appeler</a>' : '') +
            (wa ? '<a class="btn" style="min-height:40px" href="' + h(wa) + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
            '<button type="button" class="btn" style="min-height:40px" data-act="track-history" data-id="' + h(a.id) + '">Chronologie</button>' +
            '<button type="button" class="btn" style="min-height:40px" data-act="track-done" data-id="' + h(a.id) + '">Marquer comme traité</button></span></div>';
      }).join('');
    }
    html += '</section>';

    // Colis : en cours, ou terminés (livrés, retours reçus)
    var view = S.track.view;
    html += '<div class="seg" role="group" aria-label="Colis" style="align-self:flex-start">' +
      '<button type="button" data-act="track-view" data-view="active" aria-pressed="' + (view === 'active') + '">En cours · ' + d.parcels.length + '</button>' +
      '<button type="button" data-act="track-view" data-view="done" aria-pressed="' + (view === 'done') + '">Terminées (' + d.days + ' j) · ' + d.finishedTotal + '</button></div>';
    if (view === 'done') html += finishedSection(d);
    else html += activeSection(d);

    // Versements
    html += paymentsSection(d) + '</div>';
    box.innerHTML = html;
  }

  /** Colis en cours (en route, en livraison, suspendus, retours en cours). */
  function activeSection(d) {
    var html = '';
    var f = S.track.filter;
    var shown = d.parcels.filter(function (p) { return f === 'all' || p.group === f; });
    html += '<section class="card"><h2>Colis en cours · ' + d.parcels.length + '</h2><div class="chips" role="group" aria-label="Filtrer les colis" style="margin-bottom:12px">' +
      GROUPS.map(function (g) {
        var n = g[0] === 'all' ? d.parcels.length : d.parcels.filter(function (p) { return p.group === g[0]; }).length;
        return '<button type="button" class="chip" data-act="track-filter" data-group="' + g[0] + '" aria-pressed="' + (f === g[0]) + '">' + g[1] + ' · ' + n + '</button>';
      }).join('') + '</div>';
    if (!shown.length) {
      html += '<p class="empty" style="padding:18px 0">Aucun colis dans cette catégorie.</p>';
    } else {
      html += '<div class="table-wrap" style="border:0"><table class="data cards"><thead><tr>' +
        ['Commande', 'Wilaya', 'N° de suivi', 'Statut Ecotrack', 'Depuis', 'Total', ''].map(function (t) { return '<th scope="col">' + t + '</th>'; }).join('') + '</tr></thead><tbody>' +
        shown.map(function (p) {
          return '<tr><td data-label="Commande" class="multi"><button type="button" class="link-btn" data-act="open-order" data-id="' + h(p.id) + '">' + h(p.id) + '</button><div class="small">' + h(p.client) + '</div></td>' +
            '<td data-label="Wilaya">' + h(wilayaName(p.wilaya)) + '</td>' +
            '<td data-label="N° de suivi" class="mono">' + h(p.tracking) + '</td>' +
            '<td data-label="Statut Ecotrack">' + h(p.carrierLabel || '—') + (p.stale ? ' <span class="pill" style="background:#FFF3DC;color:#8A5200">' + (p.group === 'draft' ? 'à valider' : 'sans mouvement') + '</span>' : '') + '</td>' +
            '<td data-label="Depuis">' + h(hoursText(p.ageHours)) + '</td>' +
            '<td data-label="Total" class="num strong">' + money(p.total) + '</td>' +
            '<td data-label=""><button type="button" class="btn" style="min-height:36px" data-act="track-history" data-id="' + h(p.id) + '">Chronologie</button></td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    return html + '</section>';
  }

  function paymentsSection(d) {
    var html = '<section class="card"><h2>Versements d’Ecotrack (' + d.days + ' jours)</h2>';
    if (!d.payments.length) {
      html += '<p class="empty" style="padding:18px 0">Aucun versement sur la période. Le n° de versement s’affiche dès qu’Ecotrack le fournit.</p>';
    } else {
      html += '<div class="table-wrap" style="border:0"><table class="data cards"><thead><tr>' +
        ['Versement', 'Colis', 'Montant', 'État', 'Dernier mouvement'].map(function (t) { return '<th scope="col">' + t + '</th>'; }).join('') + '</tr></thead><tbody>' +
        d.payments.map(function (p) {
          return '<tr><td data-label="Versement" class="mono">n° ' + h(p.id) + '</td><td data-label="Colis">' + p.count + '</td>' +
            '<td data-label="Montant" class="num strong">' + money(p.amount) + '</td>' +
            '<td data-label="État"><span class="pill" style="background:' + (p.paid ? '#DDF0E4;color:#146C2E' : '#FFF3DC;color:#8A5200') + '">' + (p.paid ? 'Payé' : 'En cours') + '</span></td>' +
            '<td data-label="Dernier mouvement" class="small">' + fmtDate(p.last) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    return html + '</section>';
  }

  /* Chronologie d'un colis : dans la fiche de la commande si elle est ouverte, sinon dans une fenêtre. */
  function historyHtml(d) {
    var html = '<div style="margin-top:12px"><p class="small">Colis <span class="mono">' + h(d.tracking) + '</span>' + (d.carrierLabel ? ' · ' + h(d.carrierLabel) : '') + '</p>';
    if (!d.events.length) {
      html += '<p>Ecotrack n’a renvoyé aucune étape que l’outil sache lire.</p>' +
        (d.raw ? '<details><summary class="small">Réponse brute d’Ecotrack (à m’envoyer si besoin)</summary><pre class="mono" style="white-space:pre-wrap;font-size:12px;overflow:auto">' + h(d.raw) + '</pre></details>' : '');
    } else {
      html += '<ol class="timeline">' + d.events.map(function (e) {
        return '<li><span class="t-date">' + (e.date ? fmtDate(e.date) : h(e.dateText || '—')) + '</span><span class="t-body"><strong>' + h(e.label) + '</strong>' +
          (e.note ? '<br><span class="small">' + h(e.note) + '</span>' : '') + '</span></li>';
      }).join('') + '</ol>';
    }
    return html + '</div>';
  }

  function openHistory(id) {
    var inOrder = !!$('#parcel-history') && !!$('#order-form');
    if (inOrder) {
      $('#parcel-history').innerHTML = '<p class="loading" style="padding:12px 0">Chargement…</p>';
    } else {
      showModal(modalHead('Chronologie · ' + h(id)) + '<div id="history-body"><p class="loading">Chargement…</p></div>' +
        '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Fermer</button></div>');
    }
    call('api_parcelHistory', id).then(function (d) {
      var el = inOrder ? $('#parcel-history') : $('#history-body');
      if (el) el.innerHTML = historyHtml(d);
    }).catch(function (e) {
      var el = inOrder ? $('#parcel-history') : $('#history-body');
      if (el) el.innerHTML = '<div style="margin-top:12px">' + errorBox(e) + '</div>';
    });
  }

  /* ================================================================ */
  /* Bénéfices (administrateur)                                       */
  /* ================================================================ */

  function pageProfit() {
    view.innerHTML = '<div id="profit"><p class="loading">Chargement…</p></div>';
    if (S.profit.tab === 'stock') S.profit.tab = 'resume';
    loadProfit();
  }

  function loadProfit() {
    var t = ++S.token;
    var p = S.profit;
    var box = $('#profit-body');
    if (box) box.innerHTML = '<p class="loading">Chargement…</p>';
    return call('api_profit', p.period).then(function (d) {
      if (t !== S.token || S.route !== 'benefices') return;
      p.data = d;
      renderProfit();
    }).catch(function (e) {
      if (t === S.token && S.route === 'benefices') $('#profit').innerHTML = errorBox(e);
    });
  }

  function signed(n) {
    return '<span class="' + (n < 0 ? 'neg' : 'pos') + '">' + money(n) + '</span>';
  }

  function renderProfit() {
    var p = S.profit;
    var d = p.data;
    var box = $('#profit');
    if (!box || !d) return;
    var periods = [['today', 'Aujourd’hui'], ['7', '7 jours'], ['30', '30 jours'], ['all', 'Tout']];
    var tabs = [['resume', 'Résumé'], ['produits', 'Produits'], ['campagnes', 'Publicité'], ['depenses', 'Dépenses']];
    var html = '<div class="page-head"><div><h1>Bénéfices</h1><p class="sub">Commandes comptées à leur date de commande · visible seulement par l’administrateur</p></div>' +
      '<div class="seg" role="group" aria-label="Période">' + periods.map(function (x) {
        return '<button type="button" data-act="profit-period" data-period="' + x[0] + '" aria-pressed="' + (p.period === x[0]) + '">' + x[1] + '</button>';
      }).join('') + '</div></div>' +
      '<div class="tabs" role="group" aria-label="Rubrique">' + tabs.map(function (x) {
        return '<button type="button" class="chip" data-act="profit-tab" data-tab="' + x[0] + '" aria-pressed="' + (p.tab === x[0]) + '">' + x[1] + '</button>';
      }).join('') + '</div><div id="profit-body"></div>';
    box.innerHTML = html;
    var body = $('#profit-body');
    if (p.tab === 'produits') body.innerHTML = profitProducts(d);
    else if (p.tab === 'campagnes') body.innerHTML = profitCampaigns(d);
    else if (p.tab === 'depenses') body.innerHTML = profitExpenses(d);
    else body.innerHTML = profitSummary(d);
  }

  function profitSummary(d) {
    var t = d.totals;
    var kpis = [
      ['Ventes des produits', money(t.productSales), plural(t.delivered, 'commande livrée', 'commandes livrées') + ' · encaissé ' + money(t.revenue)],
      ['Livraison', signed(-t.deliveryNet), t.deliveryNet > 0 ? 'Elle vous coûte (Ecotrack − payé par les clients)' : t.deliveryNet < 0 ? 'Vous gagnez dessus (payé par les clients − Ecotrack)' : 'Ni gain ni perte'],
      ['Bénéfice des commandes', signed(t.ordersProfit), 'Après livraison, achat et retours'],
      ['Dépenses', money(t.expenses), 'Dont publicité : ' + money(t.adSpend)],
      ['Bénéfice net', signed(t.net), 'Ce qui vous reste sur la période'],
      ['Publicité par commande livrée', t.costPerDelivered === null ? '—' : money(t.costPerDelivered), t.deliveryRate === null ? 'Aucune commande terminée' : 'Taux de livraison : ' + Math.round(t.deliveryRate * 100) + ' %']
    ];
    var html = '<div class="stack"><section class="grid-kpi" aria-label="Chiffres clés">' + kpis.map(function (k) {
      return '<div class="card kpi"><span class="label">' + h(k[0]) + '</span><span class="value">' + k[1] + '</span><span class="note">' + h(k[2]) + '</span></div>';
    }).join('') + '</section>';
    var warn = [];
    if (d.warnings.missingCost) warn.push(plural(d.warnings.missingCost, 'commande livrée sans coût d’achat', 'commandes livrées sans coût d’achat') + ' (' + h(d.warnings.missingCostLabels.join(', ')) + ') : complétez la page Stock.');
    if (d.warnings.missingFee) warn.push(plural(d.warnings.missingFee, 'commande sans tarif de livraison', 'commandes sans tarif de livraison') + ' dans l’onglet Tarifs : les frais payés par le client sont utilisés.');
    if (warn.length) html += '<div class="stock-warn" style="flex-direction:column;align-items:flex-start">' + warn.map(function (w) { return '<span>⚠ ' + w + '</span>'; }).join('') + '</div>';
    html += '<section class="card"><h2>Détail</h2><div class="money-lines">' +
      '<div><span>Ventes des produits livrés (sans la livraison)</span><span>' + money(t.productSales) + '</span></div>' +
      '<div><span>Livraison : Ecotrack ' + money(t.deliveryFees) + ' − payé par les clients ' + money(t.clientShipping) + '</span>' + signed(-t.deliveryNet) + '</div>' +
      '<div><span>Coût d’achat des produits livrés</span>' + signed(-t.productCost) + '</div>' +
      '<div><span>Frais de retour (' + t.returned + ' × ' + money(d.returnFee) + ')</span>' + signed(-t.returnFees) + '</div>' +
      (t.packaging ? '<div><span>Emballage</span>' + signed(-t.packaging) + '</div>' : '') +
      '<div class="total"><span>Bénéfice des commandes</span>' + signed(t.ordersProfit) + '</div>' +
      d.expensesByCategory.map(function (e) { return '<div><span>' + h(e.category) + '</span>' + signed(-e.amount) + '</div>'; }).join('') +
      '<div class="total"><span>Bénéfice net</span>' + signed(t.net) + '</div>' +
      '</div><p class="small" style="margin-top:10px">' + t.inTransit + ' commande(s) encore en route ne sont pas comptées : leur bénéfice arrivera à la livraison.</p></section></div>';
    return html;
  }

  function groupRows(list, first) {
    return list.map(function (g) {
      return [first(g), g.orders, g.delivered, g.returned, g.deliveryRate === null ? '—' : Math.round(g.deliveryRate * 100) + ' %',
        money(g.sales), signed(-g.deliveryNet), signed(g.profit)];
    });
  }

  function profitProducts(d) {
    if (!d.products.length) return '<div class="card"><p class="empty">Aucune commande sur la période.</p></div>';
    return '<section class="card"><h2>Par produit</h2>' +
      table(['Produit', 'Commandes', 'Livrées', 'Retours', 'Taux de livraison', 'Ventes', 'Livraison', 'Bénéfice'], groupRows(d.products, function (g) { return h(g.name); }), [1, 2, 3, 4, 5, 6, 7]) +
      '<p class="small" style="margin-top:10px">Livraison : en rouge, ce que la livraison vous coûte (Ecotrack plus cher que ce que paie le client) ; en vert, ce que vous gagnez dessus. ' +
      'Une commande à plusieurs produits est partagée selon les quantités. Bénéfice avant dépenses (publicité…).</p></section>';
  }

  function adRows(list) {
    return list.map(function (g) {
      return [h(g.name), g.orders, g.delivered, g.deliveryRate === null ? '—' : Math.round(g.deliveryRate * 100) + ' %', signed(g.profit),
        money(g.spend), signed(g.net), g.costPerDelivered === null ? '—' : money(g.costPerDelivered)];
    });
  }

  function profitCampaigns(d) {
    var head = ['', 'Commandes', 'Livrées', 'Livraison', 'Bénéfice', 'Publicité', 'Net', 'Pub / livrée'];
    var html = '<div class="stack"><section class="card"><h2>Par plateforme</h2>' +
      table(['Plateforme'].concat(head.slice(1)), adRows(d.platforms), [1, 2, 3, 4, 5, 6, 7]) + '</section>' +
      '<section class="card"><h2>Par campagne</h2>' +
      table(['Campagne'].concat(head.slice(1)), adRows(d.campaigns), [1, 2, 3, 4, 5, 6, 7]) +
      (d.adUnassigned ? '<p class="small" style="margin-top:10px">' + money(d.adUnassigned) + ' de publicité sans campagne : comptés pour la plateforme, pas pour une campagne.</p>' : '') +
      '<p class="small" style="margin-top:10px">Pour relier vos commandes à vos publicités : ajoutez « UTM source » et « UTM campaign » à la fin de l’onglet RELEASIT, et dans le lien de vos annonces : ' +
      '<span class="mono">utm_source=facebook&amp;utm_campaign={{campaign.name}}</span> (Facebook) ou <span class="mono">utm_source=tiktok&amp;utm_campaign=__CAMPAIGN_NAME__</span> (TikTok). ' +
      'Dans vos dépenses, écrivez le même nom de campagne.</p></section></div>';
    return html;
  }

  function profitExpenses(d) {
    var today = new Date();
    var iso = today.getFullYear() + '-' + ('0' + (today.getMonth() + 1)).slice(-2) + '-' + ('0' + today.getDate()).slice(-2);
    var html = '<div class="stack"><section class="card"><h2>Ajouter une dépense</h2><div class="form-grid" id="expense-form">' +
      field('Date', '<input name="date" type="date" value="' + iso + '">') +
      field('Catégorie', '<select name="category">' + options(d.categories, d.categories[0]) + '</select>') +
      field('Campagne (facultatif)', input('campaign', '', ' list="campaign-list" placeholder="Nom de la campagne"')) +
      field('Montant', input('amount', '', ' type="number" min="0" step="0.01" inputmode="decimal"')) +
      field('Devise', '<select name="currency"><option>USD</option><option>DA</option></select>') +
      field('Note', input('note', ''), 'full') +
      '</div><datalist id="campaign-list">' + d.knownCampaigns.map(function (c) { return '<option value="' + h(c) + '">'; }).join('') + '</datalist>' +
      '<p class="small" style="margin:10px 0">Dollar : ' + money(d.rate) + ' (réglage TAUX_DOLLAR dans Paramètres). Une dépense garde le taux du jour où elle est saisie.</p>' +
      '<button type="button" class="btn primary" data-act="expense-add">Ajouter la dépense</button></section>';
    html += '<section class="card"><h2>Dépenses de la période</h2>' + (d.expenses.length ? table(
      ['Date', 'Catégorie', 'Campagne', 'Montant', 'En dinars'],
      d.expenses.map(function (e) {
        return [h(fmtDay(e.date)), h(e.category), h(e.campaign || '—'),
          e.currency === 'USD' ? h(e.amount + ' $ × ' + e.rate) : money(e.amount), money(e.amountDA)];
      }), [3, 4]
    ) : '<p class="empty">Aucune dépense sur la période.</p>') +
      '<p class="small" style="margin-top:10px">Pour corriger ou supprimer une dépense : onglet Dépenses du classeur.</p></section></div>';
    return html;
  }

  function fmtDay(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
  }

  function addExpense(btn) {
    var data = readForm($('#expense-form'));
    btn.disabled = true;
    call('api_addExpense', data).then(function (r) {
      toast(r.message);
      btn.disabled = false;
      loadProfit();
    }).catch(function (e) { btn.disabled = false; toast(errText(e), true); });
  }

  /* ================================================================ */
  /* Stock (administrateur et magasinier)                             */
  /* ================================================================ */

  function pageStock() {
    view.innerHTML = '<div id="stock"><p class="loading">Chargement…</p></div>';
    loadStockPage();
  }

  function loadStockPage() {
    var t = ++S.token;
    return call('api_stockPage').then(function (d) {
      if (t !== S.token || S.route !== 'stock') return;
      S.stock.data = d;
      renderStock();
    }).catch(function (e) {
      if (t === S.token && S.route === 'stock') $('#stock').innerHTML = errorBox(e);
    });
  }

  function modelName(g, m) { return g.product + (m.model ? ' — ' + m.model : ''); }

  /** Tous les modèles, avec leur produit (pour les formulaires). */
  function allModels(d, activeOnly) {
    var out = [];
    d.products.forEach(function (g) {
      g.models.forEach(function (m) { if (!activeOnly || m.active) out.push({ g: g, m: m }); });
    });
    return out;
  }

  function moveQty(q) {
    return '<span class="' + (q < 0 ? 'move-out' : 'move-in') + '">' + (q > 0 ? '+' : '') + q + '</span>';
  }

  function renderStock() {
    var d = S.stock.data;
    var box = $('#stock');
    if (!box || !d) return;
    var t = d.totals;
    var html = '<div class="page-head"><div><h1>Stock</h1><p class="sub">Une commande confirmée réserve ses produits ; le stock baisse quand le colis part et remonte quand le retour est reçu.</p></div>' +
      '<div class="quick"><button type="button" class="btn primary" data-act="product-new">+ Produit</button>' +
      '<button type="button" class="btn" data-act="stock-entry">Entrée de marchandise</button>' +
      '<button type="button" class="btn" data-act="stock-inventory">Inventaire</button></div></div><div class="stack">';
    html += '<section class="grid-kpi" aria-label="Chiffres du stock">' + [
      ['Valeur du stock', money(t.value), 'Stock × coût d’achat'],
      ['Pièces en stock', t.units, plural(t.models, 'modèle actif', 'modèles actifs')],
      ['Stock bas', t.low, 'Disponible au seuil d’alerte ou moins'],
      ['En rupture', t.rupture, 'Plus rien de disponible']
    ].map(function (k) {
      return '<div class="card kpi"><span class="label">' + h(k[0]) + '</span><span class="value">' + h(k[1]) + '</span><span class="note">' + h(k[2]) + '</span></div>';
    }).join('') + '</section>';

    if (!d.products.length) {
      html += '<div class="card"><p class="empty">Aucun produit. Cliquez sur « + Produit », ou ajoutez ci-dessous les modèles vus dans vos commandes.</p></div>';
    }
    d.products.forEach(function (g) {
      html += '<section class="card"><h2>' + h(g.product) + '</h2>' +
        '<p class="sub" style="margin:-4px 0 10px">' + (g.tracked ? 'Stock ' + g.stock + ' · réservé ' + g.reserved + ' · <strong>disponible ' + g.available + '</strong> · valeur ' + money(g.value) : 'Stock non suivi') + '</p>' +
        '<div class="table-wrap" style="border:0"><table class="data cards"><thead><tr>' +
        ['Modèle', 'Stock', 'Réservé', 'Disponible', 'Coût d’achat', 'Prix de vente', ''].map(function (x) { return '<th scope="col">' + x + '</th>'; }).join('') +
        '</tr></thead><tbody>' + g.models.map(function (m) {
          var tag = !m.active ? '<span class="pill" style="background:#EEF0F3;color:#3D4350">désactivé</span>'
            : m.rupture ? '<span class="pill" style="background:#FBE7E7;color:#A12626">rupture</span>'
            : m.low ? '<span class="pill" style="background:#FFF3DC;color:#8A5200">stock bas</span>' : '';
          return '<tr class="model-row' + (m.low && m.active ? ' low' : '') + (!m.active ? ' off' : '') + '">' +
            '<td data-label="Modèle">' + h(m.model || '—') + ' ' + tag + (m.aliases ? '<div class="small">Autres noms : ' + h(m.aliases) + '</div>' : '') + '</td>' +
            '<td data-label="Stock" class="num">' + (m.tracked ? m.stock : '—') + '</td>' +
            '<td data-label="Réservé" class="num">' + m.reserved + '</td>' +
            '<td data-label="Disponible" class="num strong">' + (m.tracked ? m.available : '—') + '</td>' +
            '<td data-label="Coût d’achat" class="num">' + (m.cost === null ? '<span class="neg">à remplir</span>' : money(m.cost)) + '</td>' +
            '<td data-label="Prix de vente" class="num">' + (m.price === null ? '—' : money(m.price)) + '</td>' +
            '<td data-label=""><span class="quick">' +
              '<button type="button" class="btn" style="min-height:36px" data-act="model-edit" data-key="' + h(m.key) + '">Modifier</button>' +
              '<button type="button" class="btn" style="min-height:36px" data-act="model-history" data-key="' + h(m.key) + '">Historique</button></span></td></tr>';
        }).join('') + '</tbody></table></div></section>';
    });
    if (d.unknown.length) {
      html += '<section class="card"><h2>Modèles vus dans les commandes, absents du catalogue</h2>' +
        table(['Produit', 'Modèle', 'Commandes', ''], d.unknown.map(function (u) {
          return [h(u.product), h(u.model || '—'), u.orders, '<button type="button" class="btn" style="min-height:36px" data-act="catalog-add" data-label="' + h(u.label) + '">Ajouter</button>'];
        }), [2]) +
        '<p style="margin-top:12px"><button type="button" class="btn primary" data-act="catalog-add">Tout ajouter</button></p>' +
        '<p class="small" style="margin-top:8px">Ensuite, indiquez leur coût d’achat (Modifier) et leur stock (Entrée de marchandise).</p></section>';
    }
    html += '<section class="card"><h2>Derniers mouvements</h2>' + (d.moves.length ? movesTable(d.moves.slice(0, 30)) : '<p class="empty">Aucun mouvement pour l’instant.</p>') +
      '<p class="small" style="margin-top:10px">Historique complet : onglet « Mouvements stock » du classeur.</p></section></div>';
    box.innerHTML = html;
  }

  function movesTable(list) {
    return table(['Date', 'Modèle', 'Mouvement', 'Quantité', 'Stock après', 'Détail'], list.map(function (x) {
      return [h(fmtDate(x.date)), h(x.product + (x.model ? ' — ' + x.model : '')), h(x.type), moveQty(x.qty), x.after === null ? '—' : x.after,
        h([x.order ? 'Commande ' + x.order : '', x.cost ? 'coût ' + x.cost + ' DA' : '', x.note, x.by ? 'par ' + x.by : ''].filter(Boolean).join(' · '))];
    }), [3, 4]);
  }

  function findModel(key) {
    var found = null;
    allModels(S.stock.data).forEach(function (x) { if (x.m.key === key) found = x; });
    return found;
  }

  function askNewProduct() {
    showModal(modalHead('Nouveau produit') +
      '<div class="form-grid" id="product-form">' +
        field('Nom du produit', input('product', '', ' placeholder="Ex. cover iPhone"'), 'full') +
        field('Prix de vente (DA)', input('price', '', ' type="number" min="0" step="10"')) +
        field('Coût d’achat (DA)', input('cost', '', ' type="number" min="0" step="10"')) +
        field('Seuil d’alerte', input('threshold', '', ' type="number" min="0" step="1" placeholder="Réglage général"')) +
        field('Modèles et stock de départ : un par ligne, « modèle = quantité »', '<textarea name="models" rows="5" placeholder="iphone 13 = 10&#10;iphone 15 PRO MAX = 4"></textarea>', 'full') +
        field('Stock de départ (produit sans modèle)', input('stock', '', ' type="number" min="0" step="1"')) +
      '</div><p class="small" style="margin-top:8px">Le nom doit être écrit comme dans vos commandes (ex. « cover iPhone - iphone 13 ») pour que le stock suive tout seul. Sinon, ajoutez des « autres noms » avec Modifier.</p>' +
      '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Annuler</button>' +
      '<button type="button" class="btn primary" data-act="product-save">Ajouter le produit</button></div>');
  }

  function saveNewProduct(btn) {
    var f = readForm($('#product-form'));
    var models = String(f.models || '').split('\n').map(function (line) {
      var m = line.match(/^(.*?)(?:\s*[=:;]\s*(\d+))?\s*$/);
      return m && m[1].trim() ? { model: m[1].trim(), stock: m[2] || '' } : null;
    }).filter(Boolean);
    btn.disabled = true;
    call('api_addProduct', { product: f.product, price: f.price, cost: f.cost, threshold: f.threshold, stock: f.stock, models: models }).then(function (r) {
      closeModal();
      toast(r.message);
      loadStockPage();
    }).catch(function (e) { btn.disabled = false; toast(errText(e), true); });
  }

  function askEditModel(key) {
    var x = findModel(key);
    if (!x) return;
    var m = x.m;
    showModal(modalHead('Modifier ' + h(modelName(x.g, m))) +
      '<div class="form-grid" id="model-form" data-row="' + m.row + '" data-key="' + h(m.key) + '">' +
        field('Produit', input('product', x.g.product)) +
        field('Modèle', input('model', m.model)) +
        field('Prix de vente (DA)', input('price', m.price === null ? '' : m.price, ' type="number" min="0" step="10"')) +
        field('Coût d’achat (DA)', input('cost', m.cost === null ? '' : m.cost, ' type="number" min="0" step="10"')) +
        field('Seuil d’alerte', input('threshold', m.ownThreshold === null ? '' : m.ownThreshold, ' type="number" min="0" step="1" placeholder="Réglage général"')) +
        field('Autres noms (séparés par « ; »)', input('aliases', m.aliases, ' placeholder="Écritures de ce modèle dans les commandes"'), 'full') +
        '<label class="field full" style="flex-direction:row;align-items:center;gap:10px"><input type="checkbox" name="active"' + (m.active ? ' checked' : '') + ' style="width:auto;min-height:0"> Actif (décochez s’il n’est plus vendu)</label>' +
      '</div><p class="small" style="margin-top:8px">Le stock se change avec « Entrée de marchandise » ou « Inventaire ». Si vous renommez, l’ancien nom est gardé dans « autres noms ».</p>' +
      '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Annuler</button>' +
      '<button type="button" class="btn primary" data-act="model-save">Enregistrer</button></div>');
  }

  function saveModel(btn) {
    var form = $('#model-form');
    var f = readForm(form);
    f.row = Number(form.getAttribute('data-row'));
    f.key = form.getAttribute('data-key');
    btn.disabled = true;
    call('api_updateCatalogRow', f).then(function (r) {
      closeModal();
      toast(r.message);
      loadStockPage();
    }).catch(function (e) { btn.disabled = false; toast(errText(e), true); });
  }

  function showHistory(key) {
    var x = findModel(key);
    if (!x) return;
    var list = S.stock.data.moves.filter(function (mv) { return mv.key === key; });
    showModal(modalHead('Historique · ' + h(modelName(x.g, x.m))) +
      (list.length ? movesTable(list) : '<p class="empty">Aucun mouvement récent pour ce modèle.</p>') +
      '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Fermer</button></div>');
  }

  /** Entrée de marchandise ou inventaire : un produit, puis ses modèles. */
  function askStockForm(kind) {
    var d = S.stock.data;
    var products = d.products.filter(function (g) { return g.models.some(function (m) { return m.active; }); });
    if (!products.length) { toast('Ajoutez d’abord un produit.', true); return; }
    var entry = kind === 'entry';
    showModal(modalHead(entry ? 'Entrée de marchandise' : 'Inventaire') +
      '<div class="form-grid" id="stock-form" data-kind="' + kind + '">' +
        field('Produit', '<select name="product" data-role="stock-product">' + products.map(function (g, i) {
          return '<option value="' + i + '">' + h(g.product) + '</option>';
        }).join('') + '</select>', 'full') +
        (entry ? field('Coût unitaire (DA, facultatif)', input('cost', '', ' type="number" min="0" step="10"')) + field('Fournisseur (facultatif)', input('supplier', ''))
          : field('Motif', '<select name="reason">' + options(d.reasons, d.reasons[0]) + '</select>')) +
        field('Note (facultatif)', input('note', ''), 'full') +
      '</div><div class="lines" id="stock-lines"></div>' +
      '<p class="small" style="margin-top:8px">' + (entry ? (d.averageCost ? 'Avec un coût unitaire, le coût d’achat devient la moyenne de l’ancien stock et de cette entrée.' : 'Le coût d’achat ne change pas (réglage COUT_MOYEN = NON).')
        : 'Tapez la quantité comptée ; laissez vide les modèles non comptés. L’écart est noté avec le motif.') + '</p>' +
      '<div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Annuler</button>' +
      '<button type="button" class="btn primary" data-act="stock-save">' + (entry ? 'Enregistrer l’entrée' : 'Enregistrer l’inventaire') + '</button></div>');
    S.stock.formProducts = products;
    renderStockLines();
  }

  function renderStockLines() {
    var form = $('#stock-form');
    if (!form) return;
    var entry = form.getAttribute('data-kind') === 'entry';
    var g = S.stock.formProducts[Number($('[data-role="stock-product"]').value) || 0];
    $('#stock-lines').innerHTML = g.models.filter(function (m) { return m.active; }).map(function (m) {
      return '<label class="line"><span>' + h(m.model || g.product) + ' <span class="small">· stock ' + (m.tracked ? m.stock : '—') + '</span></span>' +
        '<input type="number" min="0" step="1" inputmode="numeric" data-line-row="' + m.row + '" data-line-key="' + h(m.key) + '" placeholder="' + (entry ? 'Reçu' : (m.tracked ? m.stock : 'Compté')) + '"></label>';
    }).join('');
  }

  function saveStockForm(btn) {
    var form = $('#stock-form');
    var f = readForm(form);
    var entry = form.getAttribute('data-kind') === 'entry';
    var items = $all('[data-line-row]').map(function (el) {
      var v = String(el.value).trim();
      if (!v) return null;
      return entry ? { row: Number(el.getAttribute('data-line-row')), key: el.getAttribute('data-line-key'), qty: v, cost: f.cost }
        : { row: Number(el.getAttribute('data-line-row')), key: el.getAttribute('data-line-key'), counted: v };
    }).filter(Boolean);
    btn.disabled = true;
    call(entry ? 'api_stockEntry' : 'api_stockInventory', entry ? { items: items, supplier: f.supplier, note: f.note } : { items: items, reason: f.reason + (f.note ? ' · ' + f.note : '') }).then(function (r) {
      closeModal();
      toast(r.message);
      loadStockPage();
    }).catch(function (e) { btn.disabled = false; toast(errText(e), true); });
  }

  function addToCatalog(labels, btn) {
    var list = labels || (S.stock.data ? S.stock.data.unknown.map(function (u) { return u.label; }) : []);
    if (!list.length) return;
    btn.disabled = true;
    call('api_addCatalogItems', list).then(function (r) {
      toast(r.message);
      loadStockPage();
    }).catch(function (e) { btn.disabled = false; toast(errText(e), true); });
  }

  /** Menu « Plus » (téléphone) : les pages qui ne tiennent pas dans la barre du bas. */
  function showMoreMenu() {
    var u = S.boot.user;
    showModal(modalHead('Plus') + '<div class="more-list">' +
      (u.admin ? '<a href="#/benefices">Bénéfices<div class="small" style="font-weight:400">Résumé, produits, publicité, dépenses</div></a>' : '') +
      (u.stock ? '<a href="#/stock">Stock<div class="small" style="font-weight:400">Produits, entrées, inventaire, historique</div></a>' : '') +
      '</div>');
  }

  function markDamaged(btn) {
    var id = btn.getAttribute('data-id');
    btn.disabled = true;
    call('api_markReturnDamaged', id).then(function (r) {
      toast(r.message);
      loadTracking();
    }).catch(function (e) { btn.disabled = false; toast(errText(e), true); });
  }

  /* ================================================================ */
  /* Événements                                                       */
  /* ================================================================ */

  var ACTIONS = {
    'goto': function (el) {
      if (el.getAttribute('data-tab')) S.profit.tab = el.getAttribute('data-tab');
      navigate(el.getAttribute('data-route'), el.getAttribute('data-status'));
    },
    'profit-period': function (el) { S.profit.period = el.getAttribute('data-period'); loadProfit(); },
    'profit-tab': function (el) { S.profit.tab = el.getAttribute('data-tab'); renderProfit(); },
    'expense-add': addExpense,
    'catalog-add': function (el) { addToCatalog(el.getAttribute('data-label') ? [el.getAttribute('data-label')] : null, el); },
    'product-new': askNewProduct,
    'product-save': saveNewProduct,
    'model-edit': function (el) { askEditModel(el.getAttribute('data-key')); },
    'model-save': saveModel,
    'model-history': function (el) { showHistory(el.getAttribute('data-key')); },
    'stock-entry': function () { askStockForm('entry'); },
    'stock-inventory': function () { askStockForm('inventory'); },
    'stock-save': saveStockForm,
    'more-menu': showMoreMenu,
    'return-damaged': markDamaged,
    'sms-send': function (el) {
      el.disabled = true;
      call('api_smsSendNow').then(function (r) { toast(r.message); loadShopStatus(); }).catch(function (e) { el.disabled = false; toast(errText(e), true); });
    },
    'period': function (el) { S.period = el.getAttribute('data-period'); pageDashboard(); },
    'chip': function (el) { S.filter.status = el.getAttribute('data-status'); S.filter.limit = 100; loadOrders(); },
    'trash-restore': function (el) {
      el.disabled = true;
      call('api_restoreOrder', el.getAttribute('data-id')).then(function (r) {
        toast(r.message);
        loadOrders();
        refreshCount();
      }).catch(function (e) { el.disabled = false; toast(errText(e), true); });
    },
    'more': function () { S.filter.limit += 100; loadOrders(); },
    'open-order': function (el) { openOrder(el.getAttribute('data-id')); },
    'new-order': openNewOrder,
    'releasit-transfer': function () {
      toast('Lecture de l’onglet RELEASIT…');
      call('api_releasitTransfer').then(function (r) {
        toast(r.message);
        loadShopStatus();
        if (r.summary && r.summary.added) { loadOrders(); refreshCount(); }
      }).catch(function (e) { toast(errText(e), true); loadShopStatus(); });
    },
    'shop-import': function () {
      toast('Importation depuis Shopify…');
      call('api_shopifyImport').then(function (r) {
        toast(r.message);
        loadShopStatus();
        loadOrders();
        refreshCount();
      }).catch(function (e) { toast(errText(e), true); loadShopStatus(); });
    },
    'close-modal': closeModal,
    'save-order': saveOrder,
    'parcel-cancel-ask': function (el) { askCancelParcel(el.getAttribute('data-id'), el.getAttribute('data-tracking'), el.getAttribute('data-from') === 'ship'); },
    'parcel-cancel': cancelParcel,
    'manual-ship-ask': function (el) { askManualShip(el.getAttribute('data-id')); },
    'manual-ship': manualShip,
    'track-view': function (el) { S.track.view = el.getAttribute('data-view'); renderTracking(); },
    'track-done-filter': function (el) { S.track.done = el.getAttribute('data-done'); renderTracking(); },
    'order-delete-ask': function (el) { askDeleteOrder(el.getAttribute('data-id')); },
    'order-delete': deleteOrder,
    'order-reopen': reopenOrder,
    'order-unlock': function (el) { S.unlockId = el.getAttribute('data-id'); if (S.order) renderOrderModal(S.order); },
    'create-order': createOrder,
    'toggle-blacklist': toggleBlacklist,
    'refresh-queue': function () { loadQueue(false, true); },
    'q-open': function (el) { if (!S.busy) openInDetail(el.getAttribute('data-id')); },
    'toggle-queue': function () { $('#queue').classList.toggle('open'); },
    'confirm': function () { submit('confirm'); },
    'no_answer': function () { submit('no_answer'); },
    'show-callback': function () { showPanel('callback'); },
    'show-cancel': function () { showPanel('cancel'); },
    'cb-quick': function (el) {
      var d = new Date();
      if (el.hasAttribute('data-min')) d = new Date(Date.now() + Number(el.getAttribute('data-min')) * 60000);
      else { d.setDate(d.getDate() + 1); d.setHours(Number(el.getAttribute('data-tomorrow')), 0, 0, 0); }
      submit('callback', { callback: d.toISOString() });
    },
    'callback': function () {
      var v = $('#cb-when').value;
      if (!v) { toast('Choisissez une date et une heure.', true); return; }
      submit('callback', { callback: new Date(v).toISOString() });
    },
    'cancel': function () { submit('cancel', { reason: $('#cancel-reason').value }); },
    'ship-reload': function () { loadShipping(); },
    'ship-tab': function (el) { S.ship.tab = el.getAttribute('data-tab'); renderShipping(); },
    'ship-dismiss': function () { S.ship.results = null; renderShipping(); },
    'ship-vdismiss': function () { S.ship.vresults = null; renderShipping(); },
    'created-filter': function (el) { S.ship.created.filter = el.getAttribute('data-filter'); renderShipping(); },
    'label-format': function (el) { setLabelFormat(el.getAttribute('data-format')); renderShipping(); },
    'labels-print': function () { printLabels(pickedCreated()); },
    'labels-from-results': function () {
      var ids = (S.ship.results || []).filter(function (r) { return r.ok; }).map(function (r) { return r.id; });
      S.ship.tab = 'created';
      renderShipping();
      printLabels(ids);
    },
    'label-one': function (el) { printLabels([el.getAttribute('data-id')]); },
    'labels-open': openLabelsPdf,
    'validate-ask': askValidate,
    'validate-go': doValidate,
    'ship-ask': askShip,
    'ship-confirm': doShip,
    'eco-test': function () { ecoAction('api_ecotrackTest', 'Test de la connexion…'); },
    'eco-status': function () { ecoAction('api_ecotrackSyncStatuses', 'Lecture des statuts chez Ecotrack…'); },
    'eco-fees-ask': function () {
      confirmModal('Récupérer les tarifs Ecotrack ?',
        'Les colonnes « Ecotrack domicile » et « Ecotrack stop desk » de l’onglet Tarifs seront remplacées par les prix d’Ecotrack. Les prix Yalidine ne changent pas.',
        'eco-fees', 'Récupérer');
    },
    'eco-fees': function () { closeModal(); ecoAction('api_ecotrackSyncFees', 'Récupération des tarifs…'); },
    'track-sync': function () {
      toast('Lecture des statuts chez Ecotrack…');
      call('api_ecotrackSyncStatuses').then(function (r) { toast(r.message); loadTracking(); refreshCount(); })
        .catch(function (e) { toast(errText(e), true); });
    },
    'track-days': function (el) { S.track.days = Number(el.getAttribute('data-days')); loadTracking(); },
    'track-filter': function (el) { S.track.filter = el.getAttribute('data-group'); renderTracking(); },
    'track-history': function (el) { openHistory(el.getAttribute('data-id')); },
    'track-done': function (el) {
      el.disabled = true;
      call('api_markFollowUp', el.getAttribute('data-id')).then(function () {
        toast('Alerte marquée comme traitée');
        loadTracking();
        refreshCount();
      }).catch(function (e) { el.disabled = false; toast(errText(e), true); });
    }
  };

  document.addEventListener('click', function (e) {
    if (e.target.classList && e.target.classList.contains('modal-backdrop')) { closeModal(); return; }
    if (e.target.closest && e.target.closest('[data-label-download]')) { markLabelsPrinted(); return; }
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.getAttribute('data-act')];
    if (!fn) return;
    e.preventDefault();
    e.stopPropagation();
    fn(el, e);
  });

  var searchTimer = null;
  document.addEventListener('input', function (e) {
    if (e.target.id === 'f-q') {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { S.filter.q = e.target.value; S.filter.limit = 100; loadOrders(); }, 350);
    } else if (e.target.closest('#d-form')) {
      updateSummary();
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.hasAttribute('data-ship-check')) {
      var sid = e.target.getAttribute('data-ship-check');
      if (e.target.checked) S.ship.selected[sid] = true; else delete S.ship.selected[sid];
      renderShipping();
      return;
    }
    if (e.target.hasAttribute('data-created-check')) {
      var cid = e.target.getAttribute('data-created-check');
      if (e.target.checked) S.ship.created.sel[cid] = true; else delete S.ship.created.sel[cid];
      renderShipping();
      return;
    }
    if (e.target.hasAttribute('data-created-all')) {
      var d0 = S.ship.data;
      var shown = !d0 ? [] : S.ship.created.filter === 'unprinted' ? d0.created.filter(function (o) { return !o.label.printed; }) : d0.created;
      shown.forEach(function (o) { if (e.target.checked) S.ship.created.sel[o.id] = true; else delete S.ship.created.sel[o.id]; });
      renderShipping();
      return;
    }
    if (e.target.hasAttribute('data-ship-all')) {
      S.ship.selected = {};
      if (e.target.checked && S.ship.data) {
        S.ship.data.toShip.forEach(function (o) { if (!o.problems.length) S.ship.selected[o.id] = true; });
      }
      renderShipping();
      return;
    }
    if (e.target.id === 'f-wilaya') { S.filter.wilaya = e.target.value; S.filter.limit = 100; loadOrders(); }
    else if (e.target.id === 'f-period') { S.filter.period = e.target.value; S.filter.limit = 100; loadOrders(); }
    else if (e.target.getAttribute('data-role') === 'status') toggleCancelField();
    else if (e.target.getAttribute('data-role') === 'stock-product') renderStockLines();
    else if (e.target.closest('#order-form') && !$('#order-form').getAttribute('data-id') && (e.target.name === 'product' || e.target.name === 'qty')) fillNewOrderPrice();
    else if (e.target.closest('#d-form')) updateSummary();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modalOpen()) closeModal();
  });

  function tick() {
    if (document.visibilityState !== 'visible' || S.busy || modalOpen()) return;
    if (S.route === 'confirmation') { if (!Object.keys(S.pending).length) loadQueue(false, true); }
    else if (S.route === 'suivi') loadTracking();
    else refreshCount();
  }

  /* ================================================================ */
  /* Démarrage                                                        */
  /* ================================================================ */

  var firstSpec = preloadSpec(currentRoute());
  call('api_bootstrap', firstSpec).then(function (b) {
    S.boot = b;
    if (b.preload && firstSpec && b.preload.key === firstSpec.key) S.preloaded[firstSpec.key] = b.preload.data;
    applyCounts(b.counts);
    $all('[data-shop]').forEach(function (el) { el.textContent = b.shop; });
    $all('[data-user-name]').forEach(function (el) { el.textContent = b.user.name; });
    $all('[data-user-mail]').forEach(function (el) { el.textContent = b.user.email; });
    $all('[data-admin]').forEach(function (el) { el.hidden = !b.user.admin; });
    $all('[data-stockrole]').forEach(function (el) { el.hidden = !b.user.stock; });
    $all('[data-more]').forEach(function (el) { el.hidden = !(b.user.admin || b.user.stock); });
    window.addEventListener('hashchange', go);
    go();
    if (!b.counts) refreshCount();
    setInterval(tick, 60000);
  }).catch(function (e) {
    view.innerHTML = errorBox(e) +
      '<p class="sub" style="margin-top:12px">Vérifiez que le classeur est partagé avec votre adresse Google (en Éditeur), puis rechargez la page.</p>';
  });
})();
</script>
